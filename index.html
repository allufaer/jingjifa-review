{id:'ht01',k:1,ch:'合同',type:'single',q:'根据合同法律制度的规定，下列有关要约的表述中，正确的是（　）。',o:['要约只能向特定的相对人发出','要约与撤回要约的通知同时到达受要约人的，不影响要约生效','要约一旦生效一概不得撤销','要约因要约人依法撤销要约而失效'],a:'D',e:'A错：特殊情况下可向不特定人发出；B错：撤回通知不晚于要约到达的，要约被撤回、不生效；C错：除法定不得撤销情形外，承诺作出前可撤销。'},
{id:'ht02',k:1,ch:'合同',type:'single',q:'甲4月24日向乙发函：“以每吨5000元出售螺纹钢100吨，如欲购买请于5月10日前让本人知悉”。乙4月27日收到，次日回函愿购，因投递错误于5月11日到达。甲未理会，将钢材另售他人。下列说法正确的是（　）。',o:['合同未成立，甲不承担责任','合同未成立，但乙可要求赔偿信赖利益损失','合同成立但未生效，甲可撤销要约','合同成立且已生效，乙有权要求甲履行合同'],a:'D',e:'乙在期限内发出承诺，因“迟发”以外的原因迟到，若要约人及时通知不接受，合同不成立；甲未通知，承诺有效，合同成立并生效。'},
{id:'ht03',ch:'合同',type:'single',q:'甲、乙约定采用合同书订立买卖合同。甲公司签字盖章后尚未寄出，即收到乙公司依约发来的货物，甲清点入库。次日甲将签字盖章的合同寄给乙，乙签章。该合同成立时间是（　）。',o:['甲公司签字盖章时','乙公司签字盖章时','甲公司接受乙公司发来的货物时','甲公司将合同寄给乙公司时'],a:'C',e:'虽约定采用合同书形式，但一方已履行主要义务、对方接受时，合同成立。'},
{id:'ht04',ch:'合同',type:'single',q:'甲公司为干扰竞争对手乙公司，本不需要某合同项目，却向丙公司提出更优条件，致丙搁置与乙的谈判；乙退出后甲随即终止磋商，并将知悉的丙公司商业秘密泄露给丁。下列说法正确的是（　）。',o:['甲无须向丙承担任何责任','甲应向丙承担违约责任','甲应向乙承担缔约过失责任','甲应向丙承担缔约过失责任'],a:'D',e:'甲在与丙磋商中假借订立合同恶意磋商、泄露商业秘密，应向丙承担缔约过失责任。'},
{id:'ht05',ch:'合同',type:'single',q:'周某向吴某借用耕牛，约定借期3个月。1周后周某买牛，提出提前还牛。下列说法不正确的是（　）。',o:['如提前还牛不损害吴某利益，吴某应当接受','如提前还牛损害吴某利益，吴某有权拒绝','如提前还牛给吴某增加费用，吴某有权请求周某支付','不论何时归还，吴某均应无条件接受'],a:'D',e:'债权人可以拒绝债务人提前履行，但提前履行不损害债权人利益的除外；因提前履行增加的费用由债务人负担。'},
{id:'ht06',ch:'合同',type:'single',q:'2026年1月，A市甲公司与B市乙公司在C市签订买卖合同，约定2026年6月在D市交货付款，未约定价格。5月起榴莲价格飞涨，协商不成且无法依交易习惯确定。该批榴莲应执行（　）。',o:['2026年1月时D市的市场价格','2026年6月时C市的市场价格','2026年1月时B市的市场价格','2026年6月时A市的市场价格'],a:'A',e:'价款约定不明的，按“订立合同时履行地”的市场价格履行，即2026年1月、D市。'},
{id:'ht07',ch:'合同',type:'single',q:'甲、乙签订买卖合同，约定甲支付货款一周后乙交付货物。甲未按期付款却请求乙交货。乙可行使的抗辩权是（　）。',o:['不安抗辩权','先诉抗辩权','同时履行抗辩权','后履行抗辩权'],a:'D',e:'双务合同有先后履行顺序，先履行一方未履行的，后履行一方有权拒绝其履行请求，为后履行抗辩权。'},
{id:'ht08',ch:'合同',type:'single',q:'甲医院欠乙公司设备款300万元已1年，丙公司欠甲医院医疗服务费500万元已2年，甲医院经常催告但未起诉或申请仲裁。乙公司拟行使代位权。下列说法正确的是（　）。',o:['由于甲医院经常催告，乙无权行使代位权','乙行使代位权将导致甲医院对丙公司的诉讼时效中止','乙行使代位权以300万元为限','乙提起代位权之诉应以甲医院和丙公司为共同被告'],a:'C',e:'A错：须以诉讼或仲裁方式主张权利才不构成怠于行使；B错：代位权行使导致诉讼时效中断；D错：债权人是原告，债务人的相对人是被告，债务人为第三人。'},
{id:'ht09',ch:'合同',type:'single',q:'甲公司欠乙公司到期货款100万元无力清偿，丙公司欠甲公司到期租金150万元。甲、丙达成以物抵债协议，丙以价值50万元的小汽车抵偿全部租金，丙对甲欠乙货款知情。乙可以主张的是（　）。',o:['请求丙向乙交付小汽车','请求丙向乙清偿150万元','请求撤销甲、丙之间的以物抵债协议','请求拍卖、变卖小汽车并优先受偿'],a:'C',e:'以明显不合理低价以物抵债，且相对人知情，损害债权人利益，债权人可行使债权人撤销权。'},
{id:'ht10',ch:'合同',type:'single',q:'乙公司将其对甲公司享有的300万元债权转让给丙公司。该转让对甲公司发生效力的时间是（　）。',o:['乙、丙签订转让合同时','乙向甲发出转让通知时','甲收到乙的转让通知时','甲发出同意通知时'],a:'C',e:'债权人转让债权，未通知债务人的，该转让对债务人不发生效力；通知到达债务人时对其生效。'},
{id:'ht11',ch:'合同',type:'single',q:'王某向服装厂支付全部货款后下落不明，致服装厂无法交货。服装厂可以采取的措施是（　）。',o:['行使留置权','将服装向有关机关提存','行使不安抗辩权','行使代位权'],a:'B',e:'债权人下落不明，难以履行债务的，债务人可以将标的物提存。留置权、代位权由债权人行使，不安抗辩权由先履行方行使。'},
{id:'ht12',ch:'合同',type:'single',q:'甲公司与乙公司3月签订木材买卖合同，约定7月1日交货。5月中旬甲通知乙因原木紧缺不能履行。乙6月1日诉至法院。下列说法正确的是（　）。',o:['乙有权解除合同并追究甲公司违约责任','乙有权主张合同无效并追究缔约过失责任','乙有权撤销合同并追究缔约过失责任','合同有效，但乙至7月1日才有权主张违约责任'],a:'A',e:'甲构成预期违约，乙可立即解除合同，并在履行期限届满前主张违约责任。'},
{id:'ht13',ch:'合同',type:'single',q:'赵某将名家手稿转让给钱某，约定2025年8月1日交付。7月15日赵某家乡发生特大洪水，手稿被泡毁。下列说法正确的是（　）。',o:['赵某有权通知钱某解除买卖合同','经钱某同意，合同可以解除','钱某有权要求赵某承担违约责任','钱某有权要求交付其他同级别名家手稿'],a:'A',e:'因不可抗力致合同目的不能实现，赵某享有法定解除权，通知即可解除；不可抗力部分或全部免除违约责任。'},
{id:'ht14',ch:'合同',type:'single',q:'甲公司向乙公司出售200台电视机，乙交付定金20万元。第一批100台在运输中遇泥石流全部毁损；第二批100台被甲公司债权人丙强行扣押变卖。关于甲公司定金责任，正确的是（　）。',o:['无须承担定金责任，因不可抗力和第三人原因导致','须承担全部定金责任','只须承担一半定金责任，因不可抗力导致的第一批不适用定金罚则','只须承担一半定金责任，因第三人原因造成的第二批不适用定金罚则'],a:'C',e:'第一批因不可抗力毁损，免除违约责任；第二批因第三人原因违约，不能免除，应承担定金责任。'},
{id:'ht15',ch:'合同',type:'single',q:'甲将汽车卖给乙并交付，又将该车卖给不知情的丙并办理过户登记。下列说法正确的是（　）。',o:['乙、丙均不能取得所有权','乙、丙抽签决定归属','乙取得所有权','丙取得所有权'],a:'C',e:'特殊动产一物二卖，已受领交付的买受人请求将所有权登记在自己名下的，人民法院应予支持。'},
{id:'ht16',ch:'合同',type:'single',q:'甲公司向乙公司购买汽车，总价200万元，分10次付清。甲支付6次共120万元后停止付款，已有2个月未付，经催告合理期限内仍未付。下列说法不正确的是（　）。',o:['乙有权要求甲一次性付清余下80万元','乙有权通知甲解除合同','乙解除合同的，有权收取汽车使用费','乙解除合同的，不得收取汽车使用费'],a:'D',e:'分期付款买受人未支付到期价款达全部价款1/5，经催告后合理期限内仍未支付的，出卖人可请求支付全部价款或解除合同；解除时可要求支付标的物使用费。'},
{id:'ht17',ch:'合同',type:'single',q:'赵某与甲公司签订试用买卖合同，试用期15天。下列说法不正确的是（　）。',o:['试用3天即支付部分价款，视为同意购买','学习机在试用期间被洪水泡毁，赵某应支付价款','试用期满第2天才归还，甲公司有权拒绝受领','试用一周后出租给钱某，视为同意购买'],a:'B',e:'试用买卖标的物在试用期内毁损、灭失的风险由出卖人承担；试用期届满未表示的视为购买。'},
{id:'ht18',ch:'合同',type:'single',q:'甲公司与乙公立学校签订捐赠协议，捐款1000万元专用于购买专业书籍。甲公司支付300万元后因资金链断裂、经营状况严重恶化，无力支付剩余捐款。下列说法正确的是（　）。',o:['甲公司可撤销赠与并请求返还300万元','不得撤销已付300万元，但未付700万元可撤销','应继续支付700万元并赔偿损失','甲公司可以不再支付剩余700万元'],a:'D',e:'赠与人的经济状况显著恶化，严重影响其生产经营或者家庭生活的，可以不再履行赠与义务。'},
{id:'ht19',ch:'合同',type:'single',q:'某公司在赈灾义演会上当众宣布向救灾基金捐赠100万元，事后迟迟未付。下列说法符合规定的是（　）。',o:['该捐赠允诺无法律约束力，但应受舆论谴责','该捐赠允诺无法律约束力，因赠与合同是实践合同','该允诺有约束力，但公司可在支付前撤销','该允诺有约束力，公司无权撤销，受赠人有权要求支付'],a:'D',e:'具有救灾、扶贫、助残等公益、道德义务性质的赠与合同或者经过公证的赠与合同，不得任意撤销；不交付的，受赠人可以要求交付。'},
{id:'ht20',ch:'合同',type:'single',q:'甲公司向乙银行借款100万元，10月5日签订合同，借款期至次年10月4日。因银行失误，11月5日才放款且预扣利息5万元。下列说法正确的是（　）。',o:['借款合同于11月5日成立','甲公司有权请求乙银行承担违约责任','甲公司应按100万元本金偿还','甲公司应按100万元本金支付利息'],a:'B',e:'向金融机构借款的合同为诺成合同，10月5日成立并生效，银行未按期放款构成违约；利息不得预先扣除，应按实际借款95万元返还并计息。'},
{id:'ht21',k:1,ch:'合同',type:'single',q:'张某向李某借款100万元，约定年利率10%，逾期利率为贷款利率的1.5倍，违约金每日0.05%。逾期1年（365日），合同成立时1年期LPR为3.65%。法院支持的最高逾期利息与违约金合计为（　）。',o:['33.25万元','15万元','18.25万元','14.6万元'],a:'D',e:'逾期利率15%、违约金年率18.25%，合计超过LPR4倍（3.65%×4＝14.6%）；民间借贷逾期利息、违约金等总计不得超过LPR4倍，故最高为14.6万元。'},
{id:'ht22',ch:'合同',type:'single',q:'下列有关租赁合同的说法中，正确的是（　）。',o:['书面约定租期30年的，超过20年部分为不定期租赁','租期2个月但未签书面合同，为不定期租赁','租期10年但未签书面合同，为不定期租赁','不定期租赁的当事人可以随时解除合同，但应在合理期限前通知对方'],a:'D',e:'A错：超过20年的部分无效；B、C错：租期6个月以上应采书面形式，未采用且无法确定期限的才视为不定期租赁。'},
{id:'ht23',ch:'合同',type:'single',q:'甲公司将房屋出租给乙，租期5年。租期内屋顶漏水，甲公司拒不修理，乙自行修理支付2000元。甲公司要求调高租金遭拒，遂准备将房屋出卖给丙。下列说法不正确的是（　）。',o:['维修费2000元应由甲公司承担','甲公司无权在租期内单方决定调高租金','甲公司在租期内出卖房屋应征得乙同意','出卖时同等条件下乙享有优先购买权'],a:'C',e:'出租人出卖租赁房屋的，应在出卖前合理期限内通知承租人，承租人享有同等条件下的优先购买权，但无须征得承租人同意。'},
{id:'ht24',ch:'合同',type:'single',q:'甲公司与乙公司签订融资租赁合同，乙公司按甲公司要求向丙公司购买大型仪器并出租给甲公司。丙交付后，甲公司将该仪器质押给丁公司并交付。丁占有期间，该仪器的所有权人是（　）。',o:['甲公司','乙公司','丙公司','丁公司'],a:'B',e:'融资租赁期间，租赁物所有权归出租人（乙公司）；丁公司最多享有质权。'},
{id:'ht25',ch:'合同',type:'single',q:'甲向乙借款200万元，期限至2025年12月31日，丙为保证人，未约定保证期间。2025年6月甲追加借款100万元并延长全部借款至2026年12月31日，丙不知情。丙的保证责任是（　）。',o:['200万元，至2026年12月31日','300万元，至2026年6月30日','300万元，至2026年12月31日','200万元，至2026年6月30日'],a:'D',e:'未经保证人书面同意加重债务的，保证人对加重部分不承担责任；未约定保证期间的为主债务履行期届满之日起6个月，且未经同意变更履行期限不影响保证期间。'},
{id:'ht26',ch:'合同',type:'single',q:'甲公司以自有房屋设定抵押向乙银行借款，丙公司提供连带责任保证，各方未约定担保权行使顺序。借款到期甲无力还款。下列说法正确的是（　）。',o:['乙应先请求丙承担保证责任','乙可先请求丙承担保证责任','乙应当先就甲的房屋实现债权','乙可以先就甲的房屋实现债权'],a:'C',e:'共同担保且未约定顺序时，债务人自己提供物的担保的，债权人应当先就该物的担保实现债权。'},

{id:'ht27',ch:'合同',type:'multi',q:'下列当事人订立合同的形式中，属于书面形式的有（　）。',o:['甲公司和乙公司通过传真订立合同','丙公司和丁公司通过电子邮件订立合同','赵某和钱某通过打电话订立合同','孙某和李某不约而同发出内容相同的要约而订立合同'],a:['A','B'],e:'传真、电子邮件等可以有形地表现所载内容的形式属于书面形式；电话为口头形式，D为其他形式。'},
{id:'ht28',ch:'合同',type:'multi',q:'下列各项属于要约邀请的有（　）。',o:['拍卖公告','招标公告','招股说明书','寄送的价目表'],a:['A','B','C','D'],e:'拍卖公告、招标公告、招股说明书、债券募集办法、基金招募说明书、寄送的价目表等为要约邀请。'},
{id:'ht29',ch:'合同',type:'multi',q:'下列有关要约撤销的说法中，符合规定的有（　）。',o:['受要约人有理由认为要约不可撤销，且已为履行合同做合理准备工作的，该要约不可撤销','撤销要约以非对话方式作出的，应在受要约人收到要约之前到达','要约以对话方式作出的，该要约不可撤销','要约人在要约中载明要约不可撤销的，该要约不可撤销'],a:['A','D'],e:'B、C错：撤销通知应在受要约人作出承诺之前到达或为其所知；对话要约同样可以撤销，只要在承诺前告知。'},
{id:'ht30',ch:'合同',type:'multi',q:'下列格式条款中，应当认定为无效的有（　）。',o:['违反公序良俗的格式条款','不合理地限制对方主要权利的格式条款','合理地限制对方主要权利的格式条款','排除对方主要权利的格式条款'],a:['A','B','D'],e:'提供格式条款一方不合理地免除或减轻其责任、加重对方责任、限制对方主要权利，或者排除对方主要权利的，该条款无效；合理限制并不当然无效。'},
{id:'ht31',ch:'合同',type:'multi',q:'当事人就合同内容约定不明确，依交易习惯仍不能确定的，下列法定规则表述正确的有（　）。',o:['价款不明确的，按货物交付时履行地的市场价格履行','履行地点不明确的，给付货币的，在接受货币一方所在地履行','质量要求不明确的，一律按通常标准履行','履行方式不明确的，按照有利于实现合同目的的方式履行'],a:['B','D'],e:'A错：价款按“订立合同时”履行地市场价格；C错：质量依次按强制性国标、推荐性国标、行业标准，无国标行业标准的才按通常标准或符合合同目的的特定标准。'},
{id:'ht32',ch:'合同',type:'multi',q:'甲学校委托乙服装厂加工1200套校服，约定其中200套可由丙厂加工，但均须按甲提供的样品加工，验收合格同时付款。验收时发现丙厂加工的200套不符样品要求。下列说法正确的有（　）。',o:['甲有权要求乙承担违约责任','甲有权要求丙承担违约责任','甲有权拒绝支付该200套校服的价款','甲有权要求乙重新加工200套合格校服'],a:['A','C','D'],e:'由第三人履行债务的，第三人不履行或履行不符合约定的，债务人（乙）向债权人承担违约责任；200套未验收合格，甲可行使同时履行抗辩权拒付相应价款。'},
{id:'ht33',ch:'合同',type:'multi',q:'甲公司向乙公司购买设备，约定甲先付款，乙收款后3日内交货。甲付款时发现乙经营严重困难、已丧失履行能力。甲有权（　）。',o:['直接通知乙解除合同','通知乙中止履行，如乙收到通知后直接交付设备，甲应付款','通知乙中止履行，如乙提供交货担保，甲应付款','通知乙中止履行，如乙合理期限内未恢复能力也未提供担保，甲可解除合同但不能要求违约责任'],a:['B','C'],e:'甲可行使不安抗辩权中止履行并通知；乙恢复能力或提供适当担保的应恢复履行；合理期限内既未恢复又未提供担保的，视为预期违约，甲可解除合同并主张违约责任。'},
{id:'ht34',ch:'合同',type:'multi',q:'甲对乙享有5万元到期债权，乙怠于行使下列债权，甲可以行使代位权的有（　）。',o:['个体工商户张某欠付乙的3个月工资1.2万元','刘某欠付乙的到期房屋租金8000元','赵某欠付乙的赌债6000元','孙某欠付乙的3个月前到期的借款2万元'],a:['B','D'],e:'A属于专属于债务人自身的权利（劳动报酬），不得代位；C赌债不合法，不得代位。'},
{id:'ht35',ch:'合同',type:'multi',q:'2025年3月1日，甲、乙签订买卖合同，约定甲3月15日交货、乙4月15日付款，且合同债权不得转让。3月15日甲交货，4月1日甲将债权转让给丙，4月5日通知乙。乙以转让违约为由拒付。下列说法正确的有（　）。',o:['通知乙前，甲、丙之间的债权转让合同未生效','甲转让债权的行为构成违约','只有丙对禁转约定不知情时，该约定才对丙不产生约束力','不论丙是否知情，该约定对丙均不产生约束力'],a:['B','D'],e:'债权转让合同自甲、丙达成合意时生效，通知到达乙时对乙生效；甲违反禁转约定构成违约；当事人约定金钱债权不得转让的，不得对抗第三人，不论第三人是否知情。'},
{id:'ht36',ch:'合同',type:'multi',q:'有关法定抵销的行使条件及要求，下列表述正确的有（　）。',o:['债务的标的物种类、品质相同','债务均到期','当事人主张抵销的，应当通知对方','抵销不得附条件或者附期限'],a:['A','C','D'],e:'B错：一方的债务到期、另一方的债务未到期，未到期一方也可主张抵销。'},
{id:'ht37',k:1,ch:'合同',type:'multi',q:'下列有关不同种类违约责任相互关系的表述中，正确的有（　）。',o:['当事人就迟延履行约定违约金的，违约方支付违约金后，还应当履行债务','约定的违约金过分高于造成的损失的，可请求适当减少','当事人既约定违约金又约定定金的，一方违约时，对方可以同时适用','执行定金条款后不足以弥补损害的，仍可请求赔偿超过定金数额的损失'],a:['A','B','D'],e:'C错：违约金与定金只能选择适用，不能并用。'},
{id:'ht38',ch:'合同',type:'multi',q:'甲将货物运至乙指定仓库，乙验收并支付80%货款，但甲未交付产品合格证和原产地证明。交货当晚山洪暴发，货物全部毁损。下列说法正确的有（　）。',o:['乙应当支付剩余20%货款','甲未交付单证构成违约，但货物损失由乙承担','乙有权解除合同并请求返还已付80%货款','甲有权要求支付余款，但应补交已毁损货物'],a:['A','B'],e:'货物已交付，风险由买受人乙承担；未交付单证构成违约但不影响风险转移，也不导致合同目的不能实现，不构成法定解除。'},
{id:'ht39',ch:'合同',type:'multi',q:'根据合同法律制度的规定，下列有关融资租赁合同中租赁物的说法中，正确的有（　）。',o:['承租人履行占有租赁物期间的维修义务','租赁期间出租人享有租赁物的所有权','承租人破产的，租赁物属于破产财产','出租人和承租人可以约定租赁期间届满租赁物的归属'],a:['A','B','D'],e:'C错：融资租赁期间租赁物所有权归出租人，承租人破产时不属于破产财产。'},

{id:'ht40',ch:'合同',type:'judge',q:'政府机关参与的合同，应当按照行政法的相关规定解决纠纷，不适用《民法典》合同编的规定。',a:false,e:'政府机关作为平等主体与对方签订合同时，适用《民法典》合同编的规定。'},
{id:'ht41',ch:'合同',type:'judge',q:'对格式条款的理解发生争议的，一律作出不利于提供格式条款一方的解释。',a:false,e:'有通常理解的，应按通常理解解释；只有在有两种以上解释时，才作出不利于提供格式条款一方的解释。'},
{id:'ht42',ch:'合同',type:'judge',q:'债务人将债务的全部或者部分转移给第三人，应当经债权人同意；债权人未作表示的，视为同意。',a:false,e:'债权人未作表示的，视为“不同意”，而非同意。'},
{id:'ht43',ch:'合同',type:'judge',q:'债务人一旦提存标的物即不得要求取回；债权人自提存之日起5年内不领取的，提存物归国家所有。',a:false,e:'债权人未履行对债务人的到期债务，或者书面表示放弃领取提存物的，债务人负担提存费用后有权取回提存物。'},
{id:'ht44',ch:'合同',type:'judge',q:'当事人就迟延履行约定违约金的，违约方支付违约金后，还应当履行债务。',a:true,e:'迟延履行违约金不免除继续履行的义务。'},
{id:'ht45',ch:'合同',type:'judge',q:'试用买卖合同的标的物在试用期内毁损、灭失的，风险由买受人承担。',a:false,e:'试用期内标的物毁损、灭失的风险由出卖人承担。'},
{id:'ht46',ch:'合同',type:'judge',q:'在借款合同中，借款人提前返还借款的，仍应按原约定的借款期限计息并支付。',a:false,e:'除当事人另有约定外，借款人提前返还借款的，应按实际借款期间计算利息。'},
{id:'ht47',ch:'合同',type:'judge',q:'出借人与借款人既约定逾期利率，又约定违约金或其他费用的，出借人不得一并主张。',a:false,e:'可以一并主张，但总计不得超过合同成立时1年期LPR的4倍。'},
{id:'ht48',ch:'合同',type:'judge',q:'租赁物在承租人按照租赁合同占有期限内发生所有权变动的，新所有权人有权向承租人主张解除租赁合同。',a:false,e:'“买卖不破租赁”，所有权变动不影响租赁合同的效力。'},
{id:'ht49',ch:'合同',type:'judge',q:'在融资租赁合同中，租赁物在使用过程中发生部件磨损需要维修的，应由出租人承担维修义务。',a:false,e:'承租人应当履行占有租赁物期间的维修义务。'},
{id:'ht50',ch:'合同',type:'judge',q:'甲公司因扩大生产经营需要向乙银行借款，由A公立大学提供连带责任保证，该保证合同有效。',a:false,e:'以公益为目的的非营利性学校、幼儿园、医疗机构、养老机构等提供保证的，保证合同无效。'},
{id:'ht51',ch:'合同',type:'judge',q:'保证合同可以是单独订立的书面合同，也可以是主债权债务合同中的保证条款。',a:true,e:'这是保证合同的法定形式。'},
{id:'ht52',ch:'合同',type:'judge',q:'连带责任保证的债权人在保证期间届满前请求保证人承担保证责任的，从保证期间届满之日起开始计算保证债务的诉讼时效。',a:false,e:'应从“债权人请求保证人承担保证责任之日”起计算保证债务的诉讼时效。'},

]);


window.BANK_PARTS = window.BANK_PARTS || [];
window.BANK_PARTS.push([
/* ================= 补充题库：依据《经济法习题》PDF 查漏补缺 ================= */
{id:'dl27',ch:'导论',type:'judge',q:'我国法律效力层级：宪法﹥法律﹥行政法规﹥地方性法规。',a:true,e:'法律规范的效力等级：宪法＞法律＞行政法规＞地方性法规＞本级和下级地方政府规章；宪法效力最高。'},
{id:'dl28',ch:'导论',type:'judge',q:'经济法律责任首要目的是保护社会公共利益。',a:true,e:'经济法律责任的第一目的是保护社会公共利益不受侵犯，而非单纯惩罚违法主体或补偿受害人。'},
{id:'dz27',ch:'个人独资',type:'single',k:1,q:'林某以个人财产出资设立一个人独资企业，聘请陈某管理该企业事务。林某病故后，因企业负债较多，林某的妻子作为唯一继承人明确表示不愿继承该企业，该企业只得解散。关于该企业清算人的下列表述中，正确的是（）。',o:['由陈某进行清算','由林某的妻子进行清算','由债权人进行清算','由债权人申请法院指定清算人进行清算'],a:'D',e:'投资人死亡且继承人放弃继承的，企业解散；投资人已死亡无法自行清算，债权人可以申请人民法院指定清算人进行清算。'},
{id:'dz28',ch:'个人独资',type:'single',k:1,q:'下列关于个人独资企业解散后原投资人责任的表述中，符合《个人独资企业法》规定的是（）。',o:['原投资人对个人独资企业存续期间的债务不再承担责任','原投资人对个人独资企业存续期间的债务承担责任，但债权人在1年内未向债务人提出偿债请求的，该责任消灭','原投资人对个人独资企业存续期间的债务承担责任，但债权人在2年内未向债务人提出偿债请求的，该责任消灭','原投资人对个人独资企业存续期间的债务承担责任，但债权人在5年内未向债务人提出偿债请求的，该责任消灭'],a:'D',e:'个人独资企业解散后，原投资人对企业存续期间的债务仍应承担偿还责任，但债权人在5年内未提出偿债请求的，该责任消灭。'},
{id:'dz29',ch:'个人独资',type:'multi',k:1,q:'根据个人独资企业法律制度的规定，下列各项中，可以用作个人独资企业名称的有（）。',o:['云滇针织品有限公司','昆海化妆品经销公司','樱园服装设计中心','霞光婚纱摄影工作室'],a:['C','D'],e:'个人独资企业的名称中不得使用“有限”“有限责任”或“公司”字样，可以使用厂、店、部、中心、工作室等字样，故C、D正确。'},
{id:'dz30',ch:'个人独资',type:'multi',q:'下列有关个人独资企业设立条件的表述中，符合个人独资企业法律制度规定的有（）。',o:['投资人可以是中国公民，也可以是外国公民','投资人可以家庭共有财产作为个人出资','企业名称中不得使用“公司”字样','企业必须有符合规定的最低注册资本'],a:['B','C'],e:'投资人只能是一个中国自然人；可以家庭共有财产作为个人出资；名称中不得使用“公司”字样；法律未规定最低注册资本，故B、C正确。'},
{id:'dz31',ch:'个人独资',type:'judge',q:'某个人独资企业投资人在申请企业设立登记时明确以其家庭共有财产作为个人出资，为维持其他家庭成员的基本生活条件，该投资人应以其个人财产对企业债务承担无限责任。',a:false,e:'投资人明确以家庭共有财产作为个人出资的，应当依法以家庭共有财产对企业债务承担无限责任，不能仅以个人财产承担。'},
{id:'dz32',ch:'个人独资',type:'judge',q:'个人独资企业的投资人在申请企业设立登记时，未明确以其家庭共有财产作为个人出资的，在个人独资企业财产不足以清偿债务时，可不以其家庭共有财产对企业债务承担无限责任。',a:true,e:'投资人未明确以家庭共有财产作为个人出资的，企业财产不足清偿债务时，以其个人财产承担无限责任，可不以家庭共有财产承担。'},
{id:'dz33',ch:'个人独资',type:'judge',q:'个人独资企业解散后，其债权人在2年内未向原投资人提出偿债请求的，原投资人的偿还责任消失。',a:false,e:'个人独资企业解散后，原投资人的偿债责任在债权人5年内未提出偿债请求时消灭，而非2年。'},
{id:'dz34',ch:'个人独资',type:'multi',k:1,q:'根据个人独资企业法律制度的规定，下列关于个人独资企业法律特征的表述中，正确的有（）。',o:['个人独资企业虽然不具有法人资格，但具有独立承担民事责任的能力','个人独资企业是由一个自然人投资的企业，并且自然人只能是中国公民','个人独资企业的投资人对企业的债务承担无限责任','个人独资企业是独立的民事主体，可以自己的名义从事民事活动'],a:['B','C','D'],e:'个人独资企业不具有法人资格，其民事责任最终由投资人承担，A项错误；投资人须为一个中国自然人，B项正确；投资人承担无限责任，C项正确；企业是独立民事主体，可以自己名义从事民事活动，D项正确。'},
{id:'gs56',ch:'公司',type:'single',q:'赵某、钱某、孙某和李某拟共同投资设立甲有限责任公司，拟定的公司章程中载明了股东的出资形式如下，其中不符合公司法律制度规定的是（）。',o:['赵某以其所有的商标权出资','钱某以其所有的小汽车出资','孙某以其取得的某项特许经营权出资','李某以其所有的非专利技术出资'],a:'C',e:'股东可以用货币出资，也可以用实物、知识产权、土地使用权、股权、债权等可以用货币估价并可以依法转让的非货币财产作价出资。法律、行政法规规定不得作为出资的财产（如劳务、信用、自然人姓名、商誉、特许经营权等）除外。'},
{id:'gs57',ch:'公司',type:'single',q:'在乙有限责任公司设立过程中，出资人甲以设立中的乙公司名义与他人签订一份房屋租赁合同，所租房屋供筹建乙公司之用。乙公司成立后，将该房屋作为公司办公用房。下列有关房屋租赁合同责任承担的说法中，正确的是（）。',o:['甲承担','乙公司承担','甲、乙公司连带承担','先由甲承担，乙公司承担补充责任'],a:'B',e:'发起人/出资人为设立公司以设立中公司名义与他人签订合同，公司成立后自动承受该合同的权利义务，或者公司成立后已经实际享受合同权利或履行合同义务的，由成立后的公司承担责任。'},
{id:'gs58',ch:'公司',type:'single',q:'陈某是甲有限责任公司的股东。经查，该股东未按期足额缴纳公司章程规定的出资。公司对陈某采取了相应措施，但陈某仍未履行出资义务。公司决议陈某丧失其未缴纳出资的股权，陈某对此有异议。下列各项中，符合公司法律制度规定的是（）。',o:['甲公司董事会负责核查陈某出资情况','陈某收到的催缴书载明宽限期为自公司发出催缴书之日起30日','甲公司实际控制人李某以口头方式通知陈某丧失其股权','陈某应当自接到失权通知之日起15日内提起失权异议之诉'],a:'A',e:'选项A正确：董事会应当对股东的出资情况进行核查；选项B错误：催缴书载明的宽限期应当不少于60日；选项C错误：失权通知应当由公司以书面形式发出；选项D错误：股东对失权有异议的，应当自接到失权通知之日起“30日内”向人民法院提起诉讼。'},
{id:'gs59',ch:'公司',type:'single',q:'甲有限责任公司的股东林某认缴出资20万元，出资期限为2023年12月31日。2024年7月8日，林某在未缴纳出资的情况下将其股权全部转让给徐某。徐某知道林某未缴纳出资的情况。对于该出资义务的承担应当采取的处理方式是（）。',o:['由林某承担出资义务，徐某无须承担','由徐某承担出资义务，林某无须承担','由林某承担出资义务，徐某承担补充责任','由林某和徐某承担连带责任'],a:'D',e:'股东转让已到期未缴纳出资的股权，受让人知道或者应当知道该情形的，由受让人与该股东在未缴纳出资的范围内承担连带责任。'},
{id:'gs60',ch:'公司',type:'single',q:'盘龙公司选任新董事，股东推荐的候选人情况如下，其中不具备公司法律制度规定的董事任职资格的是（）。',o:['周某因侵占财产被判处缓刑，缓刑考验期上月底刚满','吴某曾因病丧失民事行为能力，现已痊愈、恢复民事行为能力','郑某曾因严重交通违法行为被吊销驾驶证','王某因家庭购买住房而负有数额较大的住房贷款'],a:'A',e:'因贪污、贿赂、侵占财产、挪用财产或者破坏社会主义市场经济秩序，被判处刑罚，执行期满未逾5年，或者因犯罪被剥夺政治权利，执行期满未逾5年的，不得担任董监高。被判处缓刑的，缓刑考验期满之日起计算5年；周某考验期刚满，未逾5年，不具备任职资格。'},
{id:'gs61',ch:'公司',type:'single',q:'甲公司、乙公司均为股份有限公司，赵某持有甲公司0.8%股份，甲公司持有乙公司85%股份；周某是甲公司的总经理、法定代表人，吴某是乙公司的总经理、法定代表人。某日，赵某发现吴某在周某的授意下处置乙公司的主要财产，认为周某、吴某的行为损害了甲公司、乙公司的利益，拟采取下列措施，其中，合法的是（）。',o:['向甲公司申请查阅甲公司的财务会计报告','向乙公司申请查阅乙公司的财务会计报告','以周某为被告，提起股东代表诉讼','以吴某为被告，提起双重股东代表诉讼'],a:'A',e:'选项A正确：股份有限公司股东有权查阅本公司的财务会计报告；选项B错误：赵某不是乙公司的直接股东，无权直接查阅乙公司报告；选项C、D错误：提起股东代表诉讼（含双重股东代表诉讼）需要满足“连续180日以上单独或者合计持有公司1%以上股份”的前置条件，赵某持股仅0.8%，不具备提起诉讼的主体资格。'},
{id:'gs62',ch:'公司',type:'single',q:'下列有关公积金的表述中，正确的是（）。',o:['任意公积金和法定公积金不足以弥补亏损的，可以使用资本公积金弥补亏损','法定公积金不得转增资本','法定公积金累计提取到30%可以不再提取','超过股票票面金额发行所得的溢价款列入盈余公积金'],a:'A',e:'新《公司法》打破了以往“资本公积金不得用于弥补公司亏损”的限制，规定公积金弥补公司亏损，应当先使用任意公积金和法定公积金；仍不能弥补的，可以使用资本公积金（选项A正确）。法定公积金可以转增资本；累计达到注册资本50%以上可不再提取；溢价款列入资本公积金。'},
{id:'gs63',ch:'公司',type:'single',q:'根据公司法律制度的规定，有关资本公积金的下列说法中，正确的是（）。',o:['公司税后利润不足以弥补亏损的，应当优先使用资本公积金弥补','发行面额股的公司，股本溢价款应当列入资本公积金','发行无面额股的公司，应当至少将发行所得股款的1/3列入资本公积金','公司资本公积金仅得用于弥补亏损'],a:'B',e:'选项A错误：应当优先使用任意公积金和法定公积金弥补；选项B正确：发行面额股溢价款计入资本公积金；选项C错误：发行无面额股的，应当将发行所得股款的3/4以上计入股本，其余列入资本公积金；选项D错误：资本公积金还可以转增资本。'},
{id:'gs64',ch:'公司',type:'single',q:'甲有限责任公司设股东会、董事会、监事会，该公司经理王某违反法律规定、股东会决议，拖延向股东张某分配利润，张某拟通过诉讼维护自己的权利。下列有关张某诉讼权利的表达中，正确的是（）。',o:['张某有权直接向人民法院起诉王某','张某有权书面请求监事会起诉王某','张某有权书面请求董事会起诉王某','张某有权书面请求股东会起诉王某'],a:'A',e:'董事、高级管理人员违反法律、行政法规或者公司章程的规定，损害股东利益的，股东可以直接向人民法院提起诉讼（此为股东直接诉讼，无须经过监事会/董事会前置程序）。'},
{id:'gs65',ch:'公司',type:'single',q:'下列主体中，属于确认公司董事会决议无效之诉的被告是（）。',o:['公司','对该决议投赞成票的董事','董事会','出席会议的董事'],a:'A',e:'股东、董事、监事等提起确认决议无效、撤销决议或确认决议不成立之诉的，均应以公司为被告。'},
{id:'gs66',ch:'公司',type:'single',q:'赵某、钱某、孙某和李某共同投资设立盘龙有限责任公司，2025年11月，赵某拟向周某转让其持有的盘龙公司的股权。已知，盘龙公司对股权转让事项没有特殊规定。赵某此次股权转让事项应当（）。',o:['征得钱某、孙某和李某的一致同意','至少征得钱某、孙某和李某中的二人同意','口头通知钱某、孙某和李某','书面通知钱某、孙某和李某'],a:'D',e:'新《公司法》取消了有限责任公司对外转让股权需“过半数股东同意”的规则，修改为：股东向股东以外的人转让股权的，应当将股权转让的数量、价格、支付方式和期限等事项书面通知其他股东，其他股东在同等条件下有优先购买权。'},
{id:'gs67',ch:'公司',type:'single',q:'赵某和钱某共同投资设立A有限责任公司，分别持股70%和30%。公司成立后，经营顺利，连续5年向股东分配利润。第6年，赵某主张将公司盈利用于技术革新，股东会作出不分配当年利润的决议。钱某因反对不分红决议，打算将股权转让。为了股权被准确估值，钱某向A公司书面申请查阅、复制会计账簿及会计凭证。下列有关本案的说法中，正确的是（）。',o:['钱某有权请求A公司以合理的价格回购其股权','钱某有权提起诉讼，请求人民法院裁定A公司分配第6年的利润','A公司有权以“为了股权被准确估值”属于不正当目的为由，拒绝钱某的请求','钱某有权请求查阅，但无权请求复制会计账簿及会计凭证'],a:'D',e:'异议股东股权收购请求权要求“公司连续5年不向股东分配利润，而公司该5年连续盈利并符合分配利润条件”，本题仅第6年不分配，不符合回购条件（A错）；查阅账簿凭证属于股东法定知情权，为了评估股权价值不属于“不正当目的”（C错）；有限责任公司股东有权查阅（但无权复制）公司会计账簿、会计凭证（D对）。'},
{id:'gs68',ch:'公司',type:'single',q:'2024年7月，甲、乙、丙、丁、戊5名自然人共同出资设立松果股份有限公司，持股比例依次为34%、31%、13%、17%、5%。松果公司股本总额为3000万元（每股面值1元），由5名股东组成董事会，公司章程授权董事会在公司成立之日起3年内择机决定发行1300万股股份。2025年初，松果公司董事会决议发行新股，甲反对，其他董事均同意，发行方案为A公司以价值500万元的专利权认购新股，B公司以800万元货币资金认购新股。有关本案的下列说法中，正确的是（）。',o:['由于授权发行的数量过多，该项授权无效','授权董事会发行新股只能由年度股东会作出决议，章程不得概括授权','由于甲反对，松果公司董事会关于发行新股的决议未通过','由于A公司以专利权认购新股，应由松果公司股东会决议通过'],a:'D',e:'公司章程或者股东会可以授权董事会在三年内决定发行不超过已发行股份50%的股份（设时3000万，授权1300万未超50%，授权有效，A、B错）；董事会作出授权发行新股决议需经全体董事2/3以上通过，5名董事中4人同意（超2/3），决议通过（C错）；但以非货币财产作价出资的，应当经股东会决议（D对）。'},
{id:'gs69',ch:'公司',type:'single',q:'股份有限公司股东行使下列股东权利，应当满足一定持股期限要求的是（）。',o:['临时提案权','自行召集和主持股东会会议','申请人民法院解散公司','临时股东会提议'],a:'B',e:'连续90日以上单独或者合计持有公司10%以上股份的股东，可以自行召集和主持股东会会议（有连续90日的持股期限要求）。临时提案权（单独或合计1%以上）、解散公司诉讼（单独或合计10%以上）、临时股东会提议权（单独或合计10%以上）均无持股期限要求。'},
{id:'gs70',ch:'公司',type:'single',k:1,q:'甲股份有限公司拟采用无面额股。下列各项中，符合公司法律制度规定的是（）。',o:['该公司可以就部分股份采用无面额股，其余股份采用面额股','该公司在采用无面额股后，还可以将其全部转换为面额股','该公司若将已发行的面额股转换为无面额股，转换的股份不应超过全部股份的1/2','该公司发行无面额股，应将未计入注册资本的股款计入盈余公积'],a:'B',e:'公司采用无面额股的，全部股份均为无面额股，不得部分面额部分无面额（A错）；采用无面额股后，可以经股东会决议将其全部转换为面额股（B对）；转换时必须全部转换，不得仅转换一部分（C错）；未计入注册资本的股款应当计入资本公积（D错）。'},
{id:'gs71',ch:'公司',type:'single',q:'2025年8月，甲上市公司拟选聘独立董事，下列人员中，不违背公司独立董事任职资格的是（）。',o:['某公司原法定代表人赵某，该公司因故于2023年被吊销执照，赵某负有个人责任','钱某，原为某图书馆工作人员，2024年底正式退休','孙某，某年因行贿罪被判处刑罚，刑满释放刚满3年','现任职于甲上市公司财务部的李某，原为某公司董事，该公司于2021年破产清算，李某负有个人责任'],a:'B',e:'选项A、D涉及因违法被吊销/破产清算负有个人责任未逾3年；选项C属于刑事犯罪刑满释放未逾5年；选项D中李某同时属于在上市公司任职的人员，亦缺乏独立性。钱某无任何禁止性事由且具备独立性，符合任职资格。'},
{id:'gs72',ch:'公司',type:'single',q:'下列有关国有独资公司的表述中，正确的是（）。',o:['经理由董事会聘任或者解聘','副董事长由董事会选举产生','履行出资人职责的机构可以授权董事会决定分配利润事项','董事会成员中的职工代表由履行出资人职责的机构指定'],a:'A',e:'选项A正确：经理由董事会聘任或者解聘；选项B错误：董事长、副董事长由履行出资人职责的机构从董事会成员中指定；选项C错误：利润分配方案只能由履行出资人职责的机构决定，不得授权；选项D错误：职工代表由职工代表大会等民主选举产生。'},
{id:'gs73',ch:'公司',type:'multi',q:'公司在歇业期间开展经营活动的，下列说法正确的有（）。',o:['视为恢复营业','无需向社会公示','歇业最长时间无限制','应当通过国家企业信用信息公示系统向社会公示'],a:['A','D'],e:'公司因自然灾害、事故灾难等原因可以歇业，最长时间不得超过3年。歇业期间开展经营活动的，视为恢复营业，应当通过国家企业信用信息公示系统向社会公示。'},
{id:'gs74',ch:'公司',type:'multi',q:'出资人以设立中的公司名义从事民事活动，下列说法正确的有（）。',o:['公司成立的，其法律后果由公司承受','公司未成立的，法律后果由发起人按出资比例承担','公司未成立的，发起人为2人以上的，承担连带债务','设立时股东为设立公司从事的活动，公司成立后承受后果'],a:['A','C','D'],e:'公司未成立的，发起人/出资人为设立公司所产生的债务，对外应当向债权人承担连带债务（非按比例承担各自债务，内部清偿才按比例），故选项B错误。'},
{id:'gs75',ch:'公司',type:'multi',q:'甲、乙、丙三人共同出资20万元设立一家有限责任公司，其中甲出资10万元，乙出资6万元，丙出资4万元。2023年6月公司成立后，召开了第一次股东会会议。有关该次会议的下列情况中，符合规定的有（）。',o:['会议由甲召集和主持','会议决定不设董事会，由甲担任董事，任期2年','会议决定不设监事会，由乙担任监事，任期4年','会议决定了公司2024年度的投资方案'],a:['A','B'],e:'选项A：首次股东会由出资最多的股东（甲）召集和主持；选项B：规模小可不设董事会，设1名董事（任期不超3年，2年合法）；选项C：监事任期固定为3年，不得设为4年；选项D：新《公司法》已将“决定公司投资方案”划归董事会职权，不属于股东会法定职权。'},
{id:'gs76',ch:'公司',type:'multi',q:'2024年7月，甲公司拟发起设立一家股份有限公司，法务部拟定的设立方案有下列要点，其中，不违反公司法律制度规定的有（）。',o:['不吸收其他股东，由甲公司全资设立','甲公司的出资在公司成立之日起3年内缴足','公司章程将授权董事会在3年内发行不超过已发行股份50%的股份','甲公司以其持有的某上市公司流通股作为首期出资'],a:['A','B','C','D'],e:'允许设立一人股份有限公司（A符合）；股份有限公司认缴制出资期限不得超过5年（3年符合，B）；章程可授权董事会在3年内发行不超过已发行股份50%的股份（授权资本制，C符合）；可以用依法可以转让的股权（上市公司流通股）作价出资（D符合）。'},
{id:'gs77',ch:'公司',type:'multi',k:1,q:'根据公司法律制度的规定，下列有关股份有限公司审计委员会的说法中，正确的有（）。',o:['按照公司章程的规定设置审计委员会的，不设监事会，也不设监事','成员应为3名以上','全体成员不得在公司担任除董事以外的其他职务','决议的表决应当一人一票，作出决议应当经成员的过半数通过'],a:['A','B','D'],e:'审计委员会成员为3人以上；过半数成员不得在公司担任除董事以外的其他职务，且不得与公司存在可能影响其独立客观判断的关系（并非“全体成员”，选项C错误）。其余选项均正确。'},
{id:'gs78',ch:'公司',type:'multi',q:'赵某持有A股份有限公司51%股份，钱某持有A公司1%股份，公司设有由11名董事组成的董事会，孙某是董事之一。在任期届满前，孙某向公司提交了书面辞职申请，收到申请后，A公司拟召开股东会补选董事，并根据赵某提名确定周某为董事候选人。钱某收到会议通知后，提名吴某为董事候选人，提案于股东会召开10日前书面提交董事会。下列说法中，不正确的有（）。',o:['公司收到孙某的辞职申请时，辞职生效','在公司补选的董事就任前，孙某仍应履行董事职务','钱某的持股比例太低，董事会有权拒绝将吴某列入董事候选人','A公司股东会可以决议采用累积投票制进行本次董事选举'],a:['A','C'],e:'孙某辞职导致董事会人数不足法定人数（11人中少1人低于法定人数要求时）或者章程规定人数，在补选董事就任前，原董事仍应履行职务，辞职自补选出新董事时生效（A错，B对）。钱某持股1%，满足单独或合计持股1%以上股东提出临时提案的法定条件，董事会无权拒绝（C错）。'},
{id:'gs79',ch:'公司',type:'multi',q:'星点股份有限公司注册资本5000万元，是深圳证券交易所上市公司。兴达公司持有星点公司200万股股份。2023年10月，星点公司拟吸收合并兴达公司。有关本案的下列说法中，不正确的有（）。',o:['本次合并可以由星点公司董事会决议，但应有2/3以上董事出席','本次合并后，对于星点公司所回购的股份应当在10日内注销','星点公司可另行回购15%股份用于两公司合并后的员工激励','对合并决议持有异议的星点公司股东，有权要求星点公司回购其所持星点公司的股份'],a:['A','B','C'],e:'合并必须由股东会决议（特别决议），不得由董事会决议（A错）；因合并回购本公司股份的，应当在6个月内转让或者注销（B错）；用于员工激励回购股份不得超过本公司已发行股份总额的10%（15%超限，C错）；异议股东享有法定股权回购请求权（D正确）。'},
{id:'gs80',ch:'公司',type:'multi',q:'甲公司为未上市股份有限公司，拟发行特殊表决权股（表决权计算规则为1股5权）。下列有关说法中，正确的有（）。',o:['如果公司章程有相关规定，甲公司可以发行该特殊表决权股','由于甲公司未上市，不得发行特殊表决权股','如果发行成功，公司选举董事时，该特殊表决权股按1股5权计算表决权','如果发行成功，公司选举监事时，该特殊表决权股按1股5权计算表决权'],a:['A','C'],e:'根据新《公司法》第144条，公司经公司章程规定可发行表决权多于普通股的类别股（即特殊表决权股），公开发行股份的公司不得发行，甲公司未上市故经章程规定可发行（A对、B错）；该类别股在选举董事时可按章程规定的多倍表决权行使（C对），但对于监事或者审计委员会成员的选举和更换，类别股与普通股每一股的表决权数相同，即监事选举应一股一权（D错）。'},
{id:'gs81',ch:'公司',type:'multi',q:'甲上市公司董事会正在讨论从乙公司大宗采购原材料，乙公司由甲上市公司董事长赵某实际控制：董事A、B、C、D、E出席会议，董事长赵某及董事会其余2名成员未出席会议；决议时E投了反对票，但董事会仍然通过决议，且未将E的反对意见记入会议记录。有关本案的下列说法中，正确的有（）。',o:['赞同的董事人数占全体董事人数未过半数，该董事会决议不能通过','赞同的董事人数占无关联关系的董事人数已过半数，该董事会决议通过','如果日后发现，该关联交易违法，给甲上市公司造成重大损失，出席会议的董事A、B、C、D、E应对公司承担赔偿责任','如果日后发现，该关联交易违法，给甲上市公司造成重大损失，出席会议且表示赞同的董事A、B、C、D应对公司承担赔偿责任，投反对票的董事E无须对公司承担赔偿责任'],a:['B','D'],e:'关联董事回避后，该董事会会议由过半数的无关联关系董事出席即可举行，董事会会议所作决议须经无关联关系董事过半数通过（5名无关联董事全部出席，4人赞成过半数，决议通过，B对A错）。董事会决议违反法律致使公司遭受严重损失的，参与决议的董事负赔偿责任；但经证明在表决时曾表示异议并记载于会议记录的，该董事可以免责（E投了反对票，无须承担责任，D对）。'},
{id:'gs82',ch:'公司',type:'multi',k:1,q:'根据公司法律制度的规定，下列各项中，属于适用强制注销程序的条件的有（）。',o:['公司被吊销营业执照、责令关闭或者被撤销','公司歇业满6个月未向公司登记机关申请注销公司登记','公司登记机关通过国家企业信用信息公示系统公告的期限不少于60日','公告期限届满后，未有异议'],a:['A','C','D'],e:'公司被吊销、责令关闭，满3个月未申请注销的（选项B中“歇业满6个月”不符合），登记机关可以通过公示系统公告不少于60日；公告期满无异议的，登记机关可以注销公司登记（强制注销）。'},
{id:'gs83',ch:'公司',type:'judge',q:'甲有限责任公司登记设立于2023年1月10日，设立之初，公司章程规定的股东出资期限最长达到10年。根据相关过渡期政策的规定，甲公司应当在2027年6月30日前将剩余认缴出资期限调整至5年内。',a:true,e:'新《公司法》施行前设立的公司，出资期限超过5年的，应当在过渡期内（2027年6月30日前）调整至5年以内。'},
{id:'gs84',ch:'公司',type:'judge',q:'甲商贸有限责任公司的章程中规定，由出资额最大的股东委派人员担任公司董事长。该公司章程的规定符合公司法律制度的规定。',a:true,e:'有限责任公司董事长、副董事长的产生办法由公司章程规定。章程约定由最大股东委派符合法律规定。'},
{id:'gs85',ch:'公司',type:'judge',q:'股份有限公司发行股份时，对于同次发行的同类别股份可以针对不同投资主体规定不同的发行条件和发行价格。',a:false,e:'股份的发行实行公平、公正的原则，同次发行的同类别股份，每股的发行条件和价格应当相同。'},
{id:'gs86',ch:'公司',type:'judge',q:'甲公司向A银行借款，并以其持有的A银行5万股股票为A银行设定质押，A银行接受该项质押并提供借款。甲公司和A银行之间的质押借款行为符合规定。',a:false,e:'公司不得接受本公司的股票作为质押权标的（银行作为公司，亦不能接受自己发行的股票作为质押物）。'},
{id:'gs87',ch:'公司',type:'judge',q:'股东会会议召开前20日内或者公司决定分配股利的基准日前5日内，不得变更股东名册。法律、行政法规或者中国证监会对上市公司股东名册变更另有规定的，从其规定。',a:false,e:'新《公司法》已删除了“股东会召开前20日内不得变更股东名册”的限制规定，由公司章程或法律行政法规自主确定股权登记日。'},
{id:'gs88',ch:'公司',type:'judge',k:1,q:'上市公司独立董事占董事会成员的比例不得低于1/3，且至少包括1名会计专业人士。',a:true,e:'符合上市公司独立董事制度的法定人数与专业构成规定。'},
{id:'gs89',ch:'公司',type:'judge',q:'上市公司应当依法披露股东、实际控制人的信息，相关信息应当真实、准确、完整。',a:true,e:'表述完全符合上市公司信息披露的基本法定要求。'},
{id:'gs90',ch:'公司',type:'judge',q:'上市公司的子公司可以取得该上市公司的股份。',a:false,e:'新《公司法》明确规定，上市公司转投资的子公司，不得取得该上市公司的股份（禁止交叉持股反向持有母公司股份）。'},
{id:'ph57',ch:'合伙',type:'single',q:'甲为某律师事务所（普通合伙）的合伙人，该律师事务所由于业务规模日渐扩大，年应税销售额即将达到增值税一般纳税人登记标准，为了维持小规模纳税人的身份，甲拟再设立一家律师事务所（个人独资企业）将部分业务分拆出去。有关甲能否再设立一家律师事务所的下列说法中，正确的是（）。',o:['甲经其他合伙人一致同意，可以再设立一家律师事务所','甲可以再设立一家律师事务所，除非合伙协议另有约定','甲如不执行合伙企业事务，就可以再设立一家律师事务所','甲只要具有该合伙人的身份，就不可以再设立一家律师事务所'],a:'D',e:'普通合伙人绝对不得从事与本合伙企业相竞争的业务（即竞业禁止为法定强行性规定，不可通过协议约定或全体同意豁免）。甲作为普通合伙人，再设立同行业律师事务所属于竞业行为，绝对被禁止。'},
{id:'ph58',ch:'合伙',type:'single',q:'周某、吴某、郑某和王某共同设立甲普通合伙企业，周某欠付乙银行的到期贷款100万元，以自有财产不足清偿，乙银行请求人民法院强制执行周某在甲企业的财产份额。下列说法正确的是（）。',o:['人民法院强制执行周某的财产份额时，不必征得吴某、郑某和王某的同意','人民法院强制执行周某的财产份额时，吴某、郑某和王某均既不同意将周某的财产份额转让他人，又表示自己无力购买的，视为同意处理','人民法院强制执行周某的财产份额时，吴某、郑某和王某均既不同意将周某的财产份额转让他人，又表示自己无力购买的，乙银行有权自行接管周某在甲企业中的财产份额','如果周某在甲企业的财产份额全部被人民法院强制执行，周某对甲企业的债务不再承担无限连带责任'],a:'A',e:'选项A正确：人民法院强制执行合伙人的财产份额是依法进行的司法强制措施，不必征得其他合伙人同意，但应通知全体合伙人。选项B、C错误：其他合伙人既不同意转让给他人，又表示不购买的，依法为该合伙人办理退伙结算，或者办理削减相应财产份额的结算，而非“视为同意”或“自行接管”。选项D错误：退伙的普通合伙人对基于其退伙前原因发生的合伙企业债务，仍需承担无限连带责任。'},
{id:'ph59',ch:'合伙',type:'single',q:'张某、赵某和李某设立某普通合伙企业，张某为执行事务合伙人。后李某一直未履行到期出资义务。2023年1月5日，李某收到张某发出的通知，告知如其未于2023年1月20日前完成出资，将自动退伙。2023年2月1日，张某和赵某作出将李某除名的决议。李某于2023年3月1日收到除名通知。有关李某的退伙，下列说法正确的是（）。',o:['2023年4月1日，李某被除名退伙','2023年1月20日，李某当然退伙','2023年3月1日，李某被除名退伙','2023年2月1日，李某被除名退伙'],a:'C',e:'合伙人未履行出资义务的，经其他合伙人一致同意可以决议将其除名。对合伙人的除名决议应当书面通知被除名人，被除名人收到除名通知之日（2023年3月1日），除名生效，被除名人退伙。'},
{id:'ph60',ch:'合伙',type:'multi',q:'周某、吴某和王某共同设立了畅通汽修（普通合伙），合伙协议约定由三人共同执行合伙事务，周某分管零配件采购，吴某分管汽修业务，王某分管销售市场。某日，周某与A企业达成零配件采购意向，吴某提出A企业生产的零配件质量不过关，王某则提议将其前些年囤下的一批零配件出售给畅通汽修。已知，合伙协议对合伙事务执行、合伙人与本企业交易事项均无特殊约定。下列有关说法中，正确的有（）。',o:['吴某有权行使异议权，周某应暂停推进与A企业签订合同相关事宜','吴某有权行使异议权，但周某在分管权限范围内有权不接受异议','经周某同意，王某可以将自己囤下的零配件出售给畅通汽修','经周某、吴某同意，王某可以将自己囤下的零配件出售给畅通汽修'],a:['A','D'],e:'选项A正确、B错误：执行事务合伙人有权对其他合伙人执行的事务提出异议，提出异议后应当暂停该项事务。选项C错误、D正确：除协议另有约定外，普通合伙人不得同本合伙企业进行自我交易；进行交易须经全体合伙人（周某、吴某）一致同意。'},
{id:'ph61',ch:'合伙',type:'multi',q:'甲、乙、丙出资设立某普通合伙企业，并计划聘任李某担任合伙企业的经营管理人员。下列有关说法中，不正确的有（）。',o:['除合伙协议另有约定外，聘任决议生效后，李某具有合伙人资格','除合伙协议另有约定外，聘任决议经全体合伙人过半数通过后生效','李某应当在合伙企业的授权范围内履行职务','聘任决议生效后，李某对外代表合伙企业'],a:['A','B','D'],e:'选项A错误：聘任的外包高管仅为经营管理人员，不具有合伙人资格。选项B错误：除合伙协议另有约定外，聘任合伙人以外的人须经全体合伙人“一致同意”，而非过半数。选项C正确：经营管理人员应在授权范围内履职。选项D错误：只有执行事务合伙人才能对外代表合伙企业，被聘任的高管无权对外代表企业。'},
{id:'ph62',ch:'合伙',type:'multi',k:1,q:'甲、乙、丙、丁共同投资设立了A会计师事务所（特殊普通合伙），甲是合伙事务执行人，A会计师事务所的办公用房是甲经手从B公司处租赁的，现欠付2年租金，B公司要求清偿。有关该项租金的清偿，下列说法正确的有（）。',o:['A会计师事务所应当以其全部财产清偿','甲对该项租金承担无限责任，乙、丙、丁以其实缴的出资额为限承担责任','甲对该项租金承担无限责任，乙、丙、丁以其认缴的出资额为限承担责任','甲、乙、丙、丁对该项租金均应承担无限连带责任'],a:['A','D'],e:'欠付办公用房租金属于日常经营管理债务，不属于合伙人在执业活动中因故意或重大过失产生的特殊执业债务，因此全体普通合伙人（甲、乙、丙、丁）均应对该债务承担无限连带责任，且合伙企业首先应以全部财产清偿。'},
{id:'ph63',ch:'合伙',type:'multi',q:'甲、乙共同投资设立了A有限合伙企业，甲为普通合伙人，出资10万元；乙为有限合伙人，出资15万元。A有限合伙企业成立2年后，丙、丁各出资30万元加入A有限合伙企业，其中丙为普通合伙人，丁为有限合伙人。现A有限合伙企业无力清偿欠B银行的60万元到期债务。有关该债务承担的下列说法中，不正确的有（）。',o:['甲以其出资额10万元为限对该债务承担责任','B银行可以要求乙承担全部60万元债务','B银行可以要求丙承担全部60万元债务','B银行可以要求丁承担全部60万元债务'],a:['A','B','D'],e:'甲（普通合伙人）须承担无限连带责任，选项A错误；乙（有限合伙人）仅以其认缴的出资额（15万元）为限承担责任，选项B错误；丙（新入伙的普通合伙人）对入伙前的债务承担无限连带责任，B银行可要求其承担全部债务，选项C说法正确（不选）；丁（新入伙的有限合伙人）仅以认缴出资额（30万元）为限承担责任，选项D错误。'},
{id:'ph64',ch:'合伙',type:'judge',q:'合伙事务执行人就是合伙企业的经营管理人员，不具有合伙人的资格，但对外代表合伙企业。',a:false,e:'合伙事务执行人必须由普通合伙人担任（具有合伙人资格）；聘任的“经营管理人员”不具有合伙人资格，且不能对外代表企业。'},
{id:'ph65',ch:'合伙',type:'judge',k:1,q:'普通合伙企业新入伙的合伙人，可以通过入伙协议约定比原合伙人享有较大的权利，承担较少的责任。',a:true,e:'入伙协议由新合伙人与原合伙人自由协商订立，法律允许在协议中对其权利义务作出特殊约定。'},
{id:'ph66',ch:'合伙',type:'judge',q:'除合伙协议另有约定外，合伙企业解散时如指定一个或者数个合伙人，或者委托第三人担任清算人的，应当经全体合伙人过半数同意。',a:false,e:'必须经全体合伙人过半数同意是《合伙企业法》的法定规则，且该条规定不得通过合伙协议约定另作例外改变（即“除合伙协议另有约定外”这句表述错误）。'},
{id:'ph67',ch:'合伙',type:'judge',q:'特殊的普通合伙企业的执业风险基金应当单独立户管理，用于偿付合伙人执行活动非因故意或者重大过失造成的债务。',a:false,e:'执业风险基金用于偿付合伙人执业活动造成的债务（包括因故意或重大过失引起的债务），并非仅限于“非因故意或者重大过失”造成的债务。'},
{id:'ph68',ch:'合伙',type:'judge',k:1,q:'合伙企业财产在支付清算费用和职工工资、社会保险费用、法定补偿金以及缴纳所欠税款、清偿债务后的剩余财产，应当按照合伙协议约定的利润分配、亏损分担规则分配给合伙人；合伙协议未约定或者约定不明确的，由合伙人协商决定；协商不成的，由合伙人按照实缴出资比例分配、分担；无法确定出资比例的，由合伙人平均分配、分担。',a:true,e:'符合合伙企业清算财产分配规则。'},
{id:'ht58',ch:'合同',type:'single',q:'甲公司得知竞争对手乙公司正就某重大合同项目与丙公司进行谈判，甲公司原本不需要该合同项目，但为了干扰乙公司的经营，甲公司也开始联系丙公司，并向丙公司提出了更为优越的合同条件，丙公司因此搁置了与乙公司的谈判。乙公司退出谈判后，甲公司随即也终止了与丙公司的磋商，并将所知悉的丙公司的商业秘密泄露给丁公司。有关本案的下列说法中，正确的是（）。',o:['甲公司不需要向丙公司承担任何法律责任','甲公司应当向丙公司承担违约责任','甲公司应当向乙公司承担缔约过失责任','甲公司应当向丙公司承担缔约过失责任'],a:'D',e:'甲公司在与丙公司进行缔约磋商的过程中，存在“假借订立合同，恶意进行磋商”“泄露商业秘密”的行为，应当向丙公司承担缔约过失责任。'},
{id:'ht59',ch:'合同',type:'single',k:1,q:'甲公司与乙公司签订一份买卖合同，合同约定，甲公司须在1个月内向乙公司提供200台电视机，总价款100万元。合同签订后，乙公司按约定向甲公司交付了定金20万元。甲公司依约分两批发运电视机，不料，第一批100台电视机在运输过程中遭遇泥石流，致使电视机全部毁损；第二批100台电视机在运输过程中被甲公司的债权人丙强行扣押、变卖，最终，乙公司未能收到电视机，欲向甲公司主张定金责任。有关甲公司定金责任承担的下列表述中，正确的是（）。',o:['甲公司无须承担定金责任，因为没有交付电视机是不可抗力和第三人原因导致的，甲公司没有过错','甲公司须承担全部定金责任，因为甲公司违反合同约定，未将电视机交付给乙公司','甲公司只须承担一半定金责任，因为不可抗力导致的第一批100台电视机未能交付，不适用定金罚则','甲公司只须承担一半定金责任，因为第三人原因造成的第二批100台电视机未能交付，不适用定金罚则'],a:'C',e:'(1)第一批货物因泥石流全部毁损，属于不可抗力原因，免除违约责任，甲公司无须承担定金责任；(2)第二批货物因甲公司的债权人丙对该批货物实行强行扣押、变卖而未能交付，属于第三人原因导致违约，不能免除违约责任，甲公司应当承担定金责任。'},
{id:'ht60',ch:'合同',type:'single',q:'6月1日，甲将自有的一辆小汽车卖给乙；合同签订后，乙依约支付购车款5万元。6月2日，甲又以8万元的价格将该车卖给不知情的丙，双方签订买卖合同，丙交付定金2万元。6月5日上午，甲将该车交付给乙；6月5日下午甲将该车过户给丙。有关本案的下列说法中，正确的是（）。',o:['乙、丙均不能取得汽车的所有权','乙、丙应当抽签决定该小汽车的归属','乙取得小汽车的所有权','丙取得小汽车的所有权'],a:'C',e:'出卖人将标的物（特殊动产）交付给买受人之一，又为其他买受人办理所有权转移登记，已受领交付的买受人请求将标的物所有权登记在自己名下的，人民法院应予支持。'},
{id:'ht61',ch:'合同',type:'single',k:1,q:'甲公司与乙银行签订借款合同，甲公司以自有的房屋一处设定抵押，丙公司提供连带责任保证。现借款到期甲公司无力还款。已知，各方对担保权的行使顺序没有作出约定。有关本案担保责任的承担，下列说法正确的是（）。',o:['乙银行应当先请求丙公司承担保证责任','乙银行可以先请求丙公司承担保证责任','乙银行应当先就甲公司的房屋实现债权','乙银行可以先就甲公司的房屋实现债权'],a:'C',e:'本案属于共同担保，在各方未约定担保权行使顺序的情况下，债务人甲公司自己提供物的担保的，债权人乙银行应当先就该物的担保实现债权。'},
{id:'ht62',ch:'合同',type:'multi',q:'下列有关承诺的表述中，不正确的有（）。',o:['承诺生效时合同成立，因此，承诺既不可撤回也不可撤销','要约没有确定承诺期限的，以对话方式作出的要约，应当即时承诺','承诺在要约确定的期限内发出即可','以信件方式发出要约，信件未载明日期的，承诺期限自该信件的寄达邮戳日期开始计算'],a:['A','C','D'],e:'(1)选项A：承诺可以依法撤回，但不能撤销；(2)选项C：承诺应当在要约确定的期限内“到达”要约人；(3)选项D：要约以信件作出的，承诺期限自信件载明的日期开始计算，信件未载明日期的，自投寄该信件的邮戳日期开始计算。'},
{id:'ht63',ch:'合同',type:'multi',k:1,q:'甲商场因其拟定的格式合同中的某一条款与消费者发生纠纷，在诉讼中，甲商场主张该条款不属于格式条款并提出了下列理由，其中，人民法院不予采纳的有（）。',o:['双方已在合同中明确约定该条款不属于格式条款','该条款甲商场并未实际重复使用','该条款是与原告消费者协商后专为该消费者订立的','该合同是依据合同范本制作的'],a:['A','B','D'],e:'(1)选项AD：当事人不得仅以合同系依据合同示范文本制作或者双方已经明确约定合同条款不属于格式条款为由主张该条款不是格式条款；(2)选项B：从事经营活动的当事人一方不得仅以未实际重复使用为由主张其预先拟定且未与对方协商的合同条款不是格式条款，但有证据证明该条款不是为了重复使用而预先拟定的除外。'},
{id:'ht64',ch:'合同',type:'multi',q:'当事人就有关合同内容约定不明确的，可以补充协议，不能达成补充协议的，按照合同有关条款或者交易习惯确定，仍不能确定的，适用法定规则。有关该法定规则，下列表述正确的有（）。',o:['价款或者报酬不明确的，按照货物交付时履行地的市场价格履行','履行地点不明确的，给付货币的，在接受货币一方所在地履行','质量要求不明确的，按照通常标准或者符合合同目的的特定标准履行','履行方式不明确，按照有利于实现合同目的的方式履行'],a:['B','D'],e:'(1)选项A：价款或者报酬不明确，按照“订立合同时”履行地的市场价格履行；依法应当执行政府定价或政府指导价的，依照规定履行。(2)选项C：质量要求不明确的，按照强制性国家标准履行；没有强制性国家标准的，按照推荐性国家标准履行；没有推荐性国家标准的，按照行业标准履行；没有国家标准、行业标准的，按照通常标准或者符合合同目的的特定标准履行。'},
{id:'ht65',ch:'合同',type:'multi',q:'甲学校和乙服装厂签订《承揽合同》，甲学校委托乙服装厂加工1200套夏季校服，布料及配件由乙服装厂统一采购，乙服装厂负责加工1000套，其余200套乙服装厂可以交由丙服装厂加工，但均应按照甲学校提供的样品校服加工，交货验收合格的同时支付加工费。校服制作完成，甲学校验收时发现由丙服装厂加工的200套校服不符合样品校服的规格要求，拒绝收货，引发纠纷。下列有关本案的说法中，正确的有（）。',o:['甲学校有权要求乙服装厂承担违约责任','甲学校有权要求丙服装厂承担违约责任','甲学校有权拒绝支付丙服装厂加工的200套校服的价款','甲学校有权要求乙服装厂重新加工200套符合要求的校服'],a:['A','C','D'],e:'(1)选项ABD：当事人约定由第三人向债权人履行债务，第三人不履行债务或者履行债务不符合约定的，债务人（乙服装厂）应当向债权人承担违约责任（包括但不限于采取补救措施）；(2)选项C：甲学校与乙服装厂约定“交货验收合格的同时支付加工费”，现有200套校服未能验收合格，甲学校有权行使同时履行抗辩权，拒绝支付该200套校服的价款。'},
{id:'ht66',ch:'合同',type:'multi',q:'赵某的女友钱某过生日，赵某悄悄向甲蛋糕店订购生日蛋糕，收货人姓名填写为“钱某”。但甲蛋糕店在自送途中不慎将蛋糕摔坏，送达钱某时蛋糕花饰已经残缺不堪。下列有关说法中，正确的有（）。',o:['赵某有权追究甲蛋糕店的违约责任','钱某有权追究甲蛋糕店的违约责任','赵某有权通知甲蛋糕店解除合同','钱某有权通知甲蛋糕店解除合同'],a:['A','C'],e:'赵某和甲蛋糕店的合同属于向第三人履行的合同，法律无规定、当事人未约定钱某有主张合同责任的权利，因此，该合同仅为“不真正利他”合同，钱某无权主张违约责任、通知解除合同，应由合同当事人一方赵某向另一方当事人甲蛋糕店主张解除合同及违约责任。'},
{id:'ht67',ch:'合同',type:'multi',k:1,q:'甲对乙享有50000元债权，已到清偿期限，但乙一直宣称其无力清偿欠款；甲调查后发现下列情况，乙均怠于行使债权，其中，甲可以行使代位权的有（）。',o:['个体工商户张某欠付乙的3个月工资，共计12000元','刘某欠付乙的到期房屋租金8000元','赵某欠付乙的赌债6000元','孙某欠付乙的3个月前到期的借款20000元'],a:['B','D'],e:'(1)选项A：专属于债务人自身的权利，债权人不得行使代位权；(2)选项C：债务人对第三人享有合法债权，债权人才能行使代位权，赌债不属于合法债权。'},
{id:'ht68',ch:'合同',type:'multi',q:'陈某租住王某的房屋，租期至2025年1月初，约定10万元租金于租期届满时一并支付。王某欠陈某10万元货款，应于2025年2月初偿付。有关本案的下列说法中，正确的有（）。',o:['2025年1月底，王某有权向陈某主张抵销','2025年2月底，王某有权向陈某主张抵销','2025年1月底，王某向陈某主张抵销时，陈某有权行使后履行抗辩权','陈某欠王某的是租金，王某欠陈某的是货款，标的物种类不相同，双方应协商一致后抵销'],a:['A','B'],e:'(1)选项A：2025年1月底，王某可以将自己的“未到期”债务（2月初到期）与陈某的“到期”债务（1月初到期）抵销；(2)选项B：2025年2月底，两项债务均已到期，王某、陈某均有权向对方主张抵销；(3)选项C：后履行抗辩权应当在“同一”双务合同中谈，本案是租赁和买卖两个双务合同；(4)选项D：不论租金还是货款，均为货币，种类相同。'},
{id:'ht69',ch:'合同',type:'multi',q:'根据合同法律制度的规定，因政策调整或者市场供求关系异常变动等原因，导致价格发生当事人在订立合同时无法预见的、异常剧烈的涨跌，可以满足情势变更的要件。下列选项作为合同标的物时，构成上述规定除外情形的有（）。',o:['家具','期货','黄金','债券'],a:['B','C','D'],e:'(1)合同涉及市场属性活跃、长期以来价格波动较大的大宗商品以及股票、期货等风险投资型金融产品的，不适用情势变更原则。(2)按照通说，黄金、铂金等属于风险投资型金融产品。'},
{id:'ht70',ch:'合同',type:'multi',q:'2025年11月11日，赵某与钱某签订生猪买卖合同，约定赵某于2025年12月12日交付生猪100头，送至钱某指定的屠宰场完成交付。赵某运输生猪至钱某指定的屠宰场需耗时2天。2025年12月12日，钱某未收到赵某交付的生猪。下列情形中，赵某可以不可抗力为由主张免于承担违约责任的有（）。',o:['2025年12月1日，当地政府发布命令，因故暂停生猪交易1个月','2025年12月12日，赵某委托A货运公司运输生猪，途中遭遇雪灾生猪全部冻死','2025年12月9日，赵某委托A货运公司运输生猪，途中遭遇雪灾生猪全部冻死','2025年12月20日，赵某委托A货运公司运输生猪，途中遭遇雪灾生猪全部冻死'],a:['A','C'],e:'选项BD：当事人迟延履行后发生不可抗力的，不能免除责任。'},
{id:'ht71',ch:'合同',type:'multi',q:'甲乙约定卖方甲负责将所卖货物运送至买方乙指定的仓库。甲如约交货，乙验收，但甲未将产品合格证和原产地证明文件如约交付给乙；乙已经支付了80%货款。交货当晚，因山洪暴发，乙仓库内的货物全部毁损。有关本案的下列说法中，正确的有（）。',o:['乙应当支付剩余20%货款','因甲未交付产品合格证和原产地证明文件，构成违约，但货物损失应由乙承担','乙有权解除合同，并请求甲返还已支付的80%货款','甲有权要求乙支付剩余20%货款，但应当补交已经毁损的货物'],a:['A','B'],e:'(1)甲的行为是否构成违约：出卖人应当按照约定或者交易习惯向买受人交付提取标的物单证以外的有关单证和资料；在本题中，甲未按照约定时间交付产品合格证和原产地证明，构成违约。(2)风险应由哪方负担：货物（主标的物）已经交付，风险应由乙承担，甲未交付产品合格证和原产地证明文件不影响标的物风险的转移，而风险由乙承担即意味着，货物虽已经毁损，乙应依约付款，甲不承担补交货物的义务。(3)是否构成法定解除：当事人一方迟延履行债务或者有其他违约行为致使“不能实现合同目的”的，另一方当事人有权单方通知解除合同；在本题中，甲的违约行为并不导致合同目的不能实现，尚不构成法定解除。'},
{id:'ht72',ch:'合同',type:'multi',q:'甲公司与乙公司签订设备买卖合同，约定甲公司支付首期款之日起10日内乙公司交付设备，但在甲公司付清价款前，乙公司保留该设备的所有权。下列有关本案的说法中，正确的有（）。',o:['只要甲公司未按照约定付款，乙公司随时可以主张取回该设备','如果甲公司支付了80%货款后，经催告合理期限内无力支付余款，乙公司无权主张取回该设备','如果乙公司依法取回设备后发现，设备的价值显著减少，乙公司有权要求甲公司赔偿损失','如果乙公司依法主张取回设备，而甲公司拒不返还，乙公司可以请求人民法院拍卖、变卖设备'],a:['B','C','D'],e:'(1)选项AB：在所有权保留的买卖合同中，买受人未按照约定支付价款，经催告后合理期限内仍未支付的，除当事人另有约定外，出卖人有权取回标的物；但买受人已经支付标的物总价款的75%以上，出卖人主张取回标的物的，人民法院不予支持。(2)选项C：在所有权保留买卖合同中，如果取回的标的物价值显著减少，出卖人可以请求买受人赔偿损失。(3)选项D：出卖人依法取回标的物，但是与买受人协商不成，当事人请求参照民事诉讼法“实现担保物权案件”的有关规定，拍卖、变卖标的物的，人民法院应予准许。'},
{id:'ht73',ch:'合同',type:'multi',q:'甲银行与乙公司签订一份借款合同，合同签订后，甲银行依约发放了部分贷款，乙公司未按照约定的用途使用借款。甲银行可以行使的权利有（）。',o:['停止发放后续贷款','提前收回已发放贷款','解除借款合同','对乙公司罚款'],a:['A','B','C'],e:'借款人未按照约定的借款用途使用借款的，贷款人可以：(1)停止发放借款；(2)提前收回借款；(3)解除合同。'},
{id:'ht74',ch:'合同',type:'multi',k:1,q:'甲公司欲购乙公司生产的塔吊，因缺乏资金，遂由丙公司提供融资租赁。由于塔吊存在质量问题，吊装的物品坠落并砸伤行人丁，甲公司被迫停产修理。有关本案的下列说法中，正确的有（）。',o:['甲公司无权请求丙公司赔偿修理塔吊的费用','甲公司不得以塔吊存在质量问题并发生事故为由，延付或拒付租金','丙公司应当对甲公司承担违约责任','丁可以请求丙公司赔偿损失'],a:['A','B'],e:'(1)选项A：融资租赁期间，塔吊的维修义务由承租人甲公司承担；(2)选项BC：融资租赁合同中，除非承租人依赖出租人的技能确定租赁物或者出租人干预选择租赁物，否则，租赁物不符合租赁合同约定或者不符合使用目的的，出租人不承担责任（丙公司不需要向甲公司承担违约责任，而甲公司仍应按照约定支付租金）；(3)选项D：在融资租赁合同中，承租人占有租赁物期间，租赁物造成第三人的人身伤害或者财产损失的，出租人（丙公司）不承担责任。'},
{id:'ht75',ch:'合同',type:'judge',q:'通过互联网等信息网络订立的电子合同，提供格式条款的一方可以采取了设置勾选、弹窗等方式为由主张其已经履行提示义务或者说明义务。',a:false,e:'通过互联网等信息网络订立的电子合同，提供格式条款的一方不得仅以采取了设置勾选、弹窗等方式为由主张其已经履行提示义务或者说明义务，但是其举证符合法定要求（例如，弹窗内容存在足以引起对方注意的文字、符号、字体等明显标识）的除外。'},
{id:'ht76',ch:'合同',type:'judge',q:'当事人约定检验期限的，买受人应当在检验期限内将标的物的数量或者质量不符合约定的情形通知出卖人；买受人怠于通知的，视为标的物的数量或者质量符合约定。',a:true,e:'本题考查的是标的物的质量检验。'},
{id:'ht77',ch:'合同',type:'judge',q:'当事人以商品房预售合同未按照法律、行政法规规定办理登记备案手续为由，请求确认合同无效的，人民法院应予支持。',a:false,e:'当事人以商品房预售合同未按照法律、行政法规规定办理登记备案手续为由，请求确认合同无效的，人民法院不予支持。'},
{id:'ht78',ch:'合同',type:'judge',q:'出租人就未经批准建设的临时建筑，与承租人订立的租赁合同无效，但在起诉前经主管部门批准建设的，人民法院应当认定有效。',a:false,e:'出租人就未经批准或者未按照批准内容建设的临时建筑，与承租人订立的租赁合同无效；但在“一审法庭辩论终结前”经主管部门批准建设的，人民法院应当认定有效。'},
{id:'ht79',ch:'合同',type:'judge',q:'甲公司根据乙公司的选择，向丙公司购买了1台大型设备，出租给乙公司使用，甲、乙公司为此签订了融资租赁合同，该设备在使用过程中发生部件磨损，需维修。甲公司应承担维修义务。',a:false,e:'在融资租赁合同中，“承租人”应当履行占有租赁物期间的维修义务。'},
{id:'ht80',ch:'合同',type:'judge',q:'人民法院已经受理债务人破产案件的，一般保证人不得行使先诉抗辩权。',a:true,e:'本题考查的是先诉抗辩权。'},
]);
window.KNOW = [
{ch:'导论', name:'经济法导论', num:'壹', sections:[

  '调整对象三类：市场主体调控关系、市场规制关系（反垄断、反不正当竞争、消费者保护）、宏观调控关系（财税、金融、计划）。',
  '体系：市场主体法（公司法、合伙企业法、个人独资企业法、企业破产法）／市场规制法（反不正当竞争法、消费者权益保护法、产品质量法、广告法）／宏观调控法（预算法、银行法、税法等）。']},
 {h:'发展脉络与基本原则', items:[

  '我国经济法产生于<b>1978年改革开放</b>，完善于1992年社会主义市场经济体制确立以后。',

 {h:'与民法、行政法的区别', items:[

  '行政法调整行政管理关系，是“管理管理者之法”，手段为命令与服从；经济法采干预、规制、引导、监督等综合方法。']},
 {h:'渊源与效力等级', items:[

  '效力：宪法＞法律＞行政法规＞地方性法规＞同级地方政府规章；宪法＞法律＞行政法规＞部门规章。',

 {h:'经济法律关系与责任', items:[
  '三要素：<b>主体</b>（经济管理主体、经济活动主体）、<b>内容</b>（经济权利与经济义务）、<b>客体</b>（物、行为、智力成果）。',
  '法律事实分为事件（不以人的意志为转移，如自然灾害）与行为（人有意识的活动，分合法与违法）。',
  '责任形式：民事责任、行政责任（行政处分、行政处罚）、刑事责任；第一目的是保护社会公共利益。']}
]},
{ch:'个人独资', name:'个人独资企业法', num:'贰', sections:[
 {h:'性质与特征', items:[
  '由一个<b>中国自然人</b>投资，财产归投资人个人所有，投资人以个人财产对企业债务承担<b>无限责任</b>。',
  '不具有法人资格、无独立承担民事责任的能力，但属于独立民事主体，可以自己的名义从事民事活动。',
  '不缴纳企业所得税，由投资人缴纳个人所得税。']},
 {h:'设立条件', items:[
  '投资人为一个中国公民、完全民事行为能力人；国家公务员、法官、检察官、人民警察、商业银行工作人员等禁止从事营利性活动的人不得投资。',
  '名称中<em>不得</em>使用“有限”“有限责任”“公司”字样，可用厂、店、部、中心、工作室。',
  '有投资人申报的出资，可以个人财产出资，也可以家庭共有财产作为个人出资；无法定最低注册资本。',
  '登记机关应自收到申请文件之日起<b>15日</b>内作出决定；营业执照签发日期为成立日期。']},
 {h:'事务管理与责任', items:[
  '投资人可自行管理，也可委托或聘用他人管理；委托须签订<b>书面合同</b>，明确授权范围。',
  '对受托人职权的限制，不得对抗<b>善意第三人</b>。',
  '明确以家庭共有财产作为个人出资的，以家庭共有财产对企业债务承担无限责任；未明确的，以个人财产承担。',
  '民事赔偿责任与罚款、罚金不足以同时支付时，<b>先承担民事赔偿责任</b>。']},
 {h:'解散与清算', items:[
  '解散情形：投资人决定解散；投资人死亡或被宣告死亡且无继承人或继承人放弃继承；被依法吊销营业执照；其他法定情形。',
  '清算：投资人自行清算，或由债权人申请人民法院指定清算人。',
  '申报债权：接到通知之日起<b>30日</b>内；未接到通知的自公告之日起<b>60日</b>内。',
  '清偿顺序：职工工资和社会保险费用→所欠税款→其他债务；财产不足的，投资人以个人其他财产清偿。',
  '解散后原投资人对存续期间债务仍负责任，债权人<b>5年</b>内未提出偿债请求的，责任消灭。']}
]},
{ch:'合伙', name:'合伙企业法', num:'叁', sections:[
 {h:'设立与财产', items:[
  '合伙协议由全体合伙人协商一致、以<b>书面形式</b>订立；营业执照签发日为成立日期。',
  '普通合伙人可以劳务出资；国有独资公司、国有企业、上市公司、公益性事业单位和社会团体<em>不得</em>成为普通合伙人。',
  '合伙企业财产包括合伙人认缴和实缴的出资、以企业名义取得的收益、依法取得的其他财产；承租物不属于企业财产。',
  '清算前私自转移、处分企业财产的，不得对抗善意第三人。']},
 {h:'事务执行与重大事项', items:[

/* ===== 案例分析题（讲义原文，共 12 道） ===== */
{id:"casegs01",ch:"公司",type:'case',q:"2020年8月1日，冯某、陈某、楚某和卫某共同设立甲有限责任公司，注册资本为100万元，四人的持股比例依次为10%、20%、30%、40%。冯某和卫某均在公司成立时以货币足额缴纳了出资；陈某认缴出资20万元，按照公司章程的规定应于2023年7月31日前缴清；楚某认缴出资30万元，按照公司章程的规定应于2025年7月31日前缴清。2024年7月5日，甲公司董事会向陈某发出《催缴出资通知书》，要求陈某于2024年9月10日前缴清出资，否则，公司将经董事会决议解除陈某的股东资格。陈某收到《催缴出资通知书》后提出：（1）缴纳出资的宽限期过短，不符合公司法律制度的规定；\n（2）解除股东资格应由股东会作出决议，董事会无该项权限。2024年10月10日，甲公司陷入经营危机，无力向乙公司偿付到期货款40万元，乙公司请求楚某提前缴纳出资，楚某以章程规定的出资期限尚未届至为由拒绝。要求：根据上述资料及公司法律制度的规定，不考虑其他因素，回答下列问题。（1）陈某提出的第（1）项主张是否符合公司法律制度的规定？简要说明理由。\n（2）陈某提出的第\n（2）项主张是否符合公司法律制度的规定？简要说明理由。\n（3）乙公司是否有权请求楚某提前缴纳出资？简要说明理由。",a:"（1）陈某提出的第（1）项主张不符合规定。理由：根据规定，公司催缴出资书面通知中载明的缴纳出资宽限期应当不少于60日。甲公司于2024年7月5日发出通知，给定的宽限期截止至2024年9月10日（超过60日），符合法定要求，因此陈某认为宽限期过短的主张不成立。\n（2）陈某提出的第\n（2）项主张不符合规定。理由：根据规定，股东在宽限期届满仍未履行出资义务的，公司经董事会决议可以向该股东发出失权通知，通知发出之日起该股东丧失其未缴纳出资的股权。因此解除/剥夺失权股权属于董事会职权，无须经股东会决议。\n（3）乙公司有权请求楚某提前缴纳出资。理由：根据规定，公司不能清偿到期债务的，公司或者已到期债务的债权人有权要求已认缴出资但未届出资期限的股东（楚某）提前缴纳出资（适用出资加速到期制度）。",k:1},
{id:"casegs02",ch:"公司",type:'case',q:"2023年4月，刘某、关某、张某共同投资设立了桃园有限责任公司（以下简称“桃园公司”），刘某担任公司董事长，关某担任公司董事。2025年11月，江东投资公司拟收购桃园公司，经查，桃园公司存在下列情况：（1）刘某将其已转入桃园公司账户的200万元出资转出100万元；\n（2）关某曾于2020年因行贿罪被判有期徒刑3年，2023年刑满释放；\n（3）张某出资的办公用房，虽已办理权属转移手续，但至今仍未交付桃园公司使用。为此，其他股东主张张某不得享有相应的股东权利。要求：根据上述资料及公司法律制度的规定，不考虑其他因素，回答下列问题。（1）刘某转出100万元出资是什么行为？刘某应向桃园公司承担什么民事责任？\n（2）关某担任桃园公司董事是否合法？简要说明理由。\n（3）其他股东主张张某不享有相应的股东权利是否合法？简要说明理由。",a:"（1）刘某的行为属于抽逃出资。刘某应向桃园公司返还抽逃的出资100万元及利息；给公司造成损失的，负有责任的董事、监事、高级管理人员应当与刘某承担连带赔偿责任。\n（2）不合法。理由：根据规定，因贪污、贿赂、侵占财产、挪用财产或者破坏社会主义市场经济秩序被判处刑罚，执行期满未逾5年的，不得担任公司的董事、监事、高级管理人员。关某因行贿罪被判处有期徒刑，2023年刑满释放，至2025年11月未满5年，不具备担任桃园公司董事的资格。\n（3）合法。理由：股东以房屋等非货币财产出资，虽已办理权属变更手续但未交付公司使用的，公司或者已按期足额缴纳出资的股东主张其在交付前不享有相应股东权利的，人民法院应予支持。"},
{id:"casegs03",ch:"公司",type:'case',q:"甲、乙、丙、丁、戊共同出资设立了A有限责任公司（以下简称“A公司”），出资比例分别为22%、30%、20%、20%、8%。某年A公司发生有关事项如下：（1）3月，甲向银行申请贷款时请求A公司为其提供担保。为此甲提议召开临时股东会，董事会按期召集了股东会，会议就A公司为甲提供担保事项进行表决时，甲、乙、戊赞成，丙、丁反对，股东会作出了为甲提供担保的决议。\n（2）6月，因A公司实力明显增强，乙提议将公司变更为股份有限公司。为此董事会按期召集了股东会，会议就变更公司形式事项进行表决时，乙、丙、丁赞成，甲、戊反对，股东会作出了变更公司形式的决议。要求：根据上述资料及公司法律制度的规定，不考虑其他因素，回答下列问题。（1）甲是否有权提议召开临时股东会？简要说明理由。\n（2）股东会作出的为甲提供担保的决议是否合法？简要说明理由。\n（3）股东会作出的变更公司形式的决议是否合法？简要说明理由。",a:"（1）甲有权提议召开临时股东会。理由：代表1/10以上表决权的股东有权提议召开临时股东会。甲的出资比例为22%（对应表决权22%），超过了1/10，故有权提议。\n（2）股东会作出的为甲提供担保的决议不合法。理由：公司为股东（甲）提供担保，接受担保的股东（甲）不得参加表决，该项表决由出席会议的其他股东所持表决权的过半数通过。本题中甲参与了表决（甲22%＋乙30%＋戊8%＝60%）；扣除甲后，其他赞同股东（乙30%＋戊8%＝38%）占其他股东总表决权（78%）比例为38/78＝48.71%，未达到过半数，因此该决议无效/不合法。\n（3）股东会作出的变更公司形式的决议合法。理由：有限责任公司变更公司形式（变更为股份有限公司）属于特别决议事项，须经代表2/3以上表决权的股东通过。赞成股东为乙（30%）、丙（20%）、丁（20%），合计占表决权70%，已超过2/3（66.67%），故决议合法有效。"},
{id:"casegs04",ch:"公司",type:'case',q:"甲股份有限公司（简称“甲公司”），其股票于2020年5月上市，股本总额为2亿元、资产总额为5亿元，董事会成员共9人。2025年7月，甲公司召开董事会，出席会议的董事为5人，分别讨论了如下事项：（1）讨论通过了为其子公司向银行借款2亿元提供担保的决议；\n（2）以涉及财务资助为由，取消公司为员工持股计划名单上的员工为取得股份而发生的银行借款提供担保的决定；\n（3）讨论为公司利益向乙公司提供借款5000万元，乙公司将用该笔借款购入甲公司母公司的股份，出席会议的董事全部投了赞成票。已知，甲公司的公司章程规定，财务资助事项由董事会决议。要求：根据上述资料及相关规定，不考虑其他因素，回答下列问题。（1）甲公司董事会是否有权作出决议为子公司2亿元的借款提供担保？并简要说明理由。\n（2）甲公司董事会取消为员工提供担保事项的理由是否成立？并简要说明理由。\n（3）为乙公司提供借款金额是否合法？董事会是否通过了该项决议？并分别简要说明理由。",a:"（1）甲公司董事会无权作出该项担保决议。理由：甲公司资产总额为5亿元，本次担保金额为2亿元，占资产总额的比例为2亿/5亿＝40%。根据规定，上市公司在一年内担保金额超过公司资产总额30%的，应当由股东会作出决议，并经由出席会议的股东所持表决权的2/3以上通过，董事会无权直接决定。\n（2）理由不成立。理由：根据规定，公司不得为他人取得本公司或者其母公司的股份提供赠与、借款、担保以及其他财务资助，但公司实施员工持股计划的除外。本案担保的对象是员工持股计划名单上的员工，属于法定除外情形，董事会以“涉及财务资助”为由取消该担保，理由不成立。\n（3）为乙公司提供借款不合法；董事会未通过该项决议。借款不合法理由：公司不得直接或间接向他人提供资金用于购买本公司或者其母公司的股份（禁止为母公司股权收购提供禁忌财务资助/资助买股）。董事会未通过理由：即使属于合法授权董事会决议的财务资助事项，也应当经全体董事的2/3以上（9名董事中的6名以上）通过。本次会议仅5名董事出席并投赞成票，未达到全体董事的2/3，故决议未通过。"},
{id:"caseph01",ch:"合伙",type:'case',q:"张某、王某、李某共同出资设立了甲普通合伙企业，合伙协议约定由张某执行合伙企业事务，但仅有权决定不超过100万元的支出。甲企业成立后第2年，张某的朋友刘某拟从银行借款80万元，请求张某为其提供担保。张某自行决定以甲企业的名义为刘某提供了担保。此后不久，张某又以甲企业的名义与赵某签订了一份150万元的原材料采购合同。王某、李某认为张某签订买卖合同的行为不妥，决定撤销张某对外签订合同的资格。付款期限届至，赵某要求甲企业付款时，甲企业以该合同是张某超越权限订立、合同无效为由拒绝支付。经查，合伙协议就执行合伙事务的其他事项未作特别约定，赵某对张某超越合伙协议的权限限制签订合同一事知情。要求回答：（1）张某是否有权自行决定以合伙企业的名义为刘某提供担保？简要说明理由。\n（2）甲企业主张买卖合同无效是否成立？简要说明理由。\n（3）王某、李某是否有权撤销张某对外签订合同的资格？简要说明理由。",a:"（1）张某无权自行决定以合伙企业的名义为刘某提供担保。法律依据：根据规定，除合伙协议另有约定外，以合伙企业名义为他人提供担保，应当经全体合伙人一致同意。本案中合伙协议未作特别约定，张某单方决定担保违法。\n（2）甲企业主张买卖合同无效成立（即合同对甲企业不发生效力/甲企业有权拒绝付款）。法律依据：根据规定，合伙企业对合伙人执行合伙事务以及对外代表合伙企业权利的限制，不得对抗善意第三人。在本案中，相对人赵某对张某“超越100万元支出权限”的事实明确知情（属于恶意第三人），因此甲企业可以以张某越权为由拒绝承认该合同效力。\n（3）王某、李某有权撤销张某对外签订合同的资格（撤销事务执行委托）。法律依据：根据规定，受委托执行合伙事务的合伙人不按照合伙协议或者全体合伙人的决定执行事务的，其他合伙人可以决定撤销该委托。"},
{id:"caseph02",ch:"合伙",type:'case',q:"甲、乙、丙、丁四人成立了一家有限合伙企业，甲、乙、丙是有限合伙人，丁是普通合伙人。合伙企业存续期间发生下列事项：（1）甲将其所有的机器设备以高于市场价10%的价格出售给该合伙企业。\n（2）乙同时拥有一家个人独资企业，经营的业务与该有限合伙企业的业务相同。\n（3）丙在一次外出途中，因车祸受伤，经鉴定，完全丧失民事行为能力。已知，对上述事项，合伙协议均无特殊约定。要求回答：（1）甲将其所有的机器设备以高于市场价10%的价格出售给该合伙企业的行为是否符合法律规定？并简要说明理由。\n（2）乙同时经营另一家个人独资企业的行为是否符合法律规定？并简要说明理由。\n（3）丙完全丧失民事行为能力后，其他合伙人能否要求其当然退伙？并简要说明理由。",a:"（1）符合法律规定。法律依据：根据规定，有限合伙人可以同本有限合伙企业进行交易，但合伙协议另有约定的除外。本案中合伙协议无特殊约定，甲作为有限合伙人有权与企业进行交易。\n（2）符合法律规定。法律依据：根据规定，有限合伙人可以自营或者同他人合作经营与本有限合伙企业相竞争的业务，但合伙协议另有约定的除外。乙为有限合伙人且协议无特殊约定，故可以从事同业竞争。\n（3）其他合伙人不能要求丙当然退伙。法律依据：根据规定，作为有限合伙人的自然人在有限合伙企业存续期间丧失民事行为能力的，其他合伙人不得因此要求其退伙，丙可以直接转为其法定代理人代理下的有限合伙人。"},
{id:"caseph03",ch:"合伙",type:'case',q:"甲、乙、丙拟设立A有限合伙企业。合伙协议约定：（1）甲为普通合伙人，以生产设备作价30万元出资；乙、丙为有限合伙人，各以50万元现金出资；甲、乙在A企业成立时一次缴清出资，丙自企业成立之日起5年内缴清出资。\n（2）A企业事务由甲负责执行，并由A企业向甲每月支付报酬3万元。\n（3）A企业应当定期接受审计，乙有权参与选择承办A企业审计业务的会计师事务所。（4）A企业的盈利在丙未缴纳50万元出资前全部分配给甲和乙。要求回答：（1）合伙协议约定每月支付甲3万元报酬是否符合规定？简要说明理由。\n（2）合伙协议有关乙参与选择承办审计业务的会计师事务所的约定可否视为乙在执行合伙企业事务？简要说明理由。\n（3）合伙协议可否约定A企业的利润全部分配给甲和乙？简要说明理由。",a:"（1）符合规定。法律依据：根据规定，有限合伙企业由普通合伙人执行合伙事务，执行事务合伙人有权按照合伙协议的约定或者全体合伙人的决定获取报酬。\n（2）不可视为乙在执行合伙企业事务。法律依据：根据规定，有限合伙人参与选择承办有限合伙企业审计业务的会计师事务所，属于法律规定的“不视为执行合伙事务”的情形（安全港条款）。\n（3）可以约定全部分配给甲和乙。法律依据：根据规定，有限合伙企业不得将全部利润分配给部分合伙人，但是合伙协议另有约定的除外。既然A企业的合伙协议对此作出了明确约定，该约定即合法有效。"},
{id:"caseht01",ch:"合同",type:'case',q:"2024年1月10日，杨某与4S店签订了《购车合同》，约定购车款分期支付，杨某支付首期1/5购车款后可以将车辆开走，其他款项平均分4期在1年内付清，在付清价款前4S店保留该车的所有权。次日，杨某依约支付了1/5购车款，4S店派员配合杨某办理车辆牌照手续，并要求在该车辆上办理所有权保留登记。杨某不同意办理所有权保留登记，与4S店协商以其祖传的手镯质押，如果剩余4期购车款有任何一期未按期支付，手镯归4S店所有，4S店表示同意。1月15日，双方又签订了《补充协议》，杨某将手镯交付给4S店。1月20日，车辆牌照正式办理完毕。杨某一直未支付剩余的购车款，经4S店多次催告仍不支付，反而将车辆转手卖给了不知情的罗某，4S店顺着车辆过户线索找到了罗某，出示《购车合同》要求罗某返还车辆，罗某坚决不同意，主张自己已经取得车辆的所有权。4S店遂通知杨某因其未按期支付购车款，即日起手镯的所有权归4S店，同时《购车合同》解除。要求回答：（1）罗某关于取得车辆的所有权的主张是否成立？简要说明理由。\n（2）4S店关于即日起手镯的所有权归4S店的主张是否成立？简要说明理由。\n（3）4S店是否有权通知杨某解除《购车合同》？简要说明理由。",a:"（1）成立。理由：根据规定，出卖人对标的物保留的所有权，未经登记，不得对抗善意第三人。\n（2）不成立。理由：根据规定，质权人在债务履行期届满前，与出质人约定债务人不履行到期债务时质押财产归债权人所有的，质权人只能依法就质押财产优先受偿，而不能直接取得质押财产的所有权。\n（3）有权。理由：根据规定，分期付款的买受人未支付到期价款的数额达到全部价款的1/5，经催告后在合理期限内仍未支付到期价款的，出卖人可以请求买受人支付全部价款或者解除合同。"},
{id:"caseht02",ch:"合同",type:'case',q:"刘某将自己的房屋出租给关某，约定租期5年，年租金1万元，租金先住后付，每年年底结清全年租金。关某租住1年后因需要外出经刘某同意将房屋转租给张某，约定租期4年，年租金1万元，上年年底预付下年全年租金。张某租住1年后，刘某告知张某，关某已2年未按照约定支付租金，刘某拟解除租赁合同。张某提出自己代关某支付租金，刘某同意，张某遂向刘某结清了其欠付的2万元租金。至当年底，关某归来，向张某索要下一年度租金时，张某表示应该在代为支付的租金中充抵，其对关某已经不存在应付租金了。关某索要租金无果又加上刘某再次追债，索性外出打工。至次年底，张某预付下一年租金时关某仍下落不明，张某遂将下一年租金向公证机关办理了提存。要求回答：（1）张某是否可以代关某支付欠付的租金？简要说明理由。\n（2）关某向张某索要租金时，张某提出的充抵主张是否符合法律规定？简要说明理由。\n（3）张某向公证机关提存租金款项产生的利息由谁享有？简要说明理由。",a:"（1）张某可以代为支付。理由：根据规定，承租人拖欠租金的，次承租人可以代承租人支付其欠付的租金和违约金，但转租合同对出租人不具有法律约束力的除外。\n（2）张某的充抵主张符合规定。理由：根据规定，次承租人代为支付的租金和违约金，可以充抵次承租人应当向承租人支付的租金；超出其应付的租金数额的，可以向承租人追偿。\n（3）归关某所有。理由：根据规定，提存期间，标的物的孳息归债权人所有。"},
{id:"caseht03",ch:"合同",type:'case',q:"甲公司与乙公司签订融资租赁合同，甲公司根据乙公司的选择，向丙公司购买了1台大型设备，出租给乙公司使用。保修期过后，该设备不能正常运行，且在某次事故中造成员工李某受伤，乙公司遂要求甲公司履行维修义务，承担设备不符合约定的违约责任，并对李某所受损害承担赔偿责任。甲公司表示拒绝，乙公司遂以此为由拒绝支付租金。要求回答：（1）甲公司是否应履行维修义务？简要说明理由。\n（2）甲公司是否应承担设备不符合约定的违约责任？简要说明理由。\n（3）甲公司是否应对李某所受损害承担赔偿责任？简要说明理由。",a:"（1）甲公司无须履行维修义务。理由：根据规定，在融资租赁合同中，承租人应当履行占有租赁物期间的维修义务。\n（2）甲公司无须承担设备不符合约定的违约责任。理由：根据规定，融资租赁物不符合约定或者不符合使用目的的，出租人不承担责任；但承租人依赖出租人的技能确定租赁物或者出租人干预选择租赁物的除外。\n（3）甲公司无须对李某所受损害承担赔偿责任。理由：根据规定，承租人占有融资租赁物期间，租赁物造成第三人的人身损害或者财产损失的，出租人不承担赔偿责任。",k:1},
{id:"caseht04",ch:"合同",type:'case',q:"2025年1月21日，周某向梁某借款50万元，双方签订了借款合同，借款期限1个月，月利率为2%。周某的朋友关某是某公益性养老机构的负责人，关某利用职权以该养老机构名义为周某的借款提供保证，与梁某签订了保证合同。2025年2月21日，借款到期周某无力清偿借款本息，梁某请求关某所在公益性养老机构承担保证责任，该养老机构以保证合同无效为由拒绝。2025年2月25日，梁某发现周某将一辆价值10万元的轿车赠送给亲戚郑某，遂提起诉讼请求撤销周某的赠与行为。已知，2025年1月1年期贷款市场报价利率为3.1%。要求回答：（1）如果梁某要求按月利率2%计息，能否得到人民法院的全额支持？简要说明理由。\n（2）关某所在公益性养老机构能否以保证合同无效为由拒绝承担保证责任？简要说明理由。\n（3）梁某是否有权请求撤销周某的赠与行为？简要说明理由。",a:"（1）不能得到人民法院的全额支持。理由：根据规定，在民间借贷中，出借人请求借款人按照合同约定利率支付利息的，人民法院应予支持，但是双方约定的利率超过合同成立时1年期贷款市场报价利率（LPR）4倍的除外。在本案中，月利率2%＝年利率24%＞3.1%×4（即12.4%），超过3.1%×4部分的利息不能得到人民法院支持。\n（2）有权拒绝。理由：根据规定，除法定特殊情形外，以公益为目的的非营利性学校、幼儿园、医疗机构、养老机构等提供担保的，人民法院应当认定担保合同无效。\n（3）有权请求撤销。理由：根据规定，债务人无偿转让财产，影响债权人债权实现的，债权人可以请求人民法院撤销债务人的行为。"},
{id:"caseht05",ch:"合同",type:'case',q:"2025年1月5日甲房地产开发公司（简称“甲公司”）与乙银行约定：甲公司以其商场向乙银行设立抵押，担保未来2年内乙银行对甲公司的借款债权，债权最高额为1000万元。未约定债权和抵押权转让事宜。双方当日签订书面合同，次日办理抵押登记。截至2025年8月10日，甲公司向乙银行先后贷款3笔，分别为500万元、200万元、100万元。乙银行于8月11日将其中第二笔200万元债权让与丙公司，双方未约定抵押权转让事宜。8月12日上午，甲公司通过网上银行向乙银行偿还了第二笔200万元贷款中的10万元本金。当天下午甲公司收到乙银行将债权让与丙公司的通知，后丙公司请求甲公司清偿200万元债权及利息未果，遂向人民法院起诉要求行使抵押权。甲公司抗辩称：（1）丙公司债权本金只有190万元；\n（2）丙公司无权行使抵押权。要求回答：（1）乙银行的抵押权何时设立？简要说明理由。\n（2）甲公司有关丙公司债权本金只有190万元的主张是否成立？简要说明理由。\n（3）丙公司是否有权行使抵押权？简要说明理由。",a:"（1）1月6日设立。理由：根据规定，以建筑物设定抵押的，抵押权自登记时起设立。\n（2）成立。理由：根据规定，债权人转让债权，应当通知债务人，未通知债务人的，该转让对债务人不发生效力。乙银行的债权让与通知在甲公司向乙银行偿还了10万元本金之后才到达甲公司，仅对甲公司尚未清偿部分生效，因此，丙公司只能请求甲公司清偿190万元，其余10万元应向乙银行主张。\n（3）无权行使。理由：根据规定，最高额抵押担保的债权确定前，部分债权转让的，最高额抵押权不得转让，但当事人另有约定的除外。"},
]);

<script>(function(){
'use strict';
const CH=[
 {key:'导论',name:'经济法导论',num:'壹',color:'#8a6a3b'},
 {key:'个人独资',name:'个人独资企业法',num:'贰',color:'#2f6b57'},
 {key:'合伙',name:'合伙企业法',num:'叁',color:'#1f4e79'},
 {key:'公司',name:'公司法',num:'肆',color:'#7a3b52'},
 {key:'合同',name:'合同法律制度',num:'伍',color:'#a35a2a'}
];
const BANK=(window.BANK_PARTS||[]).reduce(function(a,b){return a.concat(b)},[]);
const byId={}; BANK.forEach(function(q){byId[q.id]=q});
const TYPES={single:'单选',multi:'多选',judge:'判断',case:'案例'};
/* ---------- persistence ---------- */
const DBKEY='jf_review_v3';
const SESSKEY='jf_review_sess_v3';
const PMETA='jf_review_profiles_v1';
let DB={rec:{},streak:{last:'',days:0}};
(function initDB(){
  try{
    const raw=localStorage.getItem(DBKEY);
    if(raw){const o=JSON.parse(raw);DB.rec=o.rec||{};DB.streak=o.streak||DB.streak;return;}
  }catch(e){}
  /* 迁移旧数据：优先取原“当前用户”的进度，其次取最早的单用户键 */
  const cands=[];
  try{const meta=JSON.parse(localStorage.getItem(PMETA));if(meta&&meta.current)cands.push('jf_review_u_'+meta.current+'_v2');}catch(e){}
  cands.push('jf_review_v2');
  for(let i=0;i<cands.length;i++){
    try{
      const raw=localStorage.getItem(cands[i]);
      if(raw){const o=JSON.parse(raw);DB.rec=o.rec||{};DB.streak=o.streak||DB.streak;break;}
    }catch(e){}
  }
  save();
  /* 迁移旧会话，保证退出网页再回来仍能停留在原题 */
  try{
    if(!localStorage.getItem(SESSKEY)){
      const meta=JSON.parse(localStorage.getItem(PMETA));
      const sk=meta&&meta.current?('jf_review_sess_'+meta.current):null;
      const old=sk&&localStorage.getItem(sk);
      if(old)localStorage.setItem(SESSKEY,old);
    }
  }catch(e){}
})();
function save(){try{localStorage.setItem(DBKEY,JSON.stringify(DB))}catch(e){}}
function saveSession(){try{if(!S.session){localStorage.removeItem(SESSKEY);return}localStorage.setItem(SESSKEY,JSON.stringify({session:S.session,savedAt:Date.now()}))}catch(e){}}
function clearSession(){try{localStorage.removeItem(SESSKEY)}catch(e){}}
const S={view:'home',session:null,result:null,timer:null,examCfg:{n:30,min:30},kfilter:'all',kopen:{},resumedBanner:false};

function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}
function rec(id){return DB.rec[id]||(DB.rec[id]={attempts:0,right:0,wrong:0,streak:0,book:0,lastWrong:0})}
function bookIds(){return Object.keys(DB.rec).filter(function(id){return byId[id]&&DB.rec[id].book})}
let toastTimer=null;
function toast(msg){
  let el=document.getElementById('toast');
  if(!el){el=document.createElement('div');el.id='toast';document.body.appendChild(el);}
  el.textContent=msg;el.classList.add('on');
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.classList.remove('on')},1800);
}
function answerKeys(q){if(q.type==='judge')return [q.a?'A':'B']; if(q.type==='multi')return q.a.slice(); return [q.a]}
function optionsOf(q){if(q.type==='judge')return [{k:'A',t:'正确'},{k:'B',t:'错误'}]; return q.o.map(function(t,i){return {k:String.fromCharCode(65+i),t:t}})}
function isCorrect(q,picked){
  const keys=answerKeys(q);
  if(q.type==='multi'){return picked.length===keys.length&&keys.every(function(k){return picked.indexOf(k)>-1})}
  return picked.length===1&&keys.indexOf(picked[0])>-1;
}
function answerText(q){
  const opts=optionsOf(q), keys=answerKeys(q);
  if(q.type==='judge')return q.a?'正确':'错误';
  return keys.map(function(k){const o=opts.filter(function(x){return x.k===k})[0];return k+(o?'．'+o.t:'')}).join('；');
}
function touchStreak(){
  const today=new Date().toDateString();
  if(DB.streak.last===today)return;
  const y=new Date(Date.now()-86400000).toDateString();
  DB.streak.days=DB.streak.last===y?((DB.streak.days||0)+1):1;
  DB.streak.last=today; save();
}
function record(q,ok){
  touchStreak();
  const r=rec(q.id);
  r.attempts=(r.attempts||0)+1;
  if(ok){r.right=(r.right||0)+1;r.streak=(r.streak||0)+1;}
  else{r.wrong=(r.wrong||0)+1;r.streak=0;r.lastWrong=Date.now();}
  r.last=Date.now(); save();
}
function stats(){
  let attempts=0,right=0,seen=0,mastered=0,wrongQ=0;
  Object.keys(DB.rec).forEach(function(id){
    if(!byId[id])return; const r=DB.rec[id];
    attempts+=r.attempts||0; right+=r.right||0;
    if((r.attempts||0)>0)seen++;
    if((r.streak||0)>=2)mastered++;
    if((r.wrong||0)>0&&(r.streak||0)<2)wrongQ++;
  });
  return {attempts:attempts,right:right,seen:seen,mastered:mastered,wrongQ:wrongQ,acc:attempts?Math.round(right/attempts*100):0,total:BANK.length};
}
function chapStats(ch){
  const qs=BANK.filter(function(q){return q.ch===ch});
  let seen=0,att=0,right=0,mastered=0;
  qs.forEach(function(q){
    const r=DB.rec[q.id]; if(!r)return;
    if((r.attempts||0)>0)seen++;
    att+=r.attempts||0; right+=r.right||0;
    if((r.streak||0)>=2)mastered++;
  });
  return {total:qs.length,seen:seen,acc:att?Math.round(right/att*100):0,mastered:mastered};
}
function wrongIds(){
  return Object.keys(DB.rec).filter(function(id){
    const r=DB.rec[id]; return byId[id]&&r.wrong>0&&(r.streak||0)<2;
  }).sort(function(a,b){return (DB.rec[b].wrong||0)-(DB.rec[a].wrong||0)});
}

/* ---------- views ---------- */
function setViewOnly(v){
  S.view=v;
  document.querySelectorAll('.view').forEach(function(el){el.classList.toggle('on',el.id==='view-'+v)});
  document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('on',b.dataset.view===v)});
}
function showView(v){
  setViewOnly(v);
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function render(){
  updateStreak();
  if(S.view==='home')renderHome();
  else if(S.view==='practice')renderPractice();
  else if(S.view==='wrong')renderWrong();
  else if(S.view==='cards')renderCards();
  else if(S.view==='exam')renderExam();
}
function updateStreak(){
  const el=$('streak'); if(el)el.innerHTML='连续学习 <b>'+(DB.streak.days||0)+'</b> 天';
}
function ringHTML(pct,size){
  const p=Math.max(0,Math.min(100,pct));
  return '<div class="ring" style="width:'+size+'px;height:'+size+'px"><svg viewBox="0 0 100 100">'
   +'<circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="7"/>'
   +'<circle cx="50" cy="50" r="42" fill="none" stroke="#e0b567" stroke-width="7" pathLength="100" stroke-dasharray="'+p+' '+(100-p)+'" transform="rotate(-90 50 50)"/>'
   +'</svg><div class="num"><div><b>'+pct+'%</b><small>题库覆盖</small></div></div></div>';
}
function renderHome(){
  const st=stats(), pct=Math.round(st.seen/st.total*100);
  const wrong=wrongIds().slice(0,4);

function startSession(ids,opts){
  opts=opts||{};
  ids=ids.filter(function(id){return byId[id]});
  if(!ids.length){alert('这里还没有题目。');return;}
  clearInterval(S.timer); S.timer=null; S.result=null; S.resumedBanner=false;
  S.session={ids:ids,idx:0,picked:{},graded:{},revealed:{},exam:!!opts.exam,study:!!opts.study,title:opts.title||'练习',start:Date.now(),limit:opts.limit||0,deadline:opts.limit?Date.now()+opts.limit*1000:0};
  showView('practice');
  if(opts.exam)beginTimer();
}
function beginTimer(){
  clearInterval(S.timer);
  S.timer=setInterval(function(){
    const s=S.session;
    if(!s||!s.exam){clearInterval(S.timer);S.timer=null;return;}
    const left=s.deadline-Date.now();
    const t=$('timer');
    if(t)t.textContent=fmt(Math.max(0,left));
    if(left<=0){clearInterval(S.timer);S.timer=null;finishSession();}
  },1000);
  const t=$('timer'); if(t)t.textContent=fmt(Math.max(0,S.session.deadline-Date.now()));
}
function fmt(ms){
  const s=Math.max(0,Math.floor(ms/1000)), m=Math.floor(s/60), ss=s%60;
  return (m<10?'0':'')+m+':'+(ss<10?'0':'')+ss;
}

function gradeCurrent(){
  const s=S.session, q=byId[s.ids[s.idx]];
  const picked=s.picked[q.id]||[];
  const ok=isCorrect(q,picked);
  s.graded[q.id]={picked:picked.slice(),ok:ok};
  record(q,ok);
  renderPractice();
  const ex=document.querySelector('.explain');
  if(ex)ex.scrollIntoView({behavior:'smooth',block:'center'});
}
function choose(k){
  const s=S.session, q=byId[s.ids[s.idx]];
  if(!s||!q||q.type==='case'||s.study)return;
  if(s.graded[q.id])return;
  const picked=s.picked[q.id]||[];
  if(q.type==='multi'){
    const i=picked.indexOf(k);
    if(i>-1)picked.splice(i,1); else picked.push(k);
    s.picked[q.id]=picked;
    renderPractice();
  }else{
    s.picked[q.id]=[k];
    if(s.exam){renderPractice();}
    else gradeCurrent();
  }
}
function goNext(){
  const s=S.session; if(!s)return;
  const q=byId[s.ids[s.idx]];
  if(!s.exam&&!s.study&&q&&q.type==='multi'&&!s.graded[q.id])return;
  if(s.idx<s.ids.length-1){s.idx++;renderPractice();window.scrollTo({top:0,behavior:'smooth'});}
  else if(s.study){return;}
  else if(s.exam){if(confirm('确定交卷吗？未作答题目将计为错误。'))finishSession();}
  else finishSession();
}
function finishSession(){
  const s=S.session; if(!s)return;
  clearInterval(S.timer); S.timer=null; clearSession(); S.resumedBanner=false;
  let answered=0,correct=0,wrongList=[],caseIds=[];
  s.ids.forEach(function(id){
    const q=byId[id];
    if(q.type==='case'){caseIds.push(id);return;}
    let g=s.graded[id];
    if(s.exam){
      const picked=s.picked[id]||[];
      const ok=picked.length?isCorrect(q,picked):false;
      g={picked:picked,ok:ok};
      s.graded[id]=g;
      record(q,ok);
    }
    if(g){answered++; if(g.ok)correct++; else wrongList.push(id);}
    else wrongList.push(id);
  });
  S.result={title:s.title,total:s.ids.length,answered:answered,correct:correct,wrong:wrongList,caseIds:caseIds,time:Date.now()-s.start,exam:s.exam};
  S.session=null;
  renderPractice();
  window.scrollTo({top:0,behavior:'smooth'});
}

  h+='</div>';
  KNOW.forEach(function(group){
    if(S.kfilter!=='all'&&S.kfilter!==group.ch)return;
    h+='<div class="card kcard'+(S.kopen[group.ch]===false?'':' open')+'"><div class="kh" data-act="ktoggle" data-k="'+group.ch+'"><span class="no">'+group.num+'</span><h3>'+group.name+'</h3><span class="arr">▸</span></div><div class="kb">';
    group.sections.forEach(function(sec,si){
      h+='<div style="margin:10px 0 4px;font-family:var(--serif);font-size:14px;letter-spacing:1px;color:#7a6a4c">'+sec.h+'</div><ul>';
      sec.items.forEach(function(it){h+='<li>'+it+'</li>'});
      h+='</ul>';
    });
    h+='</div></div>';
  });
  $('cardsBody').innerHTML=h;
}

/* ---------- exam ---------- */
function renderExam(){
  if(S.session&&S.session.exam){
    $('examBody').innerHTML='<div class="card exam-setup"><h2>考试进行中</h2><p>'+esc(S.session.title)+' · 共 '+S.session.ids.length+' 题</p>'
     +'<div style="display:flex;gap:10px"><button class="btn primary" data-act="resume-exam">继续答题</button><button class="btn red" data-act="submit-exam">立即交卷</button></div></div>';
    return;
  }
  const c=S.examCfg;
  let h='<div class="card exam-setup"><h2>模拟考试</h2><p>含单选、多选、判断与适量案例分析题；客观题交卷后统一判分，案例题查看参考答案后自评。</p>';
  h+='<div class="field"><label>题目数量</label><div class="seg">';
  [20,30,50].forEach(function(n){h+='<button class="'+(c.n===n?'on':'')+'" data-act="exam-n" data-n="'+n+'">'+n+' 题</button>'});
  h+='</div></div>';
  h+='<div class="field"><label>考试时间</label><div class="seg">';
  [20,30,45].forEach(function(m){h+='<button class="'+(c.min===m?'on':'')+'" data-act="exam-min" data-m="'+m+'">'+m+' 分钟</button>'});
  h+='</div></div>';
  h+='<div style="margin-top:8px"><button class="btn primary" data-act="start-exam" style="width:100%;padding:13px">开始考试</button></div>';
  h+='<div class="notice">提示：中途离开页面计时不会暂停。时间到自动交卷，未作答的客观题按错误计入错题本；案例题交卷后自评。</div></div>';
  $('examBody').innerHTML=h;
}

/* ---------- actions ---------- */
document.addEventListener('click',function(e){
  const t=e.target.closest('[data-act]'); if(!t)return;
  const act=t.dataset.act;
  if(act==='start-ch'){
    const ch=t.dataset.ch;
    startSession(BANK.filter(function(q){return q.ch===ch}).map(function(q){return q.id}),{title:ch+' · 顺序练习'});
  }
  else if(act==='start-random'){startSession(shuffle(BANK).slice(0,40).map(function(q){return q.id}),{title:'随机 40 题'});}
  else if(act==='start-wrong'){const ids=wrongIds(); if(!ids.length){alert('目前没有待攻克的错题。');return;} startSession(ids,{title:'错题重练'});}
  else if(act==='start-book'){const ids=bookIds(); if(!ids.length){alert('还没有收藏题目。做题时点题目右上角的 ★ 即可收藏，收藏后可在这里集中复习。');return;} startSession(ids,{title:'我的收藏'});}
  else if(act==='start-case'){const ids=BANK.filter(function(q){return q.type==='case'}).map(function(q){return q.id}); startSession(ids,{title:'大题专练 · 案例分析'});}
  else if(act==='start-study'){startSession(BANK.map(function(q){return q.id}),{title:'背题模式 · 全题库',study:true});}
  else if(act==='study-ch'){const ch=t.dataset.ch;startSession(BANK.filter(function(q){return q.ch===ch}).map(function(q){return q.id}),{title:'背题 · '+ch,study:true});}
  else if(act==='study-home'){S.session=null;S.result=null;S.resumedBanner=false;clearSession();render();}
  else if(act==='practice-one'){startSession([t.dataset.id],{title:'单题重练'});}
  else if(act==='practice-ids'){startSession(t.dataset.ids.split(','),{title:'错题重练'});}
  else if(act==='opt'){choose(t.dataset.k);}
  else if(act==='submit-multi'){gradeCurrent();}
  else if(act==='prev'){if(S.session&&S.session.idx>0){S.session.idx--;renderPractice();}}
  else if(act==='next'){goNext();}
  else if(act==='jump'){if(S.session){S.session.idx=Number(t.dataset.i);renderPractice();}}
  else if(act==='book'){const r=rec(t.dataset.id);r.book=r.book?0:1;save();renderPractice();toast(r.book?'已收藏，可在「概览 → 我的收藏」集中复习':'已取消收藏');}
  else if(act==='exit-session'){if(confirm('退出当前练习？本组进度将结束，已收藏的题目不受影响。')){S.session=null;S.result=null;S.resumedBanner=false;clearSession();renderPractice();window.scrollTo({top:0});}}
  else if(act==='case-reveal'){S.session.revealed[byId[S.session.ids[S.session.idx]].id]=true;renderPractice();}
  else if(act==='case-ok'||act==='case-bad'){
    const q=byId[S.session.ids[S.session.idx]];
    S.session.graded[q.id]={picked:[],ok:act==='case-ok'};
    record(q,act==='case-ok'); renderPractice();
  }
  else if(act==='case-toggle'){const body=t.nextElementSibling;if(body){const open=body.style.display!=='none';body.style.display=open?'none':'block';const arr=t.querySelector('.arr');if(arr)arr.textContent=open?'▸':'▾';}}
  else if(act==='case-grade'){const id=t.dataset.id,ok=t.dataset.ok==='1';const q=byId[id];if(q){record(q,ok);const sc=t.parentElement;if(sc)sc.innerHTML='<span style="font-size:12px;color:'+(ok?'#3d7a4f':'#ad3a2e')+'">'+(ok?'已标记掌握 ✓':'已加入错题本 ✗')+'</span>';}}
  else if(act==='resume-abandon'){if(confirm('放弃当前未完成的答题进度？')){S.session=null;S.result=null;S.resumedBanner=false;clearSession();showView('practice');}}
  else if(act==='retry-wrong'){startSession(t.dataset.ids.split(','),{title:'错题重练'});}
  else if(act==='home'){showView('home');}
  else if(act==='master'){const r=rec(t.dataset.id);r.streak=2;save();renderWrong();}
  else if(act==='clear-mastered'){wrongIds().forEach(function(id){DB.rec[id].streak=2});save();renderWrong();}
  else if(act==='kfilter'){S.kfilter=t.dataset.ch;renderCards();}
  else if(act==='ktoggle'){const k=t.dataset.k;const willOpen=S.kopen[k]===false;S.kopen[k]=willOpen?true:false;t.parentElement.classList.toggle('open',willOpen);}
  else if(act==='practice-home'){S.result=null;renderPractice();}
  else if(act==='exam-n'){S.examCfg.n=Number(t.dataset.n);renderExam();}
  else if(act==='exam-min'){S.examCfg.min=Number(t.dataset.m);renderExam();}
  else if(act==='start-exam'){
    const casePool=BANK.filter(function(q){return q.type==='case'});
    const objPool=BANK.filter(function(q){return q.type!=='case'});
    const caseN=Math.max(1,Math.round(S.examCfg.n*0.1));
    const n=Math.min(S.examCfg.n,casePool.length+objPool.length);
    const takeCase=Math.min(caseN,n,casePool.length);
    const caseIds=shuffle(casePool).slice(0,takeCase).map(function(q){return q.id});
    const objIds=shuffle(objPool).slice(0,n-caseIds.length).map(function(q){return q.id});
    /* 按题型分组：单选 → 多选 → 判断，案例分析放最后 */
    const TORD={single:0,multi:1,judge:2};
    objIds.sort(function(a,b){return TORD[byId[a].type]-TORD[byId[b].type]});
    startSession(objIds.concat(caseIds),{exam:true,title:'模拟考',limit:S.examCfg.min*60});
  }
  else if(act==='submit-exam'){if(S.session&&S.session.exam&&confirm('确定交卷吗？未作答题目将计为错误。'))finishSession();}
  else if(act==='resume-exam'){showView('practice');}
  else if(act==='go-exam'){showView('exam');}
});
/* 手机 / 平板：左右滑动切换上一题、下一题 */
(function(){
  const v=$('view-practice');if(!v)return;
  let sx=0,sy=0,st=0,tracking=false;
  v.addEventListener('touchstart',function(e){
    if(!S.session||!S.session.ids||e.touches.length!==1||(e.target.closest&&e.target.closest('textarea,input,select'))){tracking=false;return;}
    tracking=true;sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now();
  },{passive:true});
  v.addEventListener('touchend',function(e){
    if(!tracking)return;tracking=false;
    if(Date.now()-st>1000)return;
    const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.4)return;
    e.preventDefault();
    const btn=v.querySelector(dx<0?'[data-act="next"]':'[data-act="prev"]');
    if(btn&&!btn.disabled)btn.click();
  },{passive:false});
})();
document.addEventListener('input',function(e){
  const ta=e.target.closest('.case-input');if(!ta||!S.session)return;
  const q=byId[S.session.ids[S.session.idx]];if(!q||q.type!=='case')return;
  S.session.draft=S.session.draft||{};S.session.draft[q.id]=ta.value;saveSession();
});
document.querySelectorAll('.tab').forEach(function(b){
  b.addEventListener('click',function(){showView(b.dataset.view);});
});
document.addEventListener('keydown',function(e){
  if(S.view!=='practice'||!S.session)return;
  const tag=(e.target.tagName||'').toUpperCase();
  if(tag==='INPUT'||tag==='TEXTAREA')return;
  const s=S.session,q=byId[s.ids[s.idx]];
  if(e.key==='Enter'){
    if(tag==='BUTTON')return;
    const g=s.graded[q.id];
    if(q.type==='multi'&&!g&&!s.exam)gradeCurrent();
    else if(g||s.exam)goNext();
    e.preventDefault();return;
  }
  if(q.type==='case')return;
  let k=null;
  if(/^[1-4]$/.test(e.key))k=String.fromCharCode(64+Number(e.key));
  else if(/^[abcd]$/i.test(e.key))k=e.key.toUpperCase();
  if(k&&optionsOf(q).some(function(o){return o.k===k})){choose(k);e.preventDefault();}
});

/* init */
(function restore(){
  try{
    const raw=localStorage.getItem(SESSKEY);
    if(raw){
      const o=JSON.parse(raw);const sess=o.session;
      if(sess&&sess.ids&&sess.ids.length){
        const age=Date.now()-(o.savedAt||0);
        sess.ids=sess.ids.filter(function(id){return byId[id]});
        if(sess.ids.length&&age<=7*86400000){
          if(sess.idx>=sess.ids.length)sess.idx=sess.ids.length-1;
          if(sess.exam&&sess.deadline&&sess.deadline<=Date.now()){
            S.session=sess;finishSession();setViewOnly('practice');
          }else{
            S.session=sess;S.resumedBanner=true;setViewOnly('practice');
            if(sess.exam)beginTimer();
          }
        }else{localStorage.removeItem(SESSKEY);}
      }else{localStorage.removeItem(SESSKEY);}
    }
  }catch(e){try{localStorage.removeItem(SESSKEY)}catch(e2){}}
})();
render();
})();
</script>

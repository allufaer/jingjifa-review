<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>经济法 · 复习舱</title>
<style>:root{
  --paper:#f3efe6; --card:#fffdf8; --ink:#211f1b; --muted:#736d62;
  --line:#ddd4c4; --red:#ad3a2e; --navy:#1d3d5c; --green:#2e7a58;
  --gold:#a9803c; --shadow:0 18px 40px -24px rgba(40,32,20,.45);
  --serif:"Songti SC","STSong","SimSun","Noto Serif CJK SC",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); color:var(--ink); background:var(--paper);
  min-height:100vh; line-height:1.65; -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(1200px 600px at 12% -10%, #fffdf6 0%, transparent 60%),
    radial-gradient(900px 500px at 100% 0%, #efe7d8 0%, transparent 55%),
    repeating-linear-gradient(0deg, rgba(120,100,70,.035) 0 1px, transparent 1px 28px);
}
::selection{background:#f0d9ac}
button{font-family:inherit;cursor:pointer}
a{color:var(--navy)}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;backdrop-filter:blur(12px);
  background:rgba(246,242,233,.86);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:26px;height:74px}
.brand{display:flex;align-items:center;gap:12px;flex-shrink:0}
.seal{width:42px;height:42px;border-radius:8px;background:var(--red);color:#fff;
  display:grid;place-items:center;font-family:var(--serif);font-size:22px;
  box-shadow:0 6px 16px -8px rgba(173,58,46,.8);letter-spacing:1px}
.brand h1{font-family:var(--serif);font-size:20px;margin:0;letter-spacing:2px;line-height:1.2}
.brand p{margin:0;font-size:11px;color:var(--muted);letter-spacing:2px}
.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:999px;color:var(--muted);
  font-size:14px;letter-spacing:1px;transition:.18s}
.tab:hover{color:var(--ink);background:#ece5d7}
.tab.on{color:#fff;background:var(--navy);box-shadow:0 8px 18px -12px var(--navy)}
.streak{font-size:12px;color:var(--muted);white-space:nowrap;border-left:1px solid var(--line);padding-left:18px}
.streak b{color:var(--red);font-size:15px;font-family:var(--serif)}

/* ---------- resume ---------- */
.resume-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#f4efe3;border:1px solid #e0d4b8;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13px;color:#6b5d44;flex-wrap:wrap}
/* ---------- generic ---------- */
.view{display:none;padding:38px 0 70px;animation:fade .35s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.sect-title{display:flex;align-items:baseline;gap:12px;margin:34px 0 16px}
.sect-title h2{font-family:var(--serif);font-size:23px;margin:0;letter-spacing:2px}
.sect-title span{font-size:12px;color:var(--muted);letter-spacing:1px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 18px;
  font-size:14px;color:var(--ink);transition:.18s}
.btn:hover{border-color:var(--navy);color:var(--navy);transform:translateY(-1px)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:#16324c;color:#fff}
.btn.ghost{background:transparent}
.btn.small{padding:6px 12px;font-size:12px;border-radius:8px}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:1.35fr .9fr;gap:0;overflow:hidden}
.hero-main{padding:34px 36px}
.kicker{font-size:12px;letter-spacing:3px;color:var(--red)}
.hero h2{font-family:var(--serif);font-size:34px;margin:8px 0 10px;letter-spacing:3px;line-height:1.3}
.hero h2 em{font-style:normal;color:var(--navy);border-bottom:3px double var(--gold)}
.hero-sub{color:var(--muted);font-size:14px;max-width:520px}
.hero-actions{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.hero-side{background:linear-gradient(160deg,#1d3d5c,#16324c);color:#fff;padding:30px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:8px}
.ring{width:150px;height:150px;position:relative}
.ring svg{width:100%;height:100%}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .num b{font-family:var(--serif);font-size:30px;line-height:1}
.ring .num small{display:block;font-size:11px;letter-spacing:2px;opacity:.75;margin-top:6px}
.hero-side p{margin:2px 0;font-size:12px;letter-spacing:1px;opacity:.8}

.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}
.stat{padding:18px 20px}
.stat b{font-family:var(--serif);font-size:26px;display:block;line-height:1.1}
.stat span{font-size:12px;color:var(--muted);letter-spacing:1px}
.stat .bar{height:4px;background:#eee5d5;border-radius:4px;margin-top:12px;overflow:hidden}
.stat .bar i{display:block;height:100%;background:var(--gold)}

.chap-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.chap{display:flex;align-items:center;gap:18px;padding:18px 20px;text-align:left;transition:.2s}
.chap:hover{transform:translateY(-2px);border-color:#b9ad97}
.chap .no{font-family:var(--serif);font-size:30px;color:var(--gold);width:44px;flex-shrink:0;opacity:.85}
.chap .mid{flex:1;min-width:0}
.chap h3{margin:0;font-family:var(--serif);font-size:18px;letter-spacing:1px}
.chap .meta{font-size:12px;color:var(--muted);margin-top:2px}
.chap .prog{height:5px;border-radius:5px;background:#efe6d6;margin-top:10px;overflow:hidden}
.chap .prog i{display:block;height:100%;background:var(--navy);width:0;transition:width .6s}
.chap .go{font-size:12px;color:var(--navy);border:1px solid var(--line);padding:6px 12px;border-radius:8px;flex-shrink:0}
.study-link{margin-left:8px;padding-left:8px;border-left:1px solid var(--line);color:#2f6b4f;font-weight:600}

.recent{display:flex;flex-direction:column;gap:2px}
.recent .row{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px dashed var(--line);font-size:14px}
.recent .row:last-child{border-bottom:0}
.recent .tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px;flex-shrink:0}
.recent .txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#3b372f}
.recent .row button{opacity:0;transition:.2s}
.recent .row:hover button{opacity:1}

/* ---------- practice ---------- */
.pbar{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.pbar .track{flex:1;height:6px;background:#e8dfcf;border-radius:6px;overflow:hidden}
.pbar .track i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--red));width:0;transition:width .3s}
.pbar .pnum{font-size:12px;color:var(--muted);font-family:var(--serif);white-space:nowrap}
.qcard{padding:28px 34px 22px}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{font-size:11px;letter-spacing:1px;padding:3px 9px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.chip.ch{background:#f2ecdf;color:#5c5344;border-color:#e3d9c6}
.chip.ty{color:#fff;background:var(--navy);border-color:var(--navy);letter-spacing:2px}
.chip.ty.multi{background:#7a3b52;border-color:#7a3b52}
.chip.ty.judge{background:#2f6b57;border-color:#2f6b57}
.chip.ty.case{background:var(--gold);border-color:var(--gold)}
.chip.ky{background:#ad3a2e;color:#fff;border-color:#ad3a2e;letter-spacing:1px}
.qidx{margin-left:auto;font-size:12px;color:var(--muted);font-family:var(--serif)}
.star{border:0;background:transparent;font-size:19px;line-height:1;padding:4px;color:#c9bda6}
.star.on{color:var(--gold);transform:scale(1.08)}
#toast{position:fixed;left:50%;bottom:76px;transform:translate(-50%,12px);background:rgba(31,45,66,.94);color:#fff;
 font-size:13px;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.22s;z-index:99;max-width:80vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.stem{font-family:var(--serif);font-size:20px;line-height:1.85;margin:18px 0 22px;letter-spacing:.5px;white-space:pre-wrap}
.stem .qno{color:var(--muted);font-size:15px;margin-right:8px}
.options{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line);background:#fff;
  border-radius:12px;padding:13px 16px;transition:.16s;cursor:pointer;user-select:none;
  width:100%;text-align:left;font-family:inherit;color:inherit;font-size:15px}
.opt:hover{border-color:#b8a98e;background:#fdf9f0}
.opt .key{width:26px;height:26px;border-radius:50%;background:#f1eadb;color:var(--muted);
  display:grid;place-items:center;font-size:13px;flex-shrink:0;font-family:var(--serif);margin-top:2px}
.opt .txt{font-size:15px;line-height:1.7;color:#332f28}
.opt.sel{border-color:var(--navy);background:#f2f6fa}
.opt.sel .key{background:var(--navy);color:#fff}
.opt.right{border-color:#9dc7b4;background:#f1f8f4;pointer-events:none}
.opt.right .key{background:var(--green);color:#fff}
.opt.bad{border-color:#e3b3ad;background:#fbf1ef;pointer-events:none}
.opt.bad .key{background:var(--red);color:#fff}
.opt.dim{opacity:.55;pointer-events:none}
.qfoot{display:flex;align-items:center;gap:10px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.qfoot .hint{font-size:12px;color:var(--muted);margin-right:auto}
.qfoot .hint kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:10px;background:#fff}

.explain{margin-top:20px;border-radius:12px;padding:16px 18px;font-size:14px;line-height:1.85;
  border-left:4px solid var(--gold);background:#faf6ea;animation:fade .3s}
.explain.right{border-left-color:var(--green);background:#f2f8f4}
.explain.bad{border-left-color:var(--red);background:#fbf2ef}
.explain .verdict{font-weight:600;margin-bottom:6px;font-family:var(--serif);font-size:15px}
.explain .verdict .ans{color:var(--red)}

.case-box{border:1px dashed #cfc2a9;border-radius:12px;padding:16px 18px;background:#fcf8ef;margin-top:6px}
.case-input{width:100%;min-height:96px;resize:vertical;border:1px solid var(--line);border-radius:10px;
  background:#fffdf8;padding:12px 14px;font-family:var(--sans);font-size:14px;line-height:1.8;color:var(--ink);outline:none}
.case-input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(29,61,92,.08)}
.case-box h4{margin:0 0 8px;font-family:var(--serif);font-size:15px;letter-spacing:1px;color:#7a6a4c}
.case-box .ans{white-space:pre-wrap;font-size:14px;line-height:1.95}
.selfcheck{display:flex;gap:10px;margin-top:16px}
.mini-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}
.mini{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:#fff;font-size:11px;color:var(--muted)}
.mini.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.mini.right{border-color:var(--green);color:var(--green)}
.mini.bad{border-color:var(--red);color:var(--red);background:#fdf3f1}
.mini.now{outline:2px solid var(--gold);outline-offset:1px}

/* ---------- result ---------- */
.result{text-align:center;padding:44px 30px}
.result .big{font-family:var(--serif);font-size:64px;line-height:1;color:var(--navy)}
.result .big small{font-size:18px;color:var(--muted)}
.result h2{font-family:var(--serif);letter-spacing:3px;margin:10px 0 4px;font-size:24px}
.result p{color:var(--muted);font-size:14px}
.result-stats{display:flex;justify-content:center;gap:40px;margin:26px 0}
.result-stats div b{display:block;font-family:var(--serif);font-size:28px}
.result-stats div span{font-size:12px;color:var(--muted);letter-spacing:1px}
.result .acts{display:flex;justify-content:center;gap:10px;margin-top:10px;flex-wrap:wrap}

/* ---------- wrong book ---------- */
.wrong-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.wrong-list{display:flex;flex-direction:column;gap:10px}
.wrow{display:flex;align-items:center;gap:14px;padding:14px 18px}
.wrow .wch{font-size:11px;border:1px solid var(--line);border-radius:5px;padding:1px 7px;color:var(--muted);flex-shrink:0}
.wrow .wtxt{flex:1;font-size:14px;color:#3b372f;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .cnt{font-size:11px;color:var(--red);flex-shrink:0}
.wrow .acts{display:flex;gap:6px;flex-shrink:0}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.empty .ic{font-family:var(--serif);font-size:40px;color:#cbbfa7;display:block;margin-bottom:8px}

/* ---------- knowledge ---------- */
.knav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.knav button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;font-size:13px;color:var(--muted)}
.knav button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.kcard{padding:0;margin-bottom:14px;overflow:hidden}
.kcard .kh{display:flex;align-items:center;gap:12px;padding:16px 22px;cursor:pointer;user-select:none}
.kcard .kh .no{font-family:var(--serif);font-size:22px;color:var(--gold)}
.kcard .kh h3{margin:0;font-family:var(--serif);font-size:17px;letter-spacing:1px;flex:1}
.kcard .kh .arr{color:var(--muted);font-size:13px;transition:.2s}
.kcard.open .kh .arr{transform:rotate(90deg)}
.kcard .kb{display:none;padding:0 22px 20px 58px}
.kcard.open .kb{display:block;animation:fade .25s}
.kb ul{margin:0;padding:0;list-style:none}
.kb li{position:relative;padding:6px 0 6px 18px;font-size:14px;line-height:1.8;color:#3d382f;border-bottom:1px dashed #eee4d2}
.kb li:last-child{border-bottom:0}
.kb li::before{content:"";position:absolute;left:0;top:15px;width:6px;height:6px;border-radius:50%;background:var(--gold);opacity:.7}
.kb li b{color:var(--navy);font-weight:600}
.kb li em{font-style:normal;color:var(--red)}

/* ---------- exam setup ---------- */
.exam-setup{max-width:660px;margin:0 auto;padding:34px 36px}
.exam-setup h2{font-family:var(--serif);font-size:26px;letter-spacing:3px;margin:0 0 6px}
.exam-setup p{color:var(--muted);font-size:13px;margin:0 0 24px}
.field{margin-bottom:20px}
.field label{display:block;font-size:12px;letter-spacing:2px;color:var(--muted);margin-bottom:8px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:#fff;padding:9px 20px;border-radius:9px;font-size:14px}
.seg button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.notice{font-size:12px;color:var(--muted);background:#f7f1e4;border-radius:10px;padding:12px 14px;line-height:1.8;margin-top:22px}
.timer{font-family:var(--serif);font-size:14px;color:var(--red);border:1px solid #e0c9c4;background:#fdf4f1;border-radius:8px;padding:4px 12px}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--line);padding:26px 0 40px;color:var(--muted);font-size:12px;letter-spacing:1px}
footer .wrap{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}

@media (max-width:900px){
  .hero{grid-template-columns:1fr}
  .hero-side{flex-direction:row;padding:20px;gap:20px}
  .ring{width:110px;height:110px}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .chap-grid{grid-template-columns:1fr}
  .topbar .wrap{height:auto;padding:12px 16px;flex-wrap:wrap;gap:10px}
  .streak{display:none}
  .qcard{padding:20px}
  .stem{font-size:18px}
  .result-stats{gap:24px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <div class="brand">
      <div class="seal">法</div>
      <div><h1>经济法复习舱</h1><p>FIVE CHAPTERS · REVIEW</p></div>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab on" data-view="home">概览</button>
      <button class="tab" data-view="practice">练习</button>
      <button class="tab" data-view="wrong">错题本</button>
      <button class="tab" data-view="cards">速查</button>
      <button class="tab" data-view="exam">模拟考</button>
    </nav>
    <div class="streak" id="streak">连续学习 <b>0</b> 天</div>
  </div>
</header>

<main>
  <section class="view on" id="view-home"><div class="wrap" id="homeBody"></div></section>
  <section class="view" id="view-practice"><div class="wrap" id="practiceBody"></div></section>
  <section class="view" id="view-wrong"><div class="wrap" id="wrongBody"></div></section>
  <section class="view" id="view-cards"><div class="wrap" id="cardsBody"></div></section>
  <section class="view" id="view-exam"><div class="wrap" id="examBody"></div></section>
</main>

<footer>
  <div class="wrap">
    <span>题库依据：课程 PPT · 公司法 / 合伙企业法 / 合同法律制度配套习题（含答案与解析）</span>
    <span id="footInfo">进度与答题自动保存 · 中途退出可回到原题继续</span>
  </div>
</footer>

<script>window.BANK_PARTS = window.BANK_PARTS || [];
window.BANK_PARTS.push([
/* ================= 第一章 经济法导论 ================= */
{id:'dl01',k:1,ch:'导论',type:'single',q:'现代经济法产生的标志性法律是（　）。',o:['《法国民法典》','《谢尔曼法》','《德国民法典》','《反不正当竞争法》'],a:'B',e:'1890年美国颁布的《谢尔曼法》是世界上第一部反垄断法，被视为现代经济法产生的标志。'},
{id:'dl02',ch:'导论',type:'single',q:'我国经济法产生于（　）。',o:['新中国成立','1978年改革开放','1992年市场经济体制确立','2021年民法典生效'],a:'B',e:'我国经济法产生于1978年改革开放，发展、完善于1992年社会主义市场经济体制确立以后。'},
{id:'dl03',k:1,ch:'导论',type:'single',q:'下列不属于我国经济法渊源的是（　）。',o:['宪法','行政法规','当事人的判例','部门规章'],a:'C',e:'我国是成文法国家，只有判例而没有判例法，判例仅具有参考价值，不属于法律渊源。'},
{id:'dl04',ch:'导论',type:'single',q:'下列属于经济法律事件的是（　）。',o:['企业签订买卖合同','发生自然灾害','市场主体违法经营','政府出台监管文件'],a:'B',e:'经济法律事件是不以人的主观意志为转移的客观现象，自然灾害属于自然事件；其余三项均属经济法律行为。'},
{id:'dl05',k:1,ch:'导论',type:'single',q:'经济法的本位思想是（　）。',o:['权利本位','个人利益本位','社会责任本位','管理者本位'],a:'C',e:'民法以“权利本位”为特征，经济法以“社会责任本位”为特征。'},
{id:'dl06',ch:'导论',type:'single',q:'经济法是调整（　）过程中发生的社会关系的法律规范的总称。',o:['平等主体之间人身与财产关系','国家宏观调控和市场规制','行政机关内部管理','企业内部组织管理'],a:'B',e:'经济法是国家为了克服市场调节的盲目性和局限性而制定的，调整国家进行宏观调控和市场规制过程中发生的社会关系的法律规范总称。'},
{id:'dl07',k:1,ch:'导论',type:'single',q:'下列关系中，不属于经济法调整对象的是（　）。',o:['市场主体调控关系','市场规制关系','宏观调控关系','平等主体之间的人身关系'],a:'D',e:'平等主体之间的人身关系和财产关系由民法调整。经济法调整市场主体调控关系、市场规制关系和宏观调控关系。'},
{id:'dl08',k:1,ch:'导论',type:'single',q:'关于我国法律规范的效力等级，下列排序正确的是（　）。',o:['法律＞宪法＞行政法规＞地方性法规','宪法＞法律＞行政法规＞地方性法规','行政法规＞法律＞宪法＞地方性法规','宪法＞行政法规＞法律＞地方性法规'],a:'B',e:'效力等级：宪法＞法律＞行政法规＞地方性法规＞同级地方政府规章；宪法＞法律＞行政法规＞部门规章。'},
{id:'dl09',ch:'导论',type:'single',q:'关于经济法与行政法的区别，下列表述正确的是（　）。',o:['行政法是“管理经营者之法”，经济法是“管理管理者之法”','行政法是“管理管理者之法”，经济法是“管理经营者之法”','两者调整对象完全相同','两者均以权利本位为特征'],a:'B',e:'行政法调整行政管理关系，是“管理管理者之法”；经济法调整国家调控与规制经济的关系，是“管理经营者之法”。'},
{id:'dl10',k:1,ch:'导论',type:'single',q:'经济法律责任的第一目的是（　）。',o:['惩罚违法主体','补偿受害人损失','保护社会公共利益不受侵犯','维护行政机关权威'],a:'C',e:'经济法律责任侧重于保护社会公共利益不受侵犯，这是其第一目的。'},
{id:'dl11',k:1,ch:'导论',type:'single',q:'民法与经济法在宗旨上的区别是（　）。',o:['民法采社会本位，经济法采个人本位','民法采权利本位，经济法采社会责任本位','两者都采权利本位','两者都采社会本位'],a:'B',e:'民法以其“权利本位”为特征；经济法是以“社会责任本位”为特征。'},
{id:'dl12',ch:'导论',type:'single',q:'《公司法》《合伙企业法》《个人独资企业法》在经济法体系中属于（　）。',o:['市场主体法','市场规制法','宏观调控法','程序法'],a:'A',e:'经济法体系可分为市场主体法、市场规制法和宏观调控法。《公司法》《合伙企业法》《个人独资企业法》《企业破产法》属于市场主体法。'},
{id:'dl13',ch:'导论',type:'single',q:'经济法律关系的构成三要素是（　）。',o:['主体、事实、行为','主体、权利、义务','主体、内容、客体','主体、行为、客体'],a:'C',e:'经济法律关系由主体、内容（经济权利与经济义务）、客体三要素构成；法律事实是引起法律关系产生、变更、终止的原因。'},
{id:'dl14',ch:'导论',type:'judge',q:'自由资本主义时期，政府扮演“守夜人”角色，奉行自由放任的经济政策。',a:true,e:'自由资本主义时期奉行亚当·斯密的经济自由主义，政府不妄加干预经济，扮演“守夜人”。'},
{id:'dl15',ch:'导论',type:'judge',q:'行政法以“社会责任本位”，经济法是“管理管理者之法”。',a:false,e:'说反了。行政法是“管理管理者之法”，经济法是“管理经营者之法”；经济法采社会责任本位。'},
{id:'dl16',ch:'导论',type:'judge',q:'在我国，判例只具有参考价值，不属于法律渊源。',a:true,e:'我国属于成文法国家，只有判例没有判例法，判例不属于正式法律渊源。'},
{id:'dl17',ch:'导论',type:'judge',q:'经济法律行为是不以人的主观意志为转移的客观现象。',a:false,e:'经济法律行为是人们有意识的活动（作为或不作为）；不以人的意志为转移的是经济法律事件。'},
{id:'dl18',ch:'导论',type:'judge',q:'道义责任属于经济法律责任的一种形式。',a:false,e:'经济法律责任的形式包括民事责任、行政责任、刑事责任；道义责任不属于法律责任。'},
{id:'dl19',ch:'导论',type:'judge',q:'宪法由全国人民代表大会制定和修改，具有最高法律效力。',a:true,e:'宪法是根本法，效力最高，是经济法最重要的渊源。'},
{id:'dl20',ch:'导论',type:'judge',q:'我国经济法是国家为了克服市场调节的盲目性和局限性而制定的法律规范的总称。',a:true,e:'这是经济法概念的核心表述，强调国家适度干预、弥补市场缺陷。'},
{id:'dl21',ch:'导论',type:'multi',q:'经济法的调整对象包括（　）。',o:['市场主体调控关系','市场规制关系','宏观调控关系','平等主体之间的人身关系'],a:['A','B','C'],e:'D项属于民法调整对象。经济法调整市场主体调控关系、市场规制关系（反垄断、反不正当竞争、消费者保护）和宏观调控关系（财税、金融、计划）。'},
{id:'dl22',ch:'导论',type:'multi',q:'下列法律中，属于市场规制法的有（　）。',o:['《反不正当竞争法》','《消费者权益保护法》','《公司法》','《产品质量法》'],a:['A','B','D'],e:'《公司法》属于市场主体法；其余三项属于规范市场交易、维护市场秩序的市场规制法。'},
{id:'dl23',ch:'导论',type:'multi',q:'经济法的基本原则包含（　）。',o:['资源优化配置原则','国家适度干预原则','社会利益本位原则','维护公平竞争原则'],a:['A','B','C','D'],e:'经济法五大基本原则：资源优化配置、国家适度干预、社会利益本位、平衡协调、维护公平竞争。'},
{id:'dl24',ch:'导论',type:'multi',q:'经济法律关系的三要素包括（　）。',o:['主体','法律事实','客体','内容'],a:['A','C','D'],e:'三要素为主体、内容、客体；法律事实是引起经济法律关系产生、变更、终止的客观现象，不是构成要素。'},
{id:'dl25',ch:'导论',type:'multi',q:'经济法律责任的形式包括（　）。',o:['民事责任','行政责任','刑事责任','道义责任'],a:['A','B','C'],e:'经济法律责任包括民事、行政、刑事责任；道义责任仅是社会评价，不具国家强制性。'},

/* ================= 第二章 个人独资企业法 ================= */
{id:'dz01',k:1,ch:'个人独资',type:'single',q:'下列关于个人独资企业法律特征的表述中，符合规定的是（　）。',o:['个人独资企业没有独立承担民事责任的能力','个人独资企业不能以自己的名义从事民事活动','个人独资企业具有法人资格','投资人对企业债务承担有限责任'],a:'A',e:'个人独资企业不具有法人资格，无独立承担民事责任的能力，但它是独立的民事主体，可以自己的名义从事民事活动；投资人承担无限责任。'},
{id:'dz02',ch:'个人独资',type:'single',q:'个人独资企业的投资人应当是（　）。',o:['一个中国自然人','一个法人','一个自然人，国籍不限','两个以上自然人'],a:'A',e:'投资人只能是一个中国公民（自然人），不包括法人，也不包括港、澳、台同胞；且须为完全民事行为能力人。'},
{id:'dz03',ch:'个人独资',type:'single',q:'下列中国公民中，依法可以投资设立个人独资企业的是（　）。',o:['某市中级法院法官李某','某商业银行支行部门经理张某','某大学在校本科生袁某','某县政府办公室主任金某'],a:'C',e:'法律、行政法规禁止从事营利性活动的人不得作为投资人，如国家公务员、法官、检察官、人民警察、商业银行工作人员等。在校本科生不属于禁止主体。'},
{id:'dz04',k:1,ch:'个人独资',type:'single',q:'下列名称中，个人独资企业可以使用的是（　）。',o:['云滇针织品有限公司','昆海化妆品经销公司','霞光婚纱摄影工作室','某某实业股份有限公司'],a:'C',e:'个人独资企业的名称中不得使用“有限”“有限责任”或者“公司”字样，可以叫厂、店、部、中心、工作室等。'},
{id:'dz05',k:1,ch:'个人独资',type:'single',q:'个人独资企业的出资（　）。',o:['只能以个人财产出资','只能以家庭共有财产出资','可以个人财产出资，也可以家庭共有财产作为个人出资','必须达到法定最低注册资本'],a:'C',e:'投资人可以个人财产出资，也可以在申请设立登记时明确以家庭共有财产作为个人出资；法律未设最低注册资本。'},
{id:'dz06',ch:'个人独资',type:'single',q:'个人独资企业登记机关应当自收到设立申请文件之日起（　）内作出是否登记的决定。',o:['10日','15日','30日','60日'],a:'B',e:'登记机关应在收到申请文件之日起15日内，对符合条件的予以登记、发给营业执照；不符合的书面答复并说明理由。'},
{id:'dz07',ch:'个人独资',type:'single',q:'个人独资企业的成立日期是（　）。',o:['设立申请之日','登记机关受理之日','营业执照签发之日','首次开业之日'],a:'C',e:'营业执照的签发日期为个人独资企业成立日期。领取营业执照前，投资人不得以个人独资企业名义从事经营活动。'},
{id:'dz08',ch:'个人独资',type:'single',q:'个人独资企业设立分支机构的，分支机构的民事责任由（　）承担。',o:['分支机构自己','设立该分支机构的个人独资企业','投资人个人','登记机关'],a:'B',e:'分支机构不具有法人资格，其民事责任由设立该分支机构的个人独资企业承担。'},
{id:'dz09',ch:'个人独资',type:'single',q:'投资人委托或者聘用他人管理个人独资企业事务的，应当（　）。',o:['口头授权即可','签订书面合同，明确委托内容和授权范围','经登记机关批准','经债权人同意'],a:'B',e:'投资人应与受托人或被聘用的人签订书面合同，明确委托的具体内容和授予的权利范围。'},
{id:'dz10',ch:'个人独资',type:'single',q:'投资人对受托人职权的限制，（　）。',o:['可以对抗一切第三人','不得对抗善意第三人','不得对抗恶意第三人','经公告后可以对抗第三人'],a:'B',e:'投资人对受托人或者被聘用人员职权的限制，不得对抗善意第三人；对知情的恶意第三人则可以对抗。'},
{id:'dz11',ch:'个人独资',type:'single',q:'个人独资企业解散，清算人的确定方式是（　）。',o:['只能由投资人自行清算','只能由债权人清算','由投资人自行清算，或者由债权人申请人民法院指定清算人','由登记机关指定'],a:'C',e:'个人独资企业解散，由投资人自行清算或者由债权人申请人民法院指定清算人进行清算。'},
{id:'dz12',ch:'个人独资',type:'single',q:'投资人自行清算的，债权人申报债权的期限是（　）。',o:['接到通知之日起15日内，未接到通知的公告之日起30日内','接到通知之日起30日内，未接到通知的公告之日起60日内','接到通知之日起60日内，未接到通知的公告之日起90日内','一律为公告之日起45日内'],a:'B',e:'投资人自行清算的，应在清算前15日内书面通知债权人；债权人应在接到通知之日起30日内、未接到通知的自公告之日起60日内申报债权。'},
{id:'dz13',ch:'个人独资',type:'single',q:'个人独资企业解散后，原投资人对企业存续期间的债务仍应承担偿还责任，但债权人在（　）内未提出偿债请求的，该责任消灭。',o:['1年','2年','3年','5年'],a:'D',e:'个人独资企业解散后，原投资人对企业存续期间的债务仍应承担偿还责任；债权人在5年内未向债务人提出偿债请求的，该责任消灭。'},
{id:'dz14',ch:'个人独资',type:'single',q:'个人独资企业解散的，财产应当首先用于清偿（　）。',o:['所欠职工工资和社会保险费用','所欠税款','其他债务','投资人出资'],a:'A',e:'清偿顺序：所欠职工工资和社会保险费用→所欠税款→其他债务。'},
{id:'dz15',ch:'个人独资',type:'single',q:'个人独资企业财产不足以清偿债务的，应当（　）。',o:['依法注销，债务消灭','由投资人以其个人的其他财产予以清偿','由债权人自行承担','转为有限责任公司'],a:'B',e:'个人独资企业投资人承担无限责任，企业财产不足清偿债务的，投资人应以其个人的其他财产予以清偿。'},
{id:'dz16',ch:'个人独资',type:'judge',q:'个人独资企业具有法人资格，能够独立承担民事责任。',a:false,e:'个人独资企业是非法人企业，不具有法人资格，不能独立承担民事责任，由投资人承担无限责任。'},
{id:'dz17',ch:'个人独资',type:'judge',q:'个人独资企业不缴纳企业所得税，而由投资人依法缴纳个人所得税。',a:true,e:'个人独资企业不是企业所得税的纳税义务人，其生产经营所得由投资人缴纳个人所得税。'},
{id:'dz18',ch:'个人独资',type:'judge',q:'个人独资企业的投资人可以是外国公民。',a:false,e:'投资人只能是中国公民，不包括外国公民，也不包括港、澳、台同胞。'},
{id:'dz19',ch:'个人独资',type:'judge',q:'投资人在设立登记申请书上未注明以家庭共有财产出资的，企业财产不足清偿债务时，可直接执行其家庭共有财产。',a:false,e:'未明确以家庭共有财产作为个人出资的，应以个人财产承担无限责任，不能当然执行家庭共有财产。'},
{id:'dz20',k:1,ch:'个人独资',type:'judge',q:'投资人明确以家庭共有财产作为个人出资的，应当依法以家庭共有财产对企业债务承担无限责任。',a:true,e:'这是《个人独资企业法》第18条的明确规定。'},
{id:'dz21',ch:'个人独资',type:'judge',q:'投资人应承担民事赔偿责任和缴纳罚款、罚金，其财产不足以同时支付的，应当先缴纳罚款、罚金。',a:false,e:'应当先承担民事赔偿责任，再缴纳罚款、罚金；被判处没收财产的，同样先承担民事赔偿责任。'},
{id:'dz22',ch:'个人独资',type:'judge',q:'清算期间，个人独资企业可以开展与清算目的无关的经营活动。',a:false,e:'清算期间不得开展与清算目的无关的经营活动；清偿债务前，投资人不得转移、隐匿财产。'},
{id:'dz23',ch:'个人独资',type:'multi',q:'投资人委托或者聘用的管理人员不得实施的行为有（　）。',o:['利用职务便利索取或者收受贿赂','挪用企业资金归个人使用或者借贷给他人','擅自以企业财产提供担保','未经投资人同意从事与本企业相竞争的业务'],a:['A','B','C','D'],e:'此外还包括侵占企业财产、擅自以个人名义开立账户存储企业资金、未经同意与本企业交易、擅自转让企业知识产权、泄露商业秘密等。'},
{id:'dz24',ch:'个人独资',type:'multi',q:'下列情形中，个人独资企业应当解散的有（　）。',o:['投资人决定解散','投资人死亡，无继承人或者继承人决定放弃继承','被依法吊销营业执照','投资人被宣告死亡，其继承人决定继承'],a:['A','B','C'],e:'D项中继承人决定继承的，企业继续存续，不解散。法定解散情形还包括法律、行政法规规定的其他情形。'},
{id:'dz25',ch:'个人独资',type:'multi',q:'关于个人独资企业的设立，下列说法正确的有（　）。',o:['投资人可以家庭共有财产作为个人出资','企业名称中不得使用“公司”字样','必须有符合规定的最低注册资本','投资人为一个中国自然人'],a:['A','B','D'],e:'个人独资企业没有法定最低注册资本要求，只需有投资人申报的出资。'},
]);

window.BANK_PARTS = window.BANK_PARTS || [];
window.BANK_PARTS.push([
/* ================= 第三章 合伙企业法 ================= */
{id:'ph01',ch:'合伙',type:'single',q:'根据合伙企业法律制度的规定，下列有关合伙企业的说法中，正确的是（　）。',o:['特殊的普通合伙企业由普通合伙人与有限合伙人组成','合伙企业不具有法人资格，不能拥有自己的财产','合伙企业应就其生产经营所得缴纳企业所得税','合伙协议依法由全体合伙人协商一致，以书面形式订立'],a:'D',e:'A错：特殊的普通合伙企业全部合伙人均为普通合伙人；B错：合伙企业虽无法人资格，但依法拥有独立支配和管理的财产；C错：合伙企业“先分后税”，由合伙人分别缴纳所得税。'},
{id:'ph02',ch:'合伙',type:'single',q:'普通合伙企业的下列事项中，应当登记的是（　）。',o:['合伙协议','合伙人认缴出资的缴付期限','执行事务合伙人名称或者姓名','合伙期限'],a:'C',e:'法定登记事项包括名称、类型、经营范围、主要经营场所、出资额、合伙人姓名或名称及住所、承担责任方式、执行事务合伙人姓名或名称。'},
{id:'ph03',ch:'合伙',type:'single',q:'甲、乙、丙、丁拟设立普通合伙企业，合伙协议约定的下列条款中，不符合规定的是（　）。',o:['合伙人可以劳务出资','经全体合伙人一致同意，可以吸收上市公司作为普通合伙人','修改合伙协议应当经全体合伙人2/3以上同意','合伙人不得分期出资'],a:'B',e:'国有独资公司、国有企业、上市公司以及公益性的事业单位、社会团体不得成为普通合伙人，这是强制性规定，不能以协议约定或全体同意改变。'},
{id:'ph04',ch:'合伙',type:'single',q:'根据合伙企业法律制度的规定，下列有关合伙企业财产的说法中，正确的是（　）。',o:['合伙人以土地使用权出资需要评估作价的，不得由合伙人自行协商确定','合伙人在清算前私自转移合伙企业财产的，合伙企业不得以此对抗善意第三人','合伙企业的原始财产是全体合伙人实际缴纳的财产','合伙企业清算时，其财产首先用于缴纳所欠税款'],a:'B',e:'A错：非货币出资的作价可由全体合伙人协商，也可委托法定评估机构评估；C错：原始财产是全体合伙人“认缴”的财产；D错：清算时首先支付清算费用。'},
{id:'ph05',ch:'合伙',type:'single',q:'赵某是甲普通合伙企业的合伙人。某日，赵某私自将企业的机器设备转让给善意且支付合理对价的李某并交付。下列表述中，正确的是（　）。',o:['李某可以取得所有权，但需补偿企业损失','合伙企业不得以赵某无权处分为由请求李某返还设备','赵某有权要求李某返还设备','转让合同因损害企业利益而无效'],a:'B',e:'合伙人清算前私自转移或处分合伙企业财产的，合伙企业不得以此对抗善意第三人；李某符合善意取得要件，取得所有权。'},
{id:'ph06',ch:'合伙',type:'single',q:'甲、乙、丙系普通合伙人，合伙协议对对外转让财产份额的决议方法未约定。甲将其财产份额转让给丁。丁成为合伙人的时间点是（　）。',o:['甲与丁签订转让协议时','乙、丙一致同意丁受让时','合伙协议经修改增加丁为合伙人时','企业登记机关完成变更登记时'],a:'C',e:'合伙人以外的人依法受让财产份额的，经修改合伙协议即成为合伙人。'},
{id:'ph07',ch:'合伙',type:'single',q:'某普通合伙企业委托合伙人杨某一人执行合伙事务，下列说法正确的是（　）。',o:['只能由杨某对外代表该合伙企业','除协议另有约定外，杨某可自行决定以企业名义为他人提供担保','除协议另有约定外，杨某可自行处分企业不动产','除协议另有约定外，杨某可自行决定其他合伙人对外转让份额'],a:'A',e:'委托一人执行事务的，其他合伙人不再执行事务，只能由杨某对外代表企业；担保、处分不动产等重大事项须经全体合伙人一致同意。'},
{id:'ph08',ch:'合伙',type:'single',q:'甲为某律师事务所（普通合伙）的合伙人，为维持小规模纳税人身份拟再设立一家同业律师事务所。下列说法正确的是（　）。',o:['经其他合伙人一致同意可以设立','可以设立，除非合伙协议另有约定','如不执行合伙企业事务就可以设立','只要具有该合伙人身份，就不可以设立'],a:'D',e:'普通合伙人绝对不得自营或者同他人合作经营与本合伙企业相竞争的业务，属于法定禁止，不能通过协议约定或全体同意豁免。'},
{id:'ph09',ch:'合伙',type:'single',q:'星点律师事务所（普通合伙）的合伙协议有下列条款，其中符合规定的是（　）。',o:['允许合伙人同时入伙其他律师事务所','允许合伙人自行决定将财产份额出质','将合伙人除名，应当经全体合伙人过半数同意','修改合伙协议，应当经全体合伙人过半数同意'],a:'D',e:'修改或补充合伙协议原则上须全体一致同意，但协议另有约定的除外，故可约定过半数通过；除名须其他合伙人一致同意，份额出质须其他合伙人一致同意。'},
{id:'ph10',ch:'合伙',type:'single',q:'甲、乙、丙、丁设立普通合伙企业，协议约定企业财产不足清偿时甲最多清偿10万元、乙最多5万元，其余向丙、丁追偿。欠A公司100万元到期未清偿。下列说法正确的是（　）。',o:['甲仅负有向A公司偿还10万元的义务','乙仅负有向A公司偿还5万元的义务','A公司只能要求丙、丁承担连带责任','A公司可以要求甲、乙、丙、丁承担连带责任'],a:'D',e:'合伙人内部的分担比例和责任限制约定仅对内有效，不得对抗外部债权人；全体普通合伙人对企业债务承担无限连带责任。'},
{id:'ph11',k:1,ch:'合伙',type:'single',q:'周某欠乙银行到期贷款，乙银行申请强制执行周某在甲普通合伙企业中的财产份额。下列说法正确的是（　）。',o:['强制执行时不必征得其他合伙人同意','其他合伙人不同意转让又无力购买的，视为同意处理','银行有权自行接管周某的财产份额','份额全部被执行后，周某对企业的债务不再承担无限连带责任'],a:'A',e:'人民法院强制执行合伙人的财产份额是司法强制措施，不必征得其他合伙人同意，但应通知全体合伙人；其他合伙人不同意转让又不购买的，办理退伙或削减份额结算。'},
{id:'ph12',k:1,ch:'合伙',type:'single',q:'下列情形中，经其他合伙人一致同意可以决议将该合伙人除名的是（　）。',o:['合伙人未履行出资义务','合伙人死亡','合伙人个人丧失偿债能力','合伙人全部财产份额被人民法院强制执行'],a:'A',e:'B、C、D属于当然退伙事由；法定除名事由包括未履行出资义务、因故意或重大过失给企业造成损失、执行事务有不正当行为等。'},
{id:'ph13',k:1,ch:'合伙',type:'single',q:'张某、赵某和李某设立普通合伙企业，李某未履行到期出资义务。2月1日张某和赵某作出除名决议，3月1日李某收到除名通知。李某退伙的时间是（　）。',o:['2023年4月1日','2023年1月20日','2023年3月1日','2023年2月1日'],a:'C',e:'对合伙人的除名决议应当书面通知被除名人，被除名人收到除名通知之日除名生效，李某自3月1日退伙。'},
{id:'ph14',ch:'合伙',type:'single',q:'张某、赵某、李某设立普通合伙企业，张某病故，其15岁的儿子小张是唯一法定继承人。下列表述正确的是（　）。',o:['合伙企业必须解散清算','经赵某和李某同意，小张可以成为合伙人','小张有权要求合伙企业返还张某的财产份额','经赵某一人同意，企业可转为有限合伙企业，小张为有限合伙人'],a:'C',e:'小张为限制民事行为能力人，不能成为普通合伙人；转为有限合伙企业须全体合伙人一致同意；不能取得合伙人资格的，应退还其财产份额。'},
{id:'ph15',ch:'合伙',type:'single',q:'甲普通合伙企业经全体合伙人一致同意解散，但全部财产不足清偿债务。下列说法正确的是（　）。',o:['可以注销企业，全体普通合伙人对剩余债务继续承担无限连带责任','必须偿清剩余债务后才能注销','可以注销，剩余债务不再清偿','经债权人同意可以注销'],a:'A',e:'合伙企业注销后，原普通合伙人对企业存续期间未清偿的债务仍承担无限连带责任（债权人5年内未提出偿债请求的除外）。'},
{id:'ph16',ch:'合伙',type:'single',q:'张某等四人拟设立特殊的普通合伙企业，下列名称符合规定的是（　）。',o:['甲企业（合伙）','甲企业（普通合伙）','甲企业（有限合伙）','甲企业（特殊普通合伙）'],a:'D',e:'特殊的普通合伙企业名称中必须标明“特殊普通合伙”字样；普通合伙企业标明“普通合伙”。'},
{id:'ph17',ch:'合伙',type:'single',q:'赵某（普通合伙人）、周某（有限合伙人）拟设立有限合伙企业，下列可以作为周某出资的是（　）。',o:['周某管理企业的劳务','周某承租的小汽车','周某父亲所有的房屋','周某自己所有的专利权'],a:'D',e:'有限合伙人不得以劳务出资；出资财产须为合伙人依法拥有所有权或处分权的财产，承租物、他人房屋不可出资。'},
{id:'ph18',ch:'合伙',type:'single',q:'根据合伙企业法律制度的规定，下列各项中，属于有限合伙企业合伙协议可以约定的是（　）。',o:['有限合伙人对外代表有限合伙企业','有限合伙人享有全部企业利润','有限合伙人完全不承担企业债务','有限合伙人执行合伙事务'],a:'B',e:'有限合伙企业不得将全部利润分配给部分合伙人，但合伙协议另有约定的除外。有限合伙人不执行事务、不得对外代表企业；仍以其认缴出资额为限承担责任。'},
{id:'ph19',k:1,ch:'合伙',type:'single',q:'第三人有理由相信有限合伙人为普通合伙人并与其交易的，该有限合伙人对该笔交易（　）。',o:['不承担责任','以财产份额为限承担责任','承担补充责任','承担与普通合伙人相同的责任'],a:'D',e:'构成表见代理情形时，为保护善意相对人，该有限合伙人对该笔交易承担与普通合伙人相同的无限连带责任。'},
{id:'ph20',ch:'合伙',type:'single',q:'张某是甲有限合伙企业的有限合伙人，认缴出资100万元、实缴80万元。2025年5月退伙，取回财产70万元，退伙时企业负债120万元。张某对退伙前原因发生的企业债务承担责任的上限是（　）。',o:['70万元','80万元','120万元','100万元'],a:'A',e:'有限合伙人退伙后，对基于退伙前原因发生的企业债务，以其退伙时从企业中取回的财产为限承担责任。'},

{id:'ph21',ch:'合伙',type:'multi',q:'下列主体中，不得成为普通合伙人的有（　）。',o:['17周岁的高中生赵某','甲国有独资公司','乙上市公司','已被人民法院宣告破产的丙公司'],a:['A','B','C','D'],e:'普通合伙人须具有完全民事行为能力；国有独资公司、国有企业、上市公司以及公益性事业单位、社会团体不得成为普通合伙人；被宣告破产的公司丧失偿债能力，亦不得成为。'},
{id:'ph22',ch:'合伙',type:'multi',q:'赵某、钱某、孙某、李某拟设立普通合伙企业，下列说法正确的有（　）。',o:['赵某以专利权出资，应当办理专利权转移登记手续','全体合伙人可以协商确定钱某用于出资的房屋作价','该企业自合伙协议签订之日起成立','该企业名称中应当标明“普通合伙”字样'],a:['A','B','D'],e:'C错：合伙企业自营业执照签发之日起成立，而非协议签订之日。'},
{id:'ph23',ch:'合伙',type:'multi',q:'甲、乙出资设立普通合伙企业，下列属于合伙企业财产的有（　）。',o:['合伙企业合法接受的捐赠','甲认缴但尚未实际缴纳的50万元','乙用于出资的知识产权','合伙企业承租的生产线'],a:['A','B','C'],e:'合伙企业财产包括合伙人认缴和实缴的出资、以企业名义取得的收益、依法取得的其他财产。承租的生产线仅享有使用权，不属于企业财产。'},
{id:'ph24',ch:'合伙',type:'multi',q:'甲、乙、丙、丁共同出资设立普通合伙企业，合伙协议对份额转让没有约定。下列说法正确的有（　）。',o:['甲向乙转让份额须经丙、丁一致同意','甲向乙转让份额，丙、丁享有优先购买权','甲向戊转让份额须经乙、丙、丁一致同意','甲向戊转让份额，乙、丙、丁在同等条件下有优先购买权'],a:['C','D'],e:'合伙人之间内部转让只需通知其他合伙人，无需同意，其他合伙人无优先购买权；对外转让须经其他合伙人一致同意，且其他合伙人享有优先购买权。'},
{id:'ph25',ch:'合伙',type:'multi',q:'赵某、钱某、孙某、李某设立普通合伙企业，协议约定由赵某和钱某执行事务。下列说法正确的有（　）。',o:['赵某和钱某均可对外代表企业','赵某、钱某对执行合伙事务享有同等权利','赵某对钱某执行的事务提出异议，钱某可以不暂停','执行事务产生的费用和亏损由企业承担'],a:['A','B','D'],e:'C错：合伙人分别执行事务时，一方提出异议，另一方应当暂停该项事务的执行。'},
{id:'ph26',ch:'合伙',type:'multi',q:'甲、乙、丙设立普通合伙企业，协议约定由甲执行事务。下列事项中，需要全体合伙人一致同意的有（　）。',o:['甲拟向乙转让自己的财产份额','甲拟聘任合伙人丙担任经营管理人员','甲拟向丁出售合伙企业的一处厂房','甲拟改变合伙企业的经营范围'],a:['C','D'],e:'内部转让只需通知；聘任合伙人（内部人）不属于“聘任合伙人以外的人”；处分不动产、改变经营范围属于法定须全体一致同意的重大事项。'},
{id:'ph27',ch:'合伙',type:'multi',q:'周某、吴某、王某设立畅通汽修（普通合伙），三人共同执行事务，周某分管采购。吴某认为周某拟采购的零配件质量不过关；王某提议将自己的零配件卖给企业。协议对事务执行、自我交易均无特别约定。下列说法正确的有（　）。',o:['吴某有权行使异议权，周某应暂停推进签约事宜','吴某有权行使异议权，但周某在分管权限内可不接受','经周某同意，王某可以将零配件卖给企业','经周某、吴某同意，王某可以将零配件卖给企业'],a:['A','D'],e:'执行事务合伙人提出异议后，被异议人应暂停该项事务；普通合伙人不得与本企业自我交易，须经全体合伙人一致同意。'},
{id:'ph28',ch:'合伙',type:'multi',q:'朱某系普通合伙人，因买房向刘某借款50万元，到期不能清偿。刘某行使权利的下列说法中，正确的有（　）。',o:['可代位行使朱某在合伙企业中的权利','可就朱某在合伙企业中分得的收益主张清偿','可申请对朱某的合伙财产份额强制执行','就朱某的合伙财产份额享有优先受偿权'],a:['B','C'],e:'债权人不得代位行使合伙人在合伙企业中的权利；可要求以分得收益清偿或申请法院强制执行财产份额，但无优先受偿权。'},
{id:'ph29',ch:'合伙',type:'multi',q:'某普通合伙企业的合伙人发生下列情形，属于当然退伙事由的有（　）。',o:['普通合伙人甲公司被宣告破产','普通合伙人丁因斗殴被公安机关拘留','普通合伙人丙被依法宣告失踪','普通合伙人乙公司被吊销营业执照'],a:['A','D'],e:'法人被吊销营业执照、责令关闭、撤销或宣告破产，属于当然退伙；自然人须“死亡或者被宣告死亡”，被宣告失踪或行政拘留不导致当然退伙。'},
{id:'ph30',ch:'合伙',type:'multi',q:'下列各项中，属于合伙企业应当解散的情形有（　）。',o:['合伙人已不具备法定人数满30天','合伙期限届满，合伙人决定不再经营','合伙协议约定的解散事由出现','合伙企业被责令停业整顿'],a:['A','B','C'],e:'D错：被吊销营业执照、责令关闭或者被撤销才应解散；“停业整顿”属于行政处罚过程。'},
{id:'ph31',ch:'合伙',type:'multi',q:'合伙企业解散清算时，下列费用属于清算费用的有（　）。',o:['合伙企业财产的保管费','通告债权人的费用','调查债权的费用','处分合伙企业财产的费用'],a:['A','B','C','D'],e:'清算费用包括财产管理/保管费用、处分财产费用、公告通知费用以及调查、咨询、诉讼等费用。'},
{id:'ph32',ch:'合伙',type:'multi',q:'甲会计师事务所（特殊普通合伙）的合伙人李某实施下列行为造成甲所债务，应由李某承担无限责任、其他合伙人以财产份额为限承担责任的有（　）。',o:['因重大过失出具错误审计意见','因一般过失未发现客户财务造假','故意泄露被审计客户的商业秘密','因轻过失购买过量办公用品'],a:['A','C'],e:'特殊普通合伙中，合伙人因故意或者重大过失引起的执业债务，由该合伙人承担无限责任，其他合伙人以财产份额为限；一般/轻过失或非执业原因产生的债务由全体合伙人无限连带。'},
{id:'ph33',ch:'合伙',type:'multi',q:'甲、乙、丙、丁设立A会计师事务所（特殊普通合伙），甲为执行事务合伙人，经手租赁的办公用房欠付2年租金。下列说法正确的有（　）。',o:['A所应以其全部财产清偿','甲承担无限责任，乙、丙、丁以实缴出资额为限','甲承担无限责任，乙、丙、丁以认缴出资额为限','甲、乙、丙、丁均应承担无限连带责任'],a:['A','D'],e:'欠付办公用房租金属于日常经营管理债务，不属于因故意或重大过失产生的特殊执业债务，全体普通合伙人承担无限连带责任。'},
{id:'ph34',ch:'合伙',type:'multi',q:'甲公益性社会团体与王某共同出资设立合伙企业，经营亏损，财产不足清偿债务。下列说法正确的有（　）。',o:['甲公益性社会团体以其认缴出资额为限承担责任','王某以其认缴出资额为限承担责任','甲公益性社会团体承担无限责任','王某承担无限责任'],a:['A','D'],e:'公益性社会团体不得成为普通合伙人，只能作为有限合伙人承担有限责任；有限合伙企业至少需一名普通合伙人，故王某为普通合伙人，承担无限责任。'},
{id:'ph35',k:1,ch:'合伙',type:'multi',q:'甲、乙、丙设立合伙企业，甲为有限合伙人，未按期缴纳出资。下列说法符合规定的有（　）。',o:['甲应当补缴出资','甲应当对其他合伙人承担违约责任','甲当然退伙','乙、丙可以决议将甲除名'],a:['A','B','D'],e:'未按期足额缴纳出资的，应补缴并承担违约责任；未履行出资义务属于法定除名事由，经其他合伙人一致同意可以除名，但不直接导致当然退伙。'},
{id:'ph36',ch:'合伙',type:'multi',q:'下列有关有限合伙企业的说法中，不正确的有（　）。',o:['经全体合伙人同意，有限合伙人可以以劳务出资','有限合伙企业至少应当有2个以上普通合伙人','上市公司不得成为有限合伙企业的有限合伙人','合伙协议可以约定将全部利润分配给部分有限合伙人'],a:['A','B','C'],e:'A错：有限合伙人绝对不得以劳务出资；B错：至少1个普通合伙人即可；C错：上市公司只是不得成为普通合伙人，可以成为有限合伙人。D正确（协议可约定）。'},
{id:'ph37',ch:'合伙',type:'multi',q:'赵某是某私募基金（有限合伙）的有限合伙人，其下列行为不违反规定的有（　）。',o:['参与选择承办基金审计业务的会计师事务所','获取经审计的基金财务会计报告','代表基金对外签订合作协议','为了解事务执行情况查阅基金财务资料'],a:['A','B','D'],e:'A、B、D属于“不视为执行合伙事务”的安全港行为；C代表企业对外签约属于事务执行权，有限合伙人不得实施。'},
{id:'ph38',ch:'合伙',type:'multi',q:'根据合伙企业法律制度的规定，下列各项中，有限合伙人以其认缴的出资额为限承担责任的有（　）。',o:['有限合伙人入伙前发生的企业债务','有限合伙人作为合伙人期间发生的企业债务','退伙后基于退伙前原因发生的企业债务','退伙后新发生的企业债务'],a:['A','B'],e:'C项以退伙时取回的财产为限；D项退伙后新发生的债务，退伙人不承担责任。'},

{id:'ph39',ch:'合伙',type:'judge',q:'合伙企业的营业执照签发日期，为合伙企业的成立日期。',a:true,e:'合伙企业自营业执照签发之日起成立。'},
{id:'ph40',ch:'合伙',type:'judge',q:'合伙企业办理登记、备案事项时，只需对执行事务合伙人和经营管理人员进行实名验证。',a:false,e:'应当对全体合伙人进行实名验证，而非仅限执行事务合伙人或经营管理人员。'},
{id:'ph41',ch:'合伙',type:'judge',q:'合伙企业不得设立分支机构。',a:false,e:'合伙企业可以设立分支机构，向分支机构所在地登记机关申请登记并领取营业执照。'},
{id:'ph42',ch:'合伙',type:'judge',q:'普通合伙人以劳务出资，其作价应当由全体合伙人协商确定，不得委托评估机构评估。',a:false,e:'劳务出资的作价可以由全体合伙人协商确定，也可以由全体合伙人委托法定评估机构评估。'},
{id:'ph43',ch:'合伙',type:'judge',q:'普通合伙企业的合伙协议可以约定，经全体合伙人过半数同意即可修改或者补充合伙协议。',a:true,e:'修改或补充合伙协议原则上须全体一致同意，但合伙协议另有约定的除外。'},
{id:'ph44',ch:'合伙',type:'judge',q:'合伙人在合伙企业清算前，不得请求分割合伙企业的财产，但法律另有规定的除外。',a:true,e:'这体现了合伙财产的完整性，符合《合伙企业法》规定。'},
{id:'ph45',ch:'合伙',type:'judge',q:'在合伙人分别执行合伙事务的情况下，因执行事务行为产生的亏损和责任由该事务执行人承担。',a:false,e:'执行事务产生的收益归合伙企业，亏损和责任由合伙企业承担，最终由全体合伙人承担。'},
{id:'ph46',ch:'合伙',type:'judge',q:'在普通合伙企业中，财产份额越高的合伙人在事务执行中的权利越大。',a:false,e:'普通合伙人无论出资多少，平等地享有执行合伙事务的权利，实行一人一票。'},
{id:'ph47',ch:'合伙',type:'judge',q:'合伙人执行合伙事务以及对外代表合伙企业权利的限制，不得对抗第三人。',a:false,e:'该限制不得对抗“善意”第三人；对知情的恶意第三人可以对抗。'},
{id:'ph48',ch:'合伙',type:'judge',q:'赵某等四人各出资1/4设立普通合伙企业，赵某提议停业装修，协议对该事项未约定。经钱某和孙某同意，可以停业装修。',a:true,e:'停业装修不属于法定须一致同意的重大事项，协议未约定时实行一人一票、过半数通过。三人同意已过半数。'},
{id:'ph49',ch:'合伙',type:'judge',q:'合伙企业解散即意味着合伙企业终止。',a:false,e:'解散后进入清算程序，清算完毕并办理注销登记后，合伙企业才终止。'},
{id:'ph50',ch:'合伙',type:'judge',q:'有限合伙人转变为普通合伙人的，对其作为有限合伙人期间企业发生的债务，以其认缴的出资额为限承担责任。',a:false,e:'有限合伙人转变为普通合伙人的，对其作为有限合伙人期间企业发生的债务承担无限连带责任。'},
{id:'ph51',ch:'合伙',type:'judge',q:'合伙协议未作特别约定的，有限合伙人可以经营与本企业相竞争的业务。',a:true,e:'有限合伙人默认可以竞业，除非合伙协议另有约定；普通合伙人则是法定绝对禁止竞业。'},
{id:'ph52',ch:'合伙',type:'judge',q:'特殊的普通合伙企业应当建立执业风险基金、办理职业保险。',a:true,e:'这是特殊的普通合伙企业的法定强制风险防范机制，执业风险基金应单独立户管理。'},
{id:'ph53',ch:'合伙',type:'judge',q:'合伙企业经依法清算并办理注销登记后，合伙人对合伙企业债务不再承担任何责任。',a:false,e:'原普通合伙人对合伙企业存续期间的债务，在注销后仍应承担无限连带责任（债权人5年内未提出请求的除外）。'},

{id:'gs01',ch:'公司',type:'single',q:'下列关于分公司的表述中，正确的是（　）。',o:['分公司的民事责任由总公司承担','分公司有独立的财产','分公司具有独立法人资格','分公司有独立的公司章程'],a:'A',e:'分公司不具有法人资格，没有独立财产和独立章程，其民事责任由总公司承担；但分公司仍需依法登记并领取营业执照。'},
{id:'gs02',ch:'公司',type:'single',q:'王某是甲公司的控股股东，因向银行借款请求甲公司为其提供担保。下列说法正确的是（　）。',o:['法律禁止公司为股东提供担保','能否担保取决于公司章程','应经股东会决议，由除王某外股东所持表决权的2/3以上通过','应经股东会决议，王某不得参加表决，由出席会议的其他股东所持表决权的过半数通过'],a:'D',e:'公司为股东或者实际控制人提供担保的，必须经股东会决议；接受担保的股东不得参加表决，该项表决由出席会议的其他股东所持表决权的过半数通过。'},
{id:'gs03',ch:'公司',type:'single',q:'赵某等四人拟设立有限责任公司，下列出资形式中不符合规定的是（　）。',o:['以商标权出资','以小汽车出资','以取得的特许经营权出资','以非专利技术出资'],a:'C',e:'股东可以用货币以及实物、知识产权、土地使用权、股权、债权等可以货币估价并可依法转让的非货币财产出资；劳务、信用、自然人姓名、商誉、特许经营权等不得作价出资。'},
{id:'gs04',k:1,ch:'公司',type:'single',q:'股东出资加速到期制度的适用条件是（　）。',o:['公司资不抵债','公司长期亏损','公司不能清偿到期债务','公司明显缺乏清偿能力'],a:'C',e:'新《公司法》规定，公司不能清偿到期债务的，公司或者已到期债务的债权人有权要求已认缴出资但未届出资期限的股东提前缴纳出资。'},
{id:'gs05',ch:'公司',type:'single',q:'陈某是甲公司股东，未按期足额缴纳出资，公司拟令其丧失未缴纳出资的股权。下列符合规定的是（　）。',o:['甲公司董事会负责核查陈某出资情况','催缴书载明宽限期为自发出之日起30日','实际控制人口头通知陈某丧失股权','陈某应自接到失权通知之日起15日内起诉'],a:'A',e:'董事会负责核查股东出资；宽限期应不少于60日；失权通知应以书面形式发出；异议之诉应自接到通知之日起30日内提起。'},
{id:'gs06',ch:'公司',type:'single',q:'林某认缴出资20万元，出资期限为2023年12月31日。2024年7月林某未缴纳出资即转让全部股权给知情的徐某。该出资义务的承担方式是（　）。',o:['林某承担，徐某无须承担','徐某承担，林某无须承担','林某承担，徐某承担补充责任','林某和徐某承担连带责任'],a:'D',e:'转让已到期未缴纳出资的股权，受让人知道或者应当知道的，由受让人与该股东在未缴纳出资的范围内承担连带责任。'},
{id:'gs07',k:1,ch:'公司',type:'single',q:'吴某认缴出资20万元，出资期限为2025年12月31日。2024年7月吴某未缴纳出资即转让全部股权给魏某。该出资义务的承担方式是（　）。',o:['吴某承担，魏某无须承担','魏某承担，吴某无须承担','魏某承担，吴某承担补充责任','吴某承担，魏某承担补充责任'],a:'C',e:'转让未届出资期限的股权，由受让人承担缴纳出资义务；受让人未按期足额缴纳的，转让人对受让人未按期缴纳的出资承担补充责任。'},
{id:'gs08',ch:'公司',type:'single',q:'下列主体中，有权提议召开有限责任公司临时股东会的是（　）。',o:['代表1/10以上表决权的股东','董事长','监事会主席','1/3以上的监事'],a:'A',e:'有权提议的主体包括代表1/10以上表决权的股东、1/3以上的董事、监事会（或不设监事会的监事）。'},
{id:'gs09',ch:'公司',type:'single',q:'下列各项中，属于有限责任公司董事会法定职权的是（　）。',o:['对公司增加或减少注册资本作出决议','决定公司内部管理机构的设置','对发行公司债券作出决议','审议批准利润分配方案和弥补亏损方案'],a:'B',e:'A、C、D属于股东会职权；决定公司内部管理机构的设置属于董事会法定职权。'},
{id:'gs10',ch:'公司',type:'single',q:'根据公司法律制度的规定，有关股份有限公司监事会，下列表述正确的是（　）。',o:['监事任期届满，连选可以连任','监事人数不得少于5人','职工代表不得少于1/2','董事可以兼任监事'],a:'A',e:'监事任期每届3年，任期届满连选可以连任；监事会成员不得少于3人；职工代表比例不得低于1/3；董事、高级管理人员不得兼任监事。'},
{id:'gs11',ch:'公司',type:'single',q:'李某是某非上市股份有限公司股东，已连续90日持有5%股份，章程未就知情权另有规定。下列李某可以行使知情权的是（　）。',o:['基于正当目的复制会计账簿','基于正当目的查阅会计凭证','复制股东名册','查阅董事会会议记录'],a:'C',e:'股份有限公司股东有权查阅、复制公司章程、股东名册、股东会会议记录、董事会会议决议、监事会会议决议、财务会计报告；会计账簿、会计凭证须连续180日以上持股1%以上方可查阅且不得复制。'},
{id:'gs12',ch:'公司',type:'single',q:'甲有限责任公司股东王某持股92%，何某持股8%。召开股东会前何某未被通知，会议只有王某参加并作出增加注册资本的决议。该决议的效力是（　）。',o:['有效','无效','可撤销','不成立'],a:'D',e:'未召开股东会会议作出决议，或会议未对决议事项进行表决的，属于决议不成立情形。未依法通知股东、未形成合法会议形态，决议不成立。'},
{id:'gs13',k:1,ch:'公司',type:'single',q:'赵某拟向股东以外的人转让其持有的有限责任公司股权。根据公司法律制度的规定，赵某应当（　）。',o:['征得其他股东一致同意','至少征得其他股东中二人同意','口头通知其他股东','书面通知其他股东'],a:'D',e:'新《公司法》取消对外转让须“过半数股东同意”的规则：股东应向其他股东书面通知转让的数量、价格、支付方式和期限等，其他股东在同等条件下有优先购买权。'},
{id:'gs14',k:1,ch:'公司',type:'single',q:'蓝天有限责任公司股东甲的股权被人民法院强制执行。乙、丙分别自接到通知之日起第15日和第30日主张优先购买权。下列表述正确的是（　）。',o:['乙、丙都可行使','乙可行使，丙视为放弃','乙、丙都视为放弃','乙、丙都无权主张'],a:'B',e:'其他股东自接到通知之日起满20日不行使优先购买权的，视为放弃。乙第15日提出（未满20日）可行使；丙第30日提出，视为放弃。'},
{id:'gs15',ch:'公司',type:'single',q:'钱某向A有限责任公司书面申请查阅、复制会计账簿及会计凭证，用于股权估值。下列正确的是（　）。',o:['钱某有权请求公司以合理价格回购其股权','钱某有权起诉请求法院裁定公司分配利润','公司可以“不正当目的”为由拒绝','钱某有权查阅，但无权复制会计账簿及会计凭证'],a:'D',e:'有限责任公司股东有权查阅（但无权复制）会计账簿、会计凭证；为评估股权价值不属于不正当目的；连续5年不分配才可能触发回购请求权。'},
{id:'gs16',ch:'公司',type:'single',q:'下列有关股份有限公司召开股东会会议的说法中，正确的是（　）。',o:['召开临时股东会应于会议召开10日前通知各股东','公司未弥补的亏损达股本总额1/3时应召开临时股东会','修改公司章程应经全体股东所持表决权过半数通过','股东会应当由董事长召集'],a:'B',e:'A错：临时股东会应提前15日通知；C错：修改章程属特别决议，须经出席会议股东所持表决权2/3以上通过；D错：股东会由董事会召集，董事长主持。'},
{id:'gs17',ch:'公司',type:'single',q:'某上市公司董事会成员9名、监事会成员5名。下列有关董事会召开的情形中，符合法律规定的是（　）。',o:['经2名董事提议可召开董事会临时会议','董事长、副董事长不能履职时，可由4名董事共同推举1名董事履职','经3名监事提议可召开董事会临时会议','董事会每年召开2次会议，并在会议召开10日前通知全体董事和监事'],a:'D',e:'A错：1/3以上董事（至少3人）方可提议；B错：应由过半数（至少5名）董事共同推举；C错：提议主体是监事会而非个别监事。'},
{id:'gs18',ch:'公司',type:'single',q:'持有公司全部股东表决权10%以上的股东，以下列事由提起解散公司诉讼，人民法院应予受理的是（　）。',o:['公司剥夺股东的表决权','公司被吊销营业执照未清算','公司发生亏损','公司持续2年以上无法召开股东会，经营管理发生严重困难'],a:'D',e:'只有公司经营管理发生严重困难、继续存续会使股东利益受到重大损失且其他途径无法解决时，10%以上股东才可提起解散公司诉讼。'},
{id:'gs19',ch:'公司',type:'single',q:'下列有关上市公司董事会秘书的表述中，正确的是（　）。',o:['董事会秘书可以代表董事长','董事会秘书可以代表董事会','董事会秘书是董事会设置的服务席位','董事会秘书不属于公司高级管理人员'],a:'C',e:'董事会秘书负责股东会和董事会会议筹备、文件保管、股东资料管理及信息披露等，是董事会设置的服务席位，属于高级管理人员，但无权对外代表董事长或董事会。'},
{id:'gs20',ch:'公司',type:'single',q:'甲国有独资公司董事会作出的下列决议中，符合法律规定的是（　）。',o:['聘任赵某为公司经理','增选钱某为公司董事','批准董事孙某兼任乙公司经理','决定分配利润5000万元'],a:'A',e:'国有独资公司经理由董事会聘任或解聘；董事会成员由履行出资人职责的机构委派或职工代表大会选举；董事兼职须经履行出资人职责的机构同意；利润分配由履行出资人职责的机构决定。'},
{id:'gs21',ch:'公司',type:'single',q:'根据公司法律制度的规定，下列有关公司财务会计事项的说法中，符合规定的是（　）。',o:['依照公司章程的规定，由监事会决定聘用承办审计业务的会计师事务所','将公司部分货币资产以个人名义开立账户存储','财务会计报告只提供给持有表决权30%以上的股东查阅','在法定会计账簿外另立会计账簿'],a:'A',e:'公司聘用、解聘承办审计业务的会计师事务所，依照章程规定由股东会、董事会或者监事会决定；不得以个人名义存储公司资金，不得另立会计账簿，财务会计报告应依法供全体股东查阅。'},
{id:'gs22',ch:'公司',type:'single',q:'甲公司拟与其持股95%的乙公司合并，需支付价款1.23亿元，占甲公司净资产的3.8%，两公司章程未另有规定。关于本次合并的决议，正确的是（　）。',o:['甲公司和乙公司都应经股东会决议','甲公司和乙公司都可以不经股东会决议','甲公司应经股东会决议，乙公司可不经','甲公司可不经股东会决议，乙公司应经'],a:'B',e:'持有90%以上股份的简易合并中，被吸收合并方可由董事会决议；支付价款不超过本公司净资产10%的小额合并中，吸收合并方可由董事会决议。故两家公司均可不经股东会决议。'},
{id:'gs23',k:1,ch:'公司',type:'single',q:'某股份有限公司亏损120万元，盈余公积100万元，资本公积10万元，实收股本200万元。拟通过减少注册资本弥补亏损，本次减资的最大额度为（　）。',o:['10万元','20万元','100万元','120万元'],a:'A',e:'减资弥补亏损前，应先以任意公积金、法定公积金（100万元）和资本公积金（10万元）弥补；剩余未弥补亏损120－100－10＝10万元，方可通过减资弥补。'},

{id:'gs24',ch:'公司',type:'multi',q:'下列关于分公司的表述中，正确的有（　）。',o:['分公司不具有独立法人资格','分公司的民事责任由总公司承担','分公司无独立的公司章程','分公司无需办理登记领照手续'],a:['A','B','C'],e:'分公司无法人资格、无独立财产和章程，民事责任由总公司承担；但仍需依法办理登记、领取营业执照，故D错。'},
{id:'gs25',ch:'公司',type:'multi',q:'某股份有限公司拟设立组织机构，下列方案符合法律规定的有（　）。',o:['不设董事会，设1名董事；不设监事会，设1名监事','不设董事会，设1名董事；不设监事会，经全体股东一致同意不设监事','设21人董事会，设15人监事会','设董事会并设置审计委员会，不设监事会也不设监事'],a:['A','B','D'],e:'C错：股份有限公司董事会成员为3人以上19人以下，21人超过法定上限。规模较小或股东人数较少的公司可设1名董事、1名监事，或经全体股东一致同意不设监事。'},
{id:'gs26',ch:'公司',type:'multi',q:'下列事项中，属于有限责任公司股东会特别决议事项（须经代表2/3以上表决权的股东通过）的有（　）。',o:['修改公司章程','决定公司的经营方针和投资计划','增加或者减少注册资本','公司合并、分立、解散或者变更公司形式'],a:['A','C','D'],e:'特别决议事项为“修改章程、增减注册资本、合并、分立、解散、变更公司形式”；经营方针和投资计划不属于股东会法定职权。'},
{id:'gs27',ch:'公司',type:'multi',q:'甲公司董事会作出的下列人员聘任决定中，符合规定的有（　）。',o:['决定续聘王某担任公司总经理','决定聘任现任监事李某担任公司副总经理','决定聘任刘某为产品研发部经理','决定聘任赵某为财务负责人'],a:['A','D'],e:'董事会决定聘任或解聘经理、副经理、财务负责人等高级管理人员；董事、高级管理人员不得兼任监事；部门经理由经理聘任，不由董事会决定。'},
{id:'gs28',ch:'公司',type:'multi',q:'下列人员中，不具备公司董事、监事、高级管理人员任职资格的有（　）。',o:['赵某，曾为图书馆馆长，现已退休','钱某，曾为乙企业董事长，因决策失误导致企业破产清算，完结至今2年','孙某，个人负债5000万元到期未清偿，被列为失信被执行人','李某，曾因贪污罪被判刑，执行期满释放至今4年'],a:['B','C','D'],e:'对破产清算负有个人责任、完结未逾3年的不得任职；个人所负数额较大债务到期未清偿且被列为失信被执行人的不得任职；因贪污罪被判刑、执行期满未逾5年的不得任职。'},
{id:'gs29',ch:'公司',type:'multi',q:'赵某是甲公司董事长，章程无特殊规定。赵某的下列行为中，违反董事义务的有（　）。',o:['自行决定将其所有的房产出售给甲公司','将甲公司重要商业机密出售给乙公司','私自向甲公司客户收受交易佣金并归为己有','自行决定设立个人独资企业经营与甲公司相同的业务'],a:['A','B','C','D'],e:'A为未经同意的自我交易；B为泄露公司秘密；C为收受贿赂、侵占公司利益；D为谋取公司商业机会及同业竞争，均违反忠实义务。'},
{id:'gs30',k:1,ch:'公司',type:'multi',q:'有限责任公司董事、高级管理人员执行职务违法给公司造成损失，股东可为公司利益以自己名义起诉。下列属于该情形的有（　）。',o:['书面请求董事会起诉遭拒绝','书面请求董事会起诉，董事会30日内未起诉','书面请求监事会起诉遭拒绝','书面请求监事会起诉，监事会30日内未起诉'],a:['C','D'],e:'告董事、高级管理人员的，应向监事会（或不设监事会的监事）提出书面请求；只有监事会拒绝或30日内未起诉（或情况紧急），股东才能提起股东代表诉讼。'},
{id:'gs31',ch:'公司',type:'multi',q:'甲股份有限公司发生下列情形，应当在2个月内召开临时股东会的有（　）。',o:['董事人数不足3人','未弥补的亏损达到股本总额的10%','监事会提议召开','持股15%的股东提议召开'],a:['A','C','D'],e:'法定情形包括董事人数不足法定人数或章程所定人数的2/3、未弥补亏损达股本总额1/3、单独或合计持股10%以上股东请求、监事会提议。10%未达1/3，故B不选。'},
{id:'gs32',ch:'公司',type:'multi',q:'甲股份有限公司职工400人，章程规定不设监事会也不设监事。有关董事会组成，符合规定的有（　）。',o:['董事会成员总数可以为20人','董事长应当以全体董事过半数选举产生','董事会应当有职工代表','董事会设置有审计委员会'],a:['B','C','D'],e:'A错：董事会成员为3至19人；职工人数300人以上且不设监事会的，董事会中应有职工代表；不设监事会应在董事会中设审计委员会行使监事会职权。'},
{id:'gs33',ch:'公司',type:'multi',q:'根据公司法律制度的规定，属于国家出资公司的有（　）。',o:['国有独资的股份有限公司','国有资本控股的有限责任公司','国有资本控股的股份有限公司','国有资本参股的有限责任公司'],a:['A','B','C','D'],e:'国家出资公司包括国家出资的国有独资公司、国有资本控股公司（含有限公司和股份公司）以及国有资本参股公司。'},
{id:'gs34',ch:'公司',type:'multi',q:'甲公司为国有独资公司，董事会中设审计委员会行使监事会职权。下列说法正确的有（　）。',o:['甲公司不设股东会','董事会成员中应当有过半数为外部董事','董事会成员中应当有公司职工代表','甲公司既不设监事会，也不设监事'],a:['A','B','C','D'],e:'国有独资公司不设股东会，由履行出资人职责的机构行使股东会职权；董事会中外部董事应过半数，并应有职工代表；设审计委员会的，不设监事会也不设监事。'},
{id:'gs35',ch:'公司',type:'multi',q:'根据公司法律制度的规定，下列有关减少注册资本弥补亏损的说法中，正确的有（　）。',o:['有限责任公司、股份有限公司均可适用','公司发生亏损，应当优先通过减少注册资本弥补','减资弥补亏损的，不得向股东分配','减资弥补亏损的，不得免除股东缴纳出资的义务'],a:['A','C','D'],e:'B错：应优先以公积金弥补亏损；减资弥补亏损不得向股东分配，也不得免除股东出资义务。'},
{id:'gs36',ch:'公司',type:'multi',q:'因营业期限届满，甲公司进入清算程序。下列有关清算的说法中，不符合法律规定的有（　）。',o:['全体董事、监事、高级管理人员为清算义务人','清算组应当由全体股东组成','清算组成员负有忠实义务和勤勉义务','清算期间公司存续，但不得开展与清算无关的经营活动'],a:['A','B'],e:'A错：清算义务人为董事（不含监事、高管）；B错：清算组由董事组成，章程另有规定或股东会决议另选他人的除外，并非全体股东。'},
{id:'gs37',ch:'公司',type:'multi',q:'赵某任董事、钱某任监事、孙某任总经理，李某为最大股东但未任职。赵某和孙某商量将公司注销。下列说法正确的有（　）。',o:['公司应当召开股东会作出解散决议','赵某和孙某协商一致即可注销公司','赵某是公司的清算义务人','赵某、钱某、孙某、李某都是清算义务人'],a:['A','C'],e:'解散、注销属于股东会职权（特别决议），董事与总经理私下协商无效；新《公司法》确立董事为清算义务人。'},
{id:'gs38',ch:'公司',type:'multi',q:'根据公司法律制度的规定，属于公司适用简易注销程序条件的有（　）。',o:['存续期间未产生债务或者已清偿全部债务','公司债务情况已取得半数股东承诺','通过国家企业信用信息公示系统公告期限不少于20日','公告期限届满后未有异议'],a:['A','C','D'],e:'B错：须全体股东承诺，而非半数股东。'},

{id:'gs39',ch:'公司',type:'judge',q:'公司登记机关应当将公司登记事项通过国家企业信用信息公示系统向社会公示。',a:true,e:'符合《公司法》关于登记事项公示的要求。'},
{id:'gs40',ch:'公司',type:'judge',q:'甲公司由总经理代表公司执行事务，章程同时规定由董事长担任法定代表人，该规定合法。',a:true,e:'法定代表人按照章程规定，由代表公司执行公司事务的董事或者经理担任，董事长属于董事，可以担任。'},
{id:'gs41',ch:'公司',type:'judge',q:'有限责任公司股权转让的，受让人自股权转让协议生效时起可以向公司主张行使股东权利。',a:false,e:'受让人自记载于股东名册时起可以向公司主张行使股东权利，而非协议生效时。'},
{id:'gs42',ch:'公司',type:'judge',q:'赵某以违法犯罪所得出资并取得股权，应直接从公司账户扣收其出资款以补偿受害人。',a:false,e:'为维护公司法人财产独立与交易安全，不得直接扣减公司账户资产，应采取拍卖或变卖该股权的方式追缴犯罪所得。'},
{id:'gs43',ch:'公司',type:'judge',q:'新《公司法》施行前设立、出资期限超过5年的公司，应在2027年6月30日前将剩余认缴出资期限调整至5年内。',a:true,e:'这是新《公司法》过渡期政策的要求。'},
{id:'gs44',ch:'公司',type:'judge',q:'有限责任公司章程规定股东会会议全体股东一人一票行使表决权，该规定符合法律规定。',a:true,e:'有限责任公司股东按出资比例行使表决权，但公司章程另有规定的除外。'},
{id:'gs45',ch:'公司',type:'judge',q:'只有一个股东的公司，股东不能证明公司财产独立于股东自己财产的，应当对公司债务承担连带责任。',a:true,e:'一人公司适用法人人格否认的举证责任倒置规则。'},
{id:'gs46',ch:'公司',type:'judge',q:'有限责任公司的控股股东滥用股东权利，严重损害公司或其他股东利益的，其他股东有权请求公司以合理价格收购其股权。',a:true,e:'这是新《公司法》新增的控股股东压迫情形下的股权回购请求权。'},
{id:'gs47',ch:'公司',type:'judge',q:'公司股东滥用公司法人独立地位和股东有限责任逃避债务，严重损害债权人利益的，应当对公司债务承担连带责任。',a:true,e:'这是法人人格否认（刺破公司面纱）的基本情形。'},
{id:'gs48',ch:'公司',type:'judge',q:'有限责任公司股东查阅公司账簿的权利属于股东的自益权。',a:false,e:'查阅权属于知情权，性质上为共益权，旨在参与公司管理与监督，而非仅为个人获取经济利益。'},
{id:'gs49',ch:'公司',type:'judge',q:'股份有限公司股东会选举董事、监事，应当实行累积投票制。',a:false,e:'可以按照公司章程规定或者股东会决议实行累积投票制，并非“应当”。'},
{id:'gs50',ch:'公司',type:'judge',q:'公司减少注册资本的，必须编制资产负债表及财产清单。',a:true,e:'无论普通减资还是减资弥补亏损，均须编制资产负债表及财产清单。'},
{id:'gs51',ch:'公司',type:'judge',q:'公司通过简易程序注销登记，股东承诺不实的，应当对注销登记前的债务承担补充清偿责任。',a:false,e:'应当承担连带责任，而非补充责任。'},

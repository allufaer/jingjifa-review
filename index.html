<script>(function(){
'use strict';
const CH=[
 {key:'导论',name:'经济法导论',num:'壹',color:'#8a6a3b'},
 {key:'个人独资',name:'个人独资企业法',num:'贰',color:'#2f6b57'},
 {key:'合伙',name:'合伙企业法',num:'叁',color:'#1f4e79'},
 {key:'公司',name:'公司法',num:'肆',color:'#7a3b52'},
 {key:'合同',name:'合同法律制度',num:'伍',color:'#a35a2a'}
];
const BANK=(window.BANK_PARTS||[]).reduce(function(a,b){return a.concat(b)},[]);
const byId={}; BANK.forEach(function(q){byId[q.id]=q});
const TYPES={single:'单选',multi:'多选',judge:'判断',case:'案例'};
/* ---------- persistence (multi-user) ---------- */
const PMETA='jf_review_profiles_v1';
const LEGKEY='jf_review_v2';
function ukey(n){return 'jf_review_u_'+n+'_v2'}
function sessKey(n){return 'jf_review_sess_'+n}
function readMeta(){try{return JSON.parse(localStorage.getItem(PMETA))||null}catch(e){return null}}
function writeMeta(m){try{localStorage.setItem(PMETA,JSON.stringify(m))}catch(e){}}
let USER='同学1';
let DB={rec:{},streak:{last:'',days:0}};
(function initProfiles(){
  let meta=readMeta();
  if(!meta){
    const first='同学1';
    let legacy={rec:{},streak:{last:'',days:0}};
    try{const raw=localStorage.getItem(LEGKEY);if(raw){const o=JSON.parse(raw);legacy.rec=o.rec||{};legacy.streak=o.streak||legacy.streak;}}catch(e){}
    try{localStorage.setItem(ukey(first),JSON.stringify(legacy))}catch(e){}
    meta={current:first,names:[first]};writeMeta(meta);
    try{localStorage.removeItem(LEGKEY)}catch(e){}
  }
  USER=meta.current||(meta.names&&meta.names[0])||'同学1';
  if(meta.names.indexOf(USER)<0)USER=meta.names[0];
})();
function loadUser(){DB={rec:{},streak:{last:'',days:0}};try{const raw=localStorage.getItem(ukey(USER));if(raw){const o=JSON.parse(raw);DB.rec=o.rec||{};DB.streak=o.streak||DB.streak;}}catch(e){}}
loadUser();
function save(){try{localStorage.setItem(ukey(USER),JSON.stringify(DB))}catch(e){}}
function saveSession(){try{if(!S.session){localStorage.removeItem(sessKey(USER));return}localStorage.setItem(sessKey(USER),JSON.stringify({session:S.session,savedAt:Date.now()}))}catch(e){}}
function clearSession(){try{localStorage.removeItem(sessKey(USER))}catch(e){}}
const S={view:'home',session:null,result:null,timer:null,examCfg:{n:30,min:30},kfilter:'all',kopen:{},resumedBanner:false};

function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}
function rec(id){return DB.rec[id]||(DB.rec[id]={attempts:0,right:0,wrong:0,streak:0,book:0,lastWrong:0})}
function answerKeys(q){if(q.type==='judge')return [q.a?'A':'B']; if(q.type==='multi')return q.a.slice(); return [q.a]}
function optionsOf(q){if(q.type==='judge')return [{k:'A',t:'正确'},{k:'B',t:'错误'}]; return q.o.map(function(t,i){return {k:String.fromCharCode(65+i),t:t}})}
function isCorrect(q,picked){
  const keys=answerKeys(q);
  if(q.type==='multi'){return picked.length===keys.length&&keys.every(function(k){return picked.indexOf(k)>-1})}
  return picked.length===1&&keys.indexOf(picked[0])>-1;
}
function answerText(q){
  const opts=optionsOf(q), keys=answerKeys(q);
  if(q.type==='judge')return q.a?'正确':'错误';
  return keys.map(function(k){const o=opts.filter(function(x){return x.k===k})[0];return k+(o?'．'+o.t:'')}).join('；');
}
function touchStreak(){
  const today=new Date().toDateString();
  if(DB.streak.last===today)return;
  const y=new Date(Date.now()-86400000).toDateString();
  DB.streak.days=DB.streak.last===y?((DB.streak.days||0)+1):1;
  DB.streak.last=today; save();
}
function record(q,ok){
  touchStreak();
  const r=rec(q.id);
  r.attempts=(r.attempts||0)+1;
  if(ok){r.right=(r.right||0)+1;r.streak=(r.streak||0)+1;}
  else{r.wrong=(r.wrong||0)+1;r.streak=0;r.lastWrong=Date.now();}
  r.last=Date.now(); save();
}
function stats(){
  let attempts=0,right=0,seen=0,mastered=0,wrongQ=0;
  Object.keys(DB.rec).forEach(function(id){
    if(!byId[id])return; const r=DB.rec[id];
    attempts+=r.attempts||0; right+=r.right||0;
    if((r.attempts||0)>0)seen++;
    if((r.streak||0)>=2)mastered++;
    if((r.wrong||0)>0&&(r.streak||0)<2)wrongQ++;
  });
  return {attempts:attempts,right:right,seen:seen,mastered:mastered,wrongQ:wrongQ,acc:attempts?Math.round(right/attempts*100):0,total:BANK.length};
}
function chapStats(ch){
  const qs=BANK.filter(function(q){return q.ch===ch});
  let seen=0,att=0,right=0,mastered=0;
  qs.forEach(function(q){
    const r=DB.rec[q.id]; if(!r)return;
    if((r.attempts||0)>0)seen++;
    att+=r.attempts||0; right+=r.right||0;
    if((r.streak||0)>=2)mastered++;
  });
  return {total:qs.length,seen:seen,acc:att?Math.round(right/att*100):0,mastered:mastered};
}
function wrongIds(){
  return Object.keys(DB.rec).filter(function(id){
    const r=DB.rec[id]; return byId[id]&&r.wrong>0&&(r.streak||0)<2;
  }).sort(function(a,b){return (DB.rec[b].wrong||0)-(DB.rec[a].wrong||0)});
}

/* ---------- user profiles ---------- */
function renderUserBox(){
  const el=$('userbox');if(!el)return;
  const meta=readMeta()||{current:USER,names:[USER]};
  let h='<button class="ubtn" data-act="user-toggle" title="切换学习用户"><span class="uava">'+esc(USER.slice(0,1))+'</span><span class="uname">'+esc(USER)+'</span><span class="ucaret">▾</span></button>';
  h+='<div class="upop" id="upop" style="display:none">';
  h+='<div class="utitle">切换 / 新建用户</div><div class="ulist">';
  meta.names.forEach(function(n){
    h+='<button class="urow'+(n===USER?' on':'')+'" data-act="user-switch" data-name="'+esc(n)+'">'+(n===USER?'● ':'○ ')+esc(n)+'</button>';
  });
  h+='</div>';
  h+='<div class="uadd"><input id="newUserName" placeholder="新用户名（≤12字）" maxlength="12"/><button class="btn small" data-act="user-add">添加</button></div>';
  if(meta.names.length>1)h+='<div class="udel"><button class="btn small red" data-act="user-del">删除当前用户「'+esc(USER)+'」</button></div>';
  h+='<div class="uhint">每人进度独立保存在本机浏览器</div></div>';
  el.innerHTML=h;
}
function switchUser(name){
  const meta=readMeta();if(!meta||meta.names.indexOf(name)<0||name===USER)return;
  save();clearSession();USER=name;meta.current=name;writeMeta(meta);loadUser();
  S.session=null;S.result=null;S.resumedBanner=false;showView('home');
}
function addUser(){
  const inp=$('newUserName');if(!inp)return;
  let name=(inp.value||'').trim();
  if(!name){alert('请输入用户名');return;}
  if(name.length>12)name=name.slice(0,12);
  const meta=readMeta()||{current:USER,names:[USER]};
  if(meta.names.indexOf(name)>-1){alert('该用户名已存在');return;}
  save();clearSession();
  meta.names.push(name);meta.current=name;writeMeta(meta);
  try{localStorage.setItem(ukey(name),JSON.stringify({rec:{},streak:{last:'',days:0}}))}catch(e){}
  USER=name;loadUser();
  S.session=null;S.result=null;S.resumedBanner=false;showView('home');
}
function delUser(){
  const meta=readMeta();if(!meta||meta.names.length<=1)return;
  if(!confirm('确定删除用户「'+USER+'」？该用户的所有复习进度将被清除，不可恢复。'))return;
  try{localStorage.removeItem(ukey(USER))}catch(e){}
  clearSession();
  meta.names=meta.names.filter(function(n){return n!==USER});
  USER=meta.names[0];meta.current=USER;writeMeta(meta);loadUser();
  S.session=null;S.result=null;S.resumedBanner=false;showView('home');
}
/* ---------- views ---------- */
function showView(v){
  S.view=v;
  document.querySelectorAll('.view').forEach(function(el){el.classList.toggle('on',el.id==='view-'+v)});
  document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('on',b.dataset.view===v)});
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function render(){
  updateStreak();
  renderUserBox();
  if(S.view==='home')renderHome();
  else if(S.view==='practice')renderPractice();
  else if(S.view==='wrong')renderWrong();
  else if(S.view==='cards')renderCards();
  else if(S.view==='exam')renderExam();
}
function updateStreak(){
  const el=$('streak'); if(el)el.innerHTML='连续学习 <b>'+(DB.streak.days||0)+'</b> 天';
}
function ringHTML(pct,size){
  const p=Math.max(0,Math.min(100,pct));
  return '<div class="ring" style="width:'+size+'px;height:'+size+'px"><svg viewBox="0 0 100 100">'
   +'<circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="7"/>'
   +'<circle cx="50" cy="50" r="42" fill="none" stroke="#e0b567" stroke-width="7" pathLength="100" stroke-dasharray="'+p+' '+(100-p)+'" transform="rotate(-90 50 50)"/>'
   +'</svg><div class="num"><div><b>'+pct+'%</b><small>题库覆盖</small></div></div></div>';
}
function renderHome(){
  const st=stats(), pct=Math.round(st.seen/st.total*100);
  const wrong=wrongIds().slice(0,4);
  let h='';
  h+='<div class="card hero"><div class="hero-main">'
   +'<div class="kicker">ECONOMIC LAW · 期末冲刺</div>'
   +'<h2>把五个章节，<br><em>重新过一遍。</em></h2>'
   +'<p class="hero-sub">'+st.total+' 道精选题，全部取自课程课件与配套习题。先练薄弱章节，再用错题本收口，最后做一套模拟卷。</p>'
   +'<div class="hero-actions">'
   +'<button class="btn primary" data-act="start-random">今日推荐 · 随机 20 题</button>'
   +'<button class="btn" data-act="start-wrong">错题重练'+(st.wrongQ?'（'+st.wrongQ+'）':'')+'</button>'
   +'<button class="btn" data-act="start-case">大题专练</button>'
   +'<button class="btn ghost" data-act="go-exam">模拟考</button>'
   +'</div></div>'
   +'<div class="hero-side">'+ringHTML(pct,150)+'<p>已练 '+st.seen+' / '+st.total+' 题</p><p>正确率 '+st.acc+'%</p></div>'
   +'</div>';
  h+='<div class="stat-grid">'
   +statCard('累计作答',st.attempts+' <span style="font-size:12px;color:#8a8375">次</span>','')
   +statCard('正确率',st.acc+'%','')
   +statCard('已掌握',st.mastered+' 题','连续答对 2 次视为掌握')
   +statCard('待攻克错题',st.wrongQ+' 题','')
   +'</div>';
  h+='<div class="sect-title"><h2>章节推进</h2><span>点击任一章节开始顺序练习</span></div><div class="chap-grid">';
  CH.forEach(function(c){
    const cs=chapStats(c.key), p=cs.total?Math.round(cs.seen/cs.total*100):0;
    h+='<button class="card chap" data-act="start-ch" data-ch="'+c.key+'">'
     +'<div class="no" style="color:'+c.color+'">'+c.num+'</div>'
     +'<div class="mid"><h3>'+c.name+'</h3><div class="meta">'+cs.total+' 题 · 已练 '+cs.seen+' · 正确率 '+cs.acc+'%</div>'
     +'<div class="prog"><i style="width:'+p+'%"></i></div></div>'
     +'<div class="go">开始</div></button>';
  });
  h+='</div>';
  if(wrong.length){
    h+='<div class="sect-title"><h2>最近错题</h2><span>建议当天回看一遍</span></div><div class="card recent">';
    wrong.forEach(function(id){
      const q=byId[id], r=DB.rec[id];
      h+='<div class="row"><span class="tag">'+q.ch+'</span><span class="txt">'+esc(q.q.replace(/\n/g,' '))+'</span>'
       +'<span class="tag" style="color:#ad3a2e;border-color:#e3b3ad">错 '+(r.wrong||0)+'</span>'
       +'<button class="btn small" data-act="practice-one" data-id="'+id+'">重练</button></div>';
    });
    h+='</div>';
  }
  $('homeBody').innerHTML=h;
}
function statCard(label,val,sub){
  return '<div class="card stat"><span>'+label+'</span><b>'+val+'</b>'+(sub?'<div style="font-size:11px;color:#9a9284;margin-top:4px">'+sub+'</div>':'')+'</div>';
}

/* ---------- practice ---------- */
function renderLauncher(){
  let h='<div class="sect-title"><h2>选择练习方式</h2><span>顺序练习更稳，随机练习更接近考场</span></div>';
  h+='<div class="chap-grid">';
  CH.forEach(function(c){
    const cs=chapStats(c.key), p=cs.total?Math.round(cs.seen/cs.total*100):0;
    h+='<button class="card chap" data-act="start-ch" data-ch="'+c.key+'">'
     +'<div class="no" style="color:'+c.color+'">'+c.num+'</div>'
     +'<div class="mid"><h3>'+c.name+'</h3><div class="meta">'+cs.total+' 题 · 已练 '+cs.seen+' · 正确率 '+cs.acc+'%</div>'
     +'<div class="prog"><i style="width:'+p+'%"></i></div></div><div class="go">开始</div></button>';
  });
  h+='</div>';
  h+='<div class="sect-title"><h2>快捷入口</h2></div>';
  h+='<div class="chap-grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">'
   +'<button class="card chap" data-act="start-random"><div class="no">随</div><div class="mid"><h3>随机 20 题</h3><div class="meta">跨章节混合抽取</div></div></button>'
   +'<button class="card chap" data-act="start-wrong"><div class="no">错</div><div class="mid"><h3>错题重练</h3><div class="meta">按错误次数排序</div></div></button>'
   +'<button class="card chap" data-act="start-book"><div class="no">藏</div><div class="mid"><h3>收藏题目</h3><div class="meta">你标记过的题</div></div></button>'
   +'<button class="card chap" data-act="start-case"><div class="no">案</div><div class="mid"><h3>大题专练</h3><div class="meta">'+BANK.filter(function(q){return q.type==='case'}).length+' 道案例分析 · 顺序练习</div></div></button>'
   +'</div>';
  $('practiceBody').innerHTML=h;
}
function startSession(ids,opts){
  opts=opts||{};
  ids=ids.filter(function(id){return byId[id]});
  if(!ids.length){alert('这里还没有题目。');return;}
  clearInterval(S.timer); S.timer=null; S.result=null; S.resumedBanner=false;
  S.session={ids:ids,idx:0,picked:{},graded:{},revealed:{},exam:!!opts.exam,title:opts.title||'练习',start:Date.now(),limit:opts.limit||0,deadline:opts.limit?Date.now()+opts.limit*1000:0};
  showView('practice');
  if(opts.exam)beginTimer();
}
function beginTimer(){
  clearInterval(S.timer);
  S.timer=setInterval(function(){
    const s=S.session;
    if(!s||!s.exam){clearInterval(S.timer);S.timer=null;return;}
    const left=s.deadline-Date.now();
    const t=$('timer');
    if(t)t.textContent=fmt(Math.max(0,left));
    if(left<=0){clearInterval(S.timer);S.timer=null;finishSession();}
  },1000);
  const t=$('timer'); if(t)t.textContent=fmt(Math.max(0,S.session.deadline-Date.now()));
}
function fmt(ms){
  const s=Math.max(0,Math.floor(ms/1000)), m=Math.floor(s/60), ss=s%60;
  return (m<10?'0':'')+m+':'+(ss<10?'0':'')+ss;
}
function renderPractice(){
  if(S.result){renderResult();return;}
  const s=S.session;
  if(!s){renderLauncher();return;}
  const q=byId[s.ids[s.idx]], g=s.graded[q.id], picked=s.picked[q.id]||[];
  const N=s.ids.length, pos=s.idx+1;
  let h='';
  if(s.exam){
    h+='<div class="pbar"><span class="chip" style="border-color:#ad3a2e;color:#ad3a2e">模拟考 · '+s.title+'</span><span class="timer" id="timer">'+fmt(Math.max(0,s.deadline-Date.now()))+'</span><span class="pnum">'+pos+' / '+N+'</span><div style="flex:1"></div><button class="btn small red" data-act="submit-exam">交卷</button></div>';
  }else{
    h+='<div class="pbar"><span class="pnum">'+pos+' / '+N+'</span><div class="track"><i style="width:'+(pos/N*100)+'%"></i></div><span class="pnum">'+Math.round((pos/N)*100)+'%</span></div>';
  }
  if(S.resumedBanner){h+='<div class="resume-bar"><span>⏵ 已恢复上次的「'+esc(s.title)+'」进度（第 '+(s.idx+1)+' / '+N+' 题），可继续作答。</span><button class="btn small" data-act="resume-abandon">放弃进度</button></div>';S.resumedBanner=false;}
  h+='<div class="card qcard">';
  h+='<div class="qhead"><span class="chip ch">'+q.ch+'</span><span class="chip ty '+q.type+'">'+TYPES[q.type]+'</span>'
   +'<span class="qidx">第 '+pos+' 题 / 共 '+N+' 题</span>'
   +'<button class="star'+(rec(q.id).book?' on':'')+'" data-act="book" data-id="'+q.id+'" title="收藏">★</button></div>';
  h+='<div class="stem">'+esc(q.q)+'</div>';
  if(q.type==='case'){
    h+='<textarea class="case-input" placeholder="'+(s.exam?'案例题 · 请在草稿纸上作答，交卷后统一查看参考答案并自评。':'先在纸上列要点，再展开参考答案对照。考试时这类题按要点给分。')+'">'+esc((s.draft&&s.draft[q.id])||'')+'</textarea>';
    if(s.exam){
      h+='<div style="margin-top:10px;font-size:12px;color:#8a8375">案例分析题 · 不自动判分，交卷后显示参考答案并按要点自评</div>';
    }else if(!s.revealed[q.id]){
      h+='<div style="margin-top:12px"><button class="btn" data-act="case-reveal">显示参考答案</button></div>';
    }else{
      h+='<div class="case-box"><h4>参考答案 · 要点</h4><div class="ans">'+esc(q.a)+'</div></div>';
      if(!g){
        h+='<div class="selfcheck"><button class="btn primary" data-act="case-ok">我答对了</button><button class="btn" data-act="case-bad">还要复习</button></div>';
      }else{
        h+='<div class="explain '+(g.ok?'right':'bad')+'"><div class="verdict">'+(g.ok?'已标记掌握':'已加入错题本')+'</div>'+esc(q.e||'')+'</div>';
      }
    }
  }else{
    h+='<div class="options">';
    optionsOf(q).forEach(function(o){
      let cls='';
      if(g){
        if(answerKeys(q).indexOf(o.k)>-1)cls='right';
        else if(picked.indexOf(o.k)>-1)cls='bad';
        else cls='dim';
      }else if(picked.indexOf(o.k)>-1){cls='sel';}
      h+='<button class="opt '+cls+'" data-act="opt" data-k="'+o.k+'"><span class="key">'+o.k+'</span><span class="txt">'+esc(o.t)+'</span></button>';
    });
    h+='</div>';
    if(g){
      const ok=g.ok;
      h+='<div class="explain '+(ok?'right':'bad')+'"><div class="verdict">'+(ok?'回答正确':'回答错误')+'　<span class="ans">正确答案：'+esc(answerText(q))+'</span></div>'+esc(q.e||'')+'</div>';
    }
  }
  h+='<div class="qfoot"><span class="hint">'+(s.exam?'考试模式：可自由跳题，交卷后统一判分':'快捷键：<kbd>A</kbd><kbd>B</kbd><kbd>C</kbd><kbd>D</kbd> 选择 · <kbd>Enter</kbd> 下一题')+'</span>'
   +'<button class="btn small" data-act="prev"'+(s.idx===0?' disabled':'')+'>上一题</button>';
  if(!s.exam&&q.type==='multi'&&!g){
    h+='<button class="btn primary" data-act="submit-multi"'+(picked.length?'':' disabled')+'>提交答案</button>';
  }else if(s.exam&&pos===N){
    h+='<button class="btn primary" data-act="submit-exam">交卷</button>';
  }else{
    h+='<button class="btn primary" data-act="next">'+(pos===N?'完成本题组':'下一题 →')+'</button>';
  }
  h+='</div>';
  h+='<div class="mini-list">';
  s.ids.forEach(function(id,i){
    let cls='';
    const gg=s.graded[id], pp=s.picked[id]||[];
    if(gg)cls=gg.ok?'right':'bad'; else if(pp.length)cls='on';
    if(i===s.idx)cls+=' now';
    h+='<button class="mini '+cls+'" data-act="jump" data-i="'+i+'">'+(i+1)+'</button>';
  });
  h+='</div></div>';
  $('practiceBody').innerHTML=h;
  if(S.session)saveSession();
}
function gradeCurrent(){
  const s=S.session, q=byId[s.ids[s.idx]];
  const picked=s.picked[q.id]||[];
  const ok=isCorrect(q,picked);
  s.graded[q.id]={picked:picked.slice(),ok:ok};
  record(q,ok);
  renderPractice();
  const ex=document.querySelector('.explain');
  if(ex)ex.scrollIntoView({behavior:'smooth',block:'center'});
}
function choose(k){
  const s=S.session, q=byId[s.ids[s.idx]];
  if(!s||!q||q.type==='case')return;
  if(s.graded[q.id])return;
  const picked=s.picked[q.id]||[];
  if(q.type==='multi'){
    const i=picked.indexOf(k);
    if(i>-1)picked.splice(i,1); else picked.push(k);
    s.picked[q.id]=picked;
    renderPractice();
  }else{
    s.picked[q.id]=[k];
    if(s.exam){renderPractice();}
    else gradeCurrent();
  }
}
function goNext(){
  const s=S.session; if(!s)return;
  const q=byId[s.ids[s.idx]];
  if(!s.exam&&q&&q.type==='multi'&&!s.graded[q.id])return;
  if(s.idx<s.ids.length-1){s.idx++;renderPractice();window.scrollTo({top:0,behavior:'smooth'});}
  else if(s.exam){if(confirm('确定交卷吗？未作答题目将计为错误。'))finishSession();}
  else finishSession();
}
function finishSession(){
  const s=S.session; if(!s)return;
  clearInterval(S.timer); S.timer=null; clearSession(); S.resumedBanner=false;
  let answered=0,correct=0,wrongList=[],caseIds=[];
  s.ids.forEach(function(id){
    const q=byId[id];
    if(q.type==='case'){caseIds.push(id);return;}
    let g=s.graded[id];
    if(s.exam){
      const picked=s.picked[id]||[];
      const ok=picked.length?isCorrect(q,picked):false;
      g={picked:picked,ok:ok};
      s.graded[id]=g;
      record(q,ok);
    }
    if(g){answered++; if(g.ok)correct++; else wrongList.push(id);}
    else wrongList.push(id);
  });
  S.result={title:s.title,total:s.ids.length,answered:answered,correct:correct,wrong:wrongList,caseIds:caseIds,time:Date.now()-s.start,exam:s.exam};
  S.session=null;
  renderPractice();
  window.scrollTo({top:0,behavior:'smooth'});
}
function renderResult(){
  const r=S.result;
  const caseIds=r.caseIds||[];
  const objTotal=r.total-caseIds.length;
  const pct=objTotal?Math.round(r.correct/objTotal*100):0;
  let h='<div class="card result">';
  h+='<div class="big">'+pct+'<small>%</small></div>';
  h+='<h2>'+(pct>=85?'稳了，保持手感':pct>=60?'及格线以上，继续收口':'基础还需要再走一遍')+'</h2>';
  h+='<p>'+esc(r.title)+' · 共 '+r.total+' 题'+(caseIds.length?'（客观题 '+objTotal+' · 案例题 '+caseIds.length+'）':'')+' · 用时 '+Math.round(r.time/60000)+' 分钟</p>';
  h+='<div class="result-stats"><div><b>'+r.correct+'</b><span>'+(caseIds.length?'客观答对':'答对')+'</span></div><div><b>'+(objTotal-r.correct)+'</b><span>'+(caseIds.length?'客观答错 / 未答':'答错 / 未答')+'</span></div><div><b>'+pct+'%</b><span>'+(caseIds.length?'客观正确率':'正确率')+'</span></div></div>';
  if(caseIds.length){
    h+='<div style="margin-top:14px;padding:12px 14px;border:1px dashed #c9b486;border-radius:10px;background:rgba(224,181,103,.06)">'
     +'<div style="font-size:13px;color:#7a6a4c;margin-bottom:4px">案例分析题（共 '+caseIds.length+' 道 · 不计入上方客观分，请对照参考答案自评）</div>'
     +'<div class="case-review">';
    caseIds.forEach(function(id,i){
      const q=byId[id];
      h+='<div class="case-item">'
       +'<div class="ci-head" data-act="case-toggle" data-id="'+id+'" style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:8px 0;border-bottom:1px solid rgba(122,106,76,.18)">'
       +'<span style="display:inline-block;min-width:58px;padding:2px 8px;border-radius:6px;background:#e0b567;color:#fff;font-size:11px;text-align:center">案例 '+(i+1)+'</span>'
       +'<span class="tag" style="color:#7a6a4c">'+q.ch+'</span>'
       +'<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#5a5347;font-size:13px">'+esc(q.q.replace(/\n/g,' '))+'</span>'
       +'<span class="arr" style="color:#a89a7e">▸</span></div>'
       +'<div class="ci-body" style="display:none;padding:10px 0 4px">'
       +'<div class="stem" style="white-space:pre-wrap;margin-bottom:10px">'+esc(q.q)+'</div>'
       +'<div class="case-box"><h4>参考答案 · 要点</h4><div class="ans">'+esc(q.a)+'</div></div>'
       +(q.e?'<div class="explain" style="margin-top:8px"><div class="verdict">解析</div>'+esc(q.e)+'</div>':'')
       +'<div class="selfcheck" style="margin-top:10px"><button class="btn primary small" data-act="case-grade" data-id="'+id+'" data-ok="1">我答对了</button><button class="btn small" data-act="case-grade" data-id="'+id+'" data-ok="0">还要复习</button></div>'
       +'</div></div>';
    });
    h+='</div></div>';
  }
  h+='<div class="acts">';
  if(r.wrong.length)h+='<button class="btn primary" data-act="retry-wrong" data-ids="'+r.wrong.join(',')+'">立即重练错题（'+r.wrong.length+'）</button>';
  h+='<button class="btn" data-act="start-random">再来一组随机题</button><button class="btn ghost" data-act="practice-home">重新选择</button><button class="btn ghost" data-act="home">返回概览</button></div></div>';
  $('practiceBody').innerHTML=h;
}

  let h='<div class="sect-title"><h2>错题本</h2><span>连续答对两次自动移出，也可以手动标记掌握</span></div>';

    h+='<div class="card empty"><span class="ic">淨</span>暂时没有待攻克的错题。<br>去“练习”里做一组题，错题会自动收录到这里。</div>';
    $('wrongBody').innerHTML=h; return;
  }
  h+='<div class="wrong-head"><span style="font-size:13px;color:#736d62">共 '+ids.length+' 道待复习</span><div style="display:flex;gap:8px">'
   +'<button class="btn primary" data-act="practice-ids" data-ids="'+ids.join(',')+'">全部重练</button>'

    group.sections.forEach(function(sec,si){

}

/* ---------- exam ---------- */
function renderExam(){
  if(S.session&&S.session.exam){
    $('examBody').innerHTML='<div class="card exam-setup"><h2>考试进行中</h2><p>'+esc(S.session.title)+' · 共 '+S.session.ids.length+' 题</p>'
     +'<div style="display:flex;gap:10px"><button class="btn primary" data-act="resume-exam">继续答题</button><button class="btn red" data-act="submit-exam">立即交卷</button></div></div>';
    return;
  }
  const c=S.examCfg;
  let h='<div class="card exam-setup"><h2>模拟考试</h2><p>含单选、多选、判断与适量案例分析题；客观题交卷后统一判分，案例题查看参考答案后自评。</p>';
  h+='<div class="field"><label>题目数量</label><div class="seg">';
  [20,30,50].forEach(function(n){h+='<button class="'+(c.n===n?'on':'')+'" data-act="exam-n" data-n="'+n+'">'+n+' 题</button>'});
  h+='</div></div>';
  h+='<div class="field"><label>考试时间</label><div class="seg">';
  [20,30,45].forEach(function(m){h+='<button class="'+(c.min===m?'on':'')+'" data-act="exam-min" data-m="'+m+'">'+m+' 分钟</button>'});
  h+='</div></div>';
  h+='<div style="margin-top:8px"><button class="btn primary" data-act="start-exam" style="width:100%;padding:13px">开始考试</button></div>';
  h+='<div class="notice">提示：中途离开页面计时不会暂停。时间到自动交卷，未作答的客观题按错误计入错题本；案例题交卷后自评。</div></div>';
  $('examBody').innerHTML=h;
}

/* ---------- actions ---------- */
document.addEventListener('click',function(e){
  const t=e.target.closest('[data-act]'); if(!t)return;
  const act=t.dataset.act;
  if(act==='start-ch'){
    const ch=t.dataset.ch;
    startSession(BANK.filter(function(q){return q.ch===ch}).map(function(q){return q.id}),{title:ch+' · 顺序练习'});
  }
  else if(act==='start-random'){startSession(shuffle(BANK).slice(0,20).map(function(q){return q.id}),{title:'随机 20 题'});}
  else if(act==='start-wrong'){const ids=wrongIds(); if(!ids.length){alert('目前没有待攻克的错题。');return;} startSession(ids,{title:'错题重练'});}
  else if(act==='start-book'){const ids=Object.keys(DB.rec).filter(function(id){return byId[id]&&DB.rec[id].book}); if(!ids.length){alert('还没有收藏题目，点击题目右上角的星标即可收藏。');return;} startSession(ids,{title:'收藏题重练'});}
  else if(act==='start-case'){const ids=BANK.filter(function(q){return q.type==='case'}).map(function(q){return q.id}); startSession(ids,{title:'大题专练 · 案例分析'});}
  else if(act==='practice-one'){startSession([t.dataset.id],{title:'单题重练'});}
  else if(act==='practice-ids'){startSession(t.dataset.ids.split(','),{title:'错题重练'});}
  else if(act==='opt'){choose(t.dataset.k);}
  else if(act==='submit-multi'){gradeCurrent();}
  else if(act==='prev'){if(S.session&&S.session.idx>0){S.session.idx--;renderPractice();}}
  else if(act==='next'){goNext();}
  else if(act==='jump'){if(S.session){S.session.idx=Number(t.dataset.i);renderPractice();}}
  else if(act==='book'){const r=rec(t.dataset.id);r.book=r.book?0:1;save();renderPractice();}
  else if(act==='case-reveal'){S.session.revealed[byId[S.session.ids[S.session.idx]].id]=true;renderPractice();}
  else if(act==='case-ok'||act==='case-bad'){
    const q=byId[S.session.ids[S.session.idx]];
    S.session.graded[q.id]={picked:[],ok:act==='case-ok'};
    record(q,act==='case-ok'); renderPractice();
  }
  else if(act==='case-toggle'){const body=t.nextElementSibling;if(body){const open=body.style.display!=='none';body.style.display=open?'none':'block';const arr=t.querySelector('.arr');if(arr)arr.textContent=open?'▸':'▾';}}
  else if(act==='case-grade'){const id=t.dataset.id,ok=t.dataset.ok==='1';const q=byId[id];if(q){record(q,ok);const sc=t.parentElement;if(sc)sc.innerHTML='<span style="font-size:12px;color:'+(ok?'#3d7a4f':'#ad3a2e')+'">'+(ok?'已标记掌握 ✓':'已加入错题本 ✗')+'</span>';}}
  else if(act==='user-toggle'){const p=$('upop');if(p)p.style.display=(p.style.display==='none'?'block':'none');}
  else if(act==='user-switch'){switchUser(t.dataset.name);}
  else if(act==='user-add'){addUser();}
  else if(act==='user-del'){delUser();}
  else if(act==='resume-abandon'){if(confirm('放弃当前未完成的答题进度？')){S.session=null;S.result=null;S.resumedBanner=false;clearSession();showView('practice');}}
  else if(act==='retry-wrong'){startSession(t.dataset.ids.split(','),{title:'错题重练'});}
  else if(act==='home'){showView('home');}
  else if(act==='master'){const r=rec(t.dataset.id);r.streak=2;save();renderWrong();}
  else if(act==='clear-mastered'){wrongIds().forEach(function(id){DB.rec[id].streak=2});save();renderWrong();}
  else if(act==='kfilter'){S.kfilter=t.dataset.ch;renderCards();}
  else if(act==='ktoggle'){const k=t.dataset.k;const willOpen=S.kopen[k]===false;S.kopen[k]=willOpen?true:false;t.parentElement.classList.toggle('open',willOpen);}
  else if(act==='practice-home'){S.result=null;renderPractice();}
  else if(act==='exam-n'){S.examCfg.n=Number(t.dataset.n);renderExam();}
  else if(act==='exam-min'){S.examCfg.min=Number(t.dataset.m);renderExam();}
  else if(act==='start-exam'){
    const casePool=BANK.filter(function(q){return q.type==='case'});
    const objPool=BANK.filter(function(q){return q.type!=='case'});
    const caseN=Math.max(1,Math.round(S.examCfg.n*0.1));
    const n=Math.min(S.examCfg.n,casePool.length+objPool.length);
    const takeCase=Math.min(caseN,n,casePool.length);
    const caseIds=shuffle(casePool).slice(0,takeCase).map(function(q){return q.id});
    const objIds=shuffle(objPool).slice(0,n-caseIds.length).map(function(q){return q.id});
    startSession(shuffle(caseIds.concat(objIds)),{exam:true,title:'模拟考',limit:S.examCfg.min*60});
  }
  else if(act==='submit-exam'){if(S.session&&S.session.exam&&confirm('确定交卷吗？未作答题目将计为错误。'))finishSession();}
  else if(act==='resume-exam'){showView('practice');}
  else if(act==='go-exam'){showView('exam');}
});
document.addEventListener('click',function(e){
  const p=$('upop');if(!p||p.style.display==='none')return;
  if(!e.target.closest('#userbox'))p.style.display='none';
});
document.addEventListener('input',function(e){
  const ta=e.target.closest('.case-input');if(!ta||!S.session)return;
  const q=byId[S.session.ids[S.session.idx]];if(!q||q.type!=='case')return;
  S.session.draft=S.session.draft||{};S.session.draft[q.id]=ta.value;saveSession();
});
document.querySelectorAll('.tab').forEach(function(b){
  b.addEventListener('click',function(){showView(b.dataset.view);});
});
document.addEventListener('keydown',function(e){
  if(S.view!=='practice'||!S.session)return;
  const tag=(e.target.tagName||'').toUpperCase();
  if(tag==='INPUT'||tag==='TEXTAREA')return;
  const s=S.session,q=byId[s.ids[s.idx]];
  if(e.key==='Enter'){
    if(tag==='BUTTON')return;
    const g=s.graded[q.id];
    if(q.type==='multi'&&!g&&!s.exam)gradeCurrent();
    else if(g||s.exam)goNext();
    e.preventDefault();return;
  }
  if(q.type==='case')return;
  let k=null;
  if(/^[1-4]$/.test(e.key))k=String.fromCharCode(64+Number(e.key));
  else if(/^[abcd]$/i.test(e.key))k=e.key.toUpperCase();
  if(k&&optionsOf(q).some(function(o){return o.k===k})){choose(k);e.preventDefault();}
});

/* init */
(function restore(){
  try{
    const raw=localStorage.getItem(sessKey(USER));
    if(raw){
      const o=JSON.parse(raw);const sess=o.session;
      if(sess&&sess.ids&&sess.ids.length){
        const age=Date.now()-(o.savedAt||0);
        sess.ids=sess.ids.filter(function(id){return byId[id]});
        if(sess.ids.length&&age<=7*86400000){
          if(sess.idx>=sess.ids.length)sess.idx=sess.ids.length-1;
          if(sess.exam&&sess.deadline&&sess.deadline<=Date.now()){
            S.session=sess;S.view='practice';finishSession();
          }else{
            S.session=sess;S.view='practice';S.resumedBanner=true;
            if(sess.exam)beginTimer();
          }
        }else{localStorage.removeItem(sessKey(USER));}
      }else{localStorage.removeItem(sessKey(USER));}
    }
  }catch(e){try{localStorage.removeItem(sessKey(USER))}catch(e2){}}
})();
render();
})();
</script>
</body>
